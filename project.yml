name: VitaLiber
options:
  bundleIdPrefix: com.vitaliber
  deploymentTarget: { iOS: "16.0" }   # 子项目 I：iOS/iPadOS 16+（Perception 回移植）
  # 三文件本地化纪律（tech-spec §3）：zh-Hans 为开发区域，zh-Hant/en 平价交付。
  # 未登记 knownRegions 时 xcodegen 只会打包 Base + 已存在的 .lproj，
  # zh-Hant 新增后必须同步登记，否则 SU-M15-L10N 的键集断言在设备上取不到该本地化。
  developmentLanguage: zh-Hans
  knownRegions: [zh-Hans, zh-Hant, en, Base]
packages:
  CoreKit: { path: CoreKit }
  GRDB.swift:
    url: https://github.com/groue/GRDB.swift.git
    majorVersion: 6.29.0
  swift-perception:
    url: https://github.com/pointfreeco/swift-perception
    exactVersion: 2.0.12   # 与 CoreKit from: "2.0.12" 同解；App 侧 xcodeproj 不入库，钉精确版保证 CI 可重现
  xctest-dynamic-overlay:
    url: https://github.com/pointfreeco/xctest-dynamic-overlay
    exactVersion: 1.13.1   # swift-perception 传递依赖；@Perceptible 宏展开直接调用 IssueReporting，App 须显式链接（CI 34759901369）
targets:
  VitaLiber:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        excludes: ["ASRModels", "ASRModels/**", "ASRModelUpdates", "ASRModelUpdates/**"]
      - path: Resources/ASRModels
        type: folder
        buildPhase: resources
      # T2 本机 LLM（业主 2026-09-17 定：llama 模型随包内置）——GGUF 文件夹引用入 bundle；
      # 模型文件不入库（.gitignore /Resources/LLMModels/*.gguf），由 materialize 脚本按
      # catalog.json sha256 校验取模（CI 与本地同源）。
      - path: Resources/LLMModels
        type: folder
        buildPhase: resources
    preBuildScripts:
      # 每次编译从受审查提交中的已签名目录生成基线，生成物最后在 App 签名前嵌入。
      # 签名私钥仅在发布者本地，CI/编译只验证公开 Root 与 catalog。
      - name: Generate trusted model hashes
        script: |
          set -eu
          "${MODEL_PYTHON:-python3}" "$SRCROOT/.github/workflows/model-trust.py" build \
            --root "$SRCROOT/Resources/ModelTrustRoot.json" \
            --catalog "$SRCROOT/Resources/ASRModelUpdates/catalog.json" \
            --index "$SRCROOT/Resources/ASRModelUpdates/index.json" \
            --output "$DERIVED_FILE_DIR/TrustedModelHashes.json"
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed generated model trust
        script: |
          set -eu
          install -m 0644 "$DERIVED_FILE_DIR/TrustedModelHashes.json" \
            "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/TrustedModelHashes.json"
        basedOnDependencyAnalysis: false
      - name: Reconcile embedded framework minimum OS
        script: python3 "$SRCROOT/.github/workflows/reconcile-frameworks.py" --app "$TARGET_BUILD_DIR/$WRAPPER_NAME" --repair
        basedOnDependencyAnalysis: false
    # F16 只读接入 Apple 健康（FR16.1）：HealthKit capability + 只读授权
    # （不申请写入——数据方向是单向读取，符合最小必要访问）
    entitlements:
      path: VitaLiber.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 青囊书
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_FILE: VitaLiber-Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.vitaliber.app
        # 三部件版本（dev-pm-spec §9.3 / FR22.8）：GitHub Release 版本 + CI 构建序号 + 提交哈希。
        # CI 在 xcodebuild 时覆盖注入；本地构建回落默认值。
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        VITA_LIBER_CODE_HASH: "dev"
        # framework列表由SPM生成；脚本必须读写嵌入产物并重签，最终IPA另有只读验证。
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # GRDB 直连（ERR#31 同族，第 18 轮 CI 实证）：AppContainer 经 GRDBStore.writer
    # 把 GRDB.DatabaseWriter 暴露进 App 层签名，AppContainer.o 引用 GRDB 协议
    # 描述符——仅靠 CoreKit 传递链接，ld 报 "protocol descriptor for
    # GRDB.DatabaseWriter symbol(s) not found"。App 只链接不 import GRDB，
    # 分层不变（后续可登记技术债：Infrastructure 公开 API 消除 GRDB 类型泄漏）。
    # swift-perception 直连：App 源码直接 import Perception（宏 + WithPerceptionTracking），
    # 须直连产品（同 GRDB ERR#31 理由）。
    dependencies: [{ package: CoreKit }, { package: GRDB.swift, product: GRDB }, { package: swift-perception, product: Perception }, { package: xctest-dynamic-overlay, product: IssueReporting }]
  VitaLiberTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/VitaLiberTests]
    # CoreKit 直连（不只是通过 VitaLiber 传递）：TC-M0-06 运行时断言需要 import
    # Domain/Infrastructure，且 GRDB 只在 iOS/macOS 链接（ERR#8），本目标是这些
    # 断言唯一真实生效的执行位置。CoreKit 包内测试（CoreKitTests）不进 scheme——
    # XcodeGen 不支持包测试目标引用（Spec validation error，CI 34017824105 实证），
    # 由工作流在 macOS runner 上 `swift test` 真实执行（2026-09-06 业主决定
    # 移除 Linux 容器测试 job——单一执行平面，见 build-testflight.yml）。
    # GRDB 亦需直连：测试代码直接调用了 Int.fetchOne 等 GRDB API，其 protocol
    # witness table 必须能解析到 GRDB 库——仅靠 CoreKit 的传递链接，ld 报
    # "protocol witness table for Swift.Int : GRDB.StatementColumnConvertible ...
    # symbol(s) not found for architecture arm64"（ERR#31）。
    # swift-perception 直连：HomeProfileProgressTests 用 withPerceptionTracking。
    dependencies: [{ target: VitaLiber }, { package: CoreKit }, { package: GRDB.swift, product: GRDB }, { package: swift-perception, product: Perception }, { package: xctest-dynamic-overlay, product: IssueReporting }]
  VitaLiberUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests/VitaLiberUITests]
    dependencies: [{ target: VitaLiber }]
schemes:
  VitaLiber:
    build: { targets: { VitaLiber: all, VitaLiberTests: [test], VitaLiberUITests: [test] } }
    test:
      # CoreKit 包内测试不进 scheme：XcodeGen 校验拒绝包测试目标引用
      # （"Scheme has invalid test target"）。Domain 层套件由工作流
      # `swift test` 步骤在 macOS runner 真实执行（同样阻断上传链）。
      targets: [VitaLiberTests, VitaLiberUITests]
    # 评审修正：xcodebuild archive 使用 scheme 的 ArchiveAction 配置（命令行
    # -configuration 对 archive 无效）。XcodeGen 未显式声明时默认 Debug——
    # 归档产物落在 Debug-iphoneos，SPM bundle 路径随之错位报 lstat 错误。
    archive:
      config: Release
