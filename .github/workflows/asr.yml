# ASR 下载文件构建与发布（2026-10-08 业主指令＝无开关、无门禁的全自动 CI）：
# asr 相关路径的 master 推送自动触发全链（verify 验收 ∥ models 构建发布并联），
# workflow_dispatch 手动等价、workflow_call 供上层调用；链路幂等（无变全复用/
# 同名同摘要跳过），测试红即整 run 红且不发布（链内自动闸）。
# 版本面（2026-10-07 业主裁决＝全自动）：每次 run 由 .github/config/asr/models.json
# 的 watch 规则解析上游最新版——内容有变即滚动 pin（下载实测）→ 动态派生身份
# （version/builtAt/artifactRevision r+1）→ 强制重建；无变则全量复用。次源锁定文件
# 与解析失败条目保留现行 pin（解析失败仅告警，绝不猜测版本）。
name: Build ASR Model Packages

on:
  workflow_call:
    secrets:
      # 2026-10-03 cutover 定案:CNB 是唯一发布目的地;发布步骤缺失该令牌 = 硬红
      # (跳过发布 = 新签名目录从未进 CNB inventory,比红更糟的静默坏)。
      # 2026-10-05 审查:required 从 true 降为 false——required:true 在调用时
      # 空值会让父工作流 0-3 秒 startup_failure 且无日志(12:08/12:29 实证,
      # elizaOS 同族修复最佳实践);硬红语义移入 job 内「发布前置校验」步,
      # 红得可见、可定位。
      CNB_RESOURCE_TOKEN:
        required: false
      # 2026-10-05 业主指令:目录签名密钥入 secrets(轮换时生成候选签名目录,
      # 人工提交后再跑验证链)——缺失只跳过候选签名,不阻断构建/验证。
      ASR_SIGNING_KEYS_JSON:
        required: false
      # 2026-10-05 业主 R1:下载包必须加密——32 字节 hex 主密钥(与 App 内嵌
      # ASRPackageCrypto 常量同值,test-asr-package-integrity 断言一致)。
      # 缺失 = 构建/缓存解密硬红(绝不静默发明文包)。引导已本地脚本化
      # (.github/actions/release/init_asr_secrets.py,初始化阶段执行过);CI 只校验
      # 有值(见「包加密密钥前置校验」步)。required 降为 false 消除无日志
      # startup_failure 族(elizaOS 同族修复最佳实践)。
      ASR_PACKAGE_KEY:
        required: false
  workflow_dispatch:
  # 全自动化（2026-10-08 业主指令：无开关、无门禁的全自动 CI）：asr 相关
  # 路径的 master 推送即自动跑全链（verify 验收 ∥ models 构建发布）——
  # 链路幂等（无变全复用/同名同摘要跳过），测试红即红不发布（链内自动闸,
  # 非人工开关）。verify_only 输入已删除（单形态:dispatch=push=全链）。
  push:
    branches: [master]
    paths:
      - ".github/actions/release/**"
      - ".github/config/asr/**"
      - ".github/config/requirements/**"
      - ".github/workflows/asr.yml"
      - "Resources/ASRModels/**"
      - "Resources/ASRModelUpdates/**"

permissions:
  contents: read

concurrency:
  group: asr-models-${{ github.repository }}
  cancel-in-progress: false

jobs:

  # ═══════════════════════════════════════════════════════════════
  # 单职拆分（2026-10-08 业主指令）：每 job 一个任务,出错定位到段;段间以
  # artifacts 传递本次 run 文件（upload-artifact / download-artifact）。
  #   ① preflight ∥ ② battery → ③ resolve → ④ project → ⑤ build →
  #   ⑥ sign → ⑦ publish;⑧ catalog-draft → ⑨ verify（目录面并联）。
  # 大文件边界：源树/包只在 ⑤ 内流转（3.4GB packages 一趟 artifact,
  # compression-level 0）;其余全部小件传递。密钥面按段收窄：加密钥仅 ⑤,
  # 签名密钥仅 ⑥,CNB 令牌仅 ⑦。
  # ═══════════════════════════════════════════════════════════════
  preflight:
    name: ① 密钥与令牌前置校验（秒级,无 checkout）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 包加密密钥前置校验（必须有值）
        env:
          ASR_PACKAGE_KEY: ${{ secrets.ASR_PACKAGE_KEY }}
        run: |
          if [ -z "$ASR_PACKAGE_KEY" ]; then
            echo "::error::ASR_PACKAGE_KEY 缺失/为空——无法构建加密包。本地执行 python3 .github/actions/release/init_asr_secrets.py --repo robinhoo1973/Vita-Liber 引导后重跑" >&2
            exit 1
          fi

      # 2026-10-05 审查修复:CNB_RESOURCE_TOKEN required 降级后,硬红语义在此
      # 显式落回——startup_failure 换成带日志的 job 内硬错(快速失败,不烧
      # 构建分钟)。
      - name: CNB 令牌前置校验（发布是本链的既定终点）
        env:
          CNB_TOKEN: ${{ secrets.CNB_RESOURCE_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::error::CNB_RESOURCE_TOKEN 缺失/为空——新签名目录将永远进不了 CNB inventory（比红更糟的静默坏）；补建 secret 后重跑" >&2
            exit 1
          fi


  battery:
    name: ② 离线契约电池（测试全列+模板验签）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/config/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:密钥引导为本地脚本(.github/actions/release/init_asr_secrets.py,
      # 初始化阶段已执行:生成 → 注册 secret → 改写 App 内嵌密钥与测试常量);
      # CI 只校验有值——缺失/为空 = 带日志硬错(绝不静默发明文包)。

      - name: 校验构建、签名及版本规则
        run: |
          python3 .github/actions/release/test-release-version.py
          python3 .github/actions/release/test-next-catalog-version.py
          python3 .github/actions/release/test-asr-assets.py
          python3 .github/actions/release/test-asr-secrets-init.py
          python3 .github/actions/release/test-asr-package-integrity.py
          python3 .github/actions/release/test-model-trust.py
          python3 .github/actions/release/test-asr-release.py
          python3 .github/actions/release/test-asr-release-page.py
          python3 .github/actions/release/test-medical-package-fixture.py
          # 2026-10-07 评审接线：此前 39 例从未被任何 runner 执行（三脚本离线可跑已实证）
          python3 .github/actions/release/test-cnb-release.py
          python3 .github/actions/release/test-cnb-release-workflow.py
          python3 .github/actions/release/test-seed-cnb-model-assets.py
          python3 .github/actions/release/test-asr-overview.py
          # 2026-10-07 config 批：config（.github/config/asr/models.json）→
          # 源清单投影逐字节复现（迁移验收基准）。
          python3 .github/actions/release/test-asr-config-projection.py
          # 2026-10-07 全自动升级批：上游解析（plan/apply/unknown 语义）+ CLI 入口形状。
          python3 .github/actions/release/test-resolve-asr-models.py
          # 2026-10-08 文案链批：投影器（负清单/覆盖/修订键控）+ 变化集单源。
          python3 .github/actions/release/test-apply-asr-catalog-copy.py
          python3 .github/actions/release/test-asr-change-set.py
          # 2026-10-08 bootstrap 批：按名发现工具的纯函数面（离线）。
          python3 .github/actions/release/test-bootstrap-asr-model.py
          # 2026-10-08 治理批：仓库模板信封必须验签——此前 Linux 链无人验，
          # 「改模板不重签」可经 CI 重签发布；发布前硬红闭合该盲路。
          python3 .github/actions/release/model-trust.py verify \
            --root Resources/ModelTrustRoot.json \
            --catalog Resources/ASRModelUpdates/manifest.json

      # 全自动升级批（2026-10-07 业主裁决）：解析上游最新版——内容有变即下载
      # 实测并滚动 pin；解析失败保留现行 pin 仅告警；实测失败=硬错（fail-closed）。


  resolve:
    name: ③ 上游解析（滚动 pin → config artifact）
    needs: [preflight, battery]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      resolved_artifact: ${{ steps.names.outputs.resolved_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/config/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:密钥引导为本地脚本(.github/actions/release/init_asr_secrets.py,
      # 初始化阶段已执行:生成 → 注册 secret → 改写 App 内嵌密钥与测试常量);
      # CI 只校验有值——缺失/为空 = 带日志硬错(绝不静默发明文包)。

      - name: 生成 artifact 标识
        id: names
        run: echo "resolved_artifact=asr-resolved-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: 解析上游最新版（config 驱动，全自动）
        env:
          # 提高 api.github.com 匿名限额（只增限额，不改语义；缺失亦可运行）。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/actions/release/resolve-asr-models.py \
            --config .github/config/asr/models.json \
            --apply "$RUNNER_TEMP/asr-resolved/config.json" \
            --report "$RUNNER_TEMP/asr-resolved/report.json" \
            --workdir "$RUNNER_TEMP/asr-resolve-dl"

      - name: 上传解析产物（artifact:asr-resolved）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ steps.names.outputs.resolved_artifact }}
          path: |
            ${{ runner.temp }}/asr-resolved/config.json
            ${{ runner.temp }}/asr-resolved/report.json
            ${{ runner.temp }}/asr-resolved/manifest.json
          retention-days: 7
          if-no-files-found: error


  project:
    name: ④ 源清单投影（config → manifest artifact）
    needs: [resolve]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      manifest_artifact: ${{ steps.names.outputs.manifest_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/config/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:密钥引导为本地脚本(.github/actions/release/init_asr_secrets.py,
      # 初始化阶段已执行:生成 → 注册 secret → 改写 App 内嵌密钥与测试常量);
      # CI 只校验有值——缺失/为空 = 带日志硬错(绝不静默发明文包)。

      - name: 生成 artifact 标识
        id: names
        run: echo "manifest_artifact=asr-manifest-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: 下载解析产物（artifact:asr-resolved）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: ${{ needs.resolve.outputs.resolved_artifact }}
          path: ${{ runner.temp }}/asr-resolved

      - name: 投影源清单（config → manifest.json）
        run: |
          python3 .github/actions/release/generate-asr-source-manifest.py \
            --config "$RUNNER_TEMP/asr-resolved/config.json" \
            --output "$RUNNER_TEMP/asr-resolved/manifest.json"

      - name: 上传源清单（artifact:asr-manifest）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ steps.names.outputs.manifest_artifact }}
          path: ${{ runner.temp }}/asr-resolved/manifest.json
          retention-days: 7
          if-no-files-found: error


  build:
    name: ⑤ 源树准备·打包·文案投影（→ packages artifact）
    needs: [resolve, project]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      packages_artifact: ${{ steps.names.outputs.packages_artifact }}
      index_artifact: ${{ steps.names.outputs.index_artifact }}
    env:
      # 包加密主密钥注入本段（prepare 缓存解密 / build 加密共用;非 CNB
      # 写令牌）。缺失/为空由 ① 带日志硬红。
      ASR_PACKAGE_KEY: ${{ secrets.ASR_PACKAGE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/config/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:密钥引导为本地脚本(.github/actions/release/init_asr_secrets.py,
      # 初始化阶段已执行:生成 → 注册 secret → 改写 App 内嵌密钥与测试常量);
      # CI 只校验有值——缺失/为空 = 带日志硬错(绝不静默发明文包)。

      - name: 下载解析产物（artifact:asr-resolved）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: ${{ needs.resolve.outputs.resolved_artifact }}
          path: ${{ runner.temp }}/asr-resolved

      - name: 下载源清单（artifact:asr-manifest）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: ${{ needs.project.outputs.manifest_artifact }}
          path: ${{ runner.temp }}/asr-resolved

      - name: 暂存源清单输入（manifest + 告知/许可件）
        run: |
          mkdir -p "$RUNNER_TEMP/asr-source-input"
          cp "$RUNNER_TEMP/asr-resolved/manifest.json" "$RUNNER_TEMP/asr-source-input/manifest.json"
          cp Resources/ASRModels/NOTICE.md "$RUNNER_TEMP/asr-source-input/NOTICE.md"
          cp Resources/ASRModels/LICENSE-APACHE-2.0.txt "$RUNNER_TEMP/asr-source-input/LICENSE-APACHE-2.0.txt"

      - name: 准备完整钉版权重（优先复用已验证 CNB Release）
        run: |
          python3 .github/actions/release/prepare-asr-source.py \
            --index Resources/ASRModelUpdates/manifest.json \
            --source "$RUNNER_TEMP/asr-source-input" \
            --root "$RUNNER_TEMP/asr-source" \
            --cache "$RUNNER_TEMP/asr-cache" \
            --repository "${{ vars.CNB_RESOURCE_REPOSITORY }}"

      - name: 构建全部模型 ZIP（加密信封；上游滚动条目动态派生新身份）
        run: |
          python3 .github/actions/release/build-asr-packages.py \
            --source-root "$RUNNER_TEMP/asr-source" \
            --index Resources/ASRModelUpdates/manifest.json \
            --output "$RUNNER_TEMP/asr-packages" \
            --reuse-directory "$RUNNER_TEMP/asr-cache" \
            --config "$RUNNER_TEMP/asr-resolved/config.json"

      # 2026-10-06 业主指令(不建议 publish 开关):构建→签名→验证→发布一气呵成。
      # 构建产物在现场以签名密钥签名成发布用 manifest.json(无密钥=硬错,
      # 发布需要签名目录;签名器内置 verify_catalog 自校验含包级签名验真)。
      # 文案链（2026-10-08 委员会终裁）：明文 copy 源在**签名前**投影进构建索引——
      # 文案改动零重建、零本地重签；投影缺失/不齐由投影器 fail-closed，R3 闸兜底。
      - name: 投影文案到构建索引（签名前，copy 源）
        run: |
          python3 .github/actions/release/apply-asr-catalog-copy.py \
            --index "$RUNNER_TEMP/asr-packages/index.json" \
            --copy .github/config/asr/catalog-copy.json

      - name: 生成 artifact 标识
        id: names
        run: |
          echo "packages_artifact=asr-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "index_artifact=asr-index-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: 上传构建索引（artifact:asr-index,供签名段）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ steps.names.outputs.index_artifact }}
          path: |
            ${{ runner.temp }}/asr-packages/index.json
            ${{ runner.temp }}/asr-packages/package-validation.json
          retention-days: 7
          if-no-files-found: error

      - name: 输出完整候选包和校验回执
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.packages_artifact }}
          path: |
            ${{ runner.temp }}/asr-packages/*.zip
            ${{ runner.temp }}/asr-packages/index.json
            ${{ runner.temp }}/asr-packages/package-validation.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error



  sign:
    name: ⑥ 签名目录与验签核对（→ metadata artifact）
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      metadata_artifact: ${{ steps.names.outputs.metadata_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/config/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:密钥引导为本地脚本(.github/actions/release/init_asr_secrets.py,
      # 初始化阶段已执行:生成 → 注册 secret → 改写 App 内嵌密钥与测试常量);
      # CI 只校验有值——缺失/为空 = 带日志硬错(绝不静默发明文包)。

      - name: 生成 artifact 标识
        id: names
        run: echo "metadata_artifact=asr-metadata-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: 下载构建索引（artifact:asr-index）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: ${{ needs.build.outputs.index_artifact }}
          path: ${{ runner.temp }}/asr-packages

      - name: 生成签名目录（发布面单一 manifest.json）
        env:
          ASR_SIGNING_KEYS_JSON: ${{ secrets.ASR_SIGNING_KEYS_JSON }}
        run: |
          if [ -z "$ASR_SIGNING_KEYS_JSON" ]; then
            echo "::error::ASR_SIGNING_KEYS_JSON 缺失——发布需要签名目录（init_asr_secrets 时代已注册,检查 secret）" >&2
            exit 1
          fi
          root_version=$(python3 -c 'import json,base64;print(json.loads(base64.b64decode(json.load(open("Resources/ModelTrustRoot.json"))["payload"]))["version"])')
          catalog_version=$(python3 .github/actions/release/next-catalog-version.py --repository "${{ vars.CNB_RESOURCE_REPOSITORY }}")
          python3 .github/actions/release/sign-asr-catalog.py \
            --root Resources/ModelTrustRoot.json \
            --index "$RUNNER_TEMP/asr-packages/index.json" \
            --root-version "$root_version" \
            --catalog-version "$catalog_version" \
            --output "$RUNNER_TEMP/asr-packages/manifest.json"
          echo "manifest.json 已签名（catalogVersion=$catalog_version）"

      - name: 核对签名目录与实际生成的包索引
        run: |
          python3 .github/actions/release/model-trust.py verify \
            --root Resources/ModelTrustRoot.json \
            --catalog "$RUNNER_TEMP/asr-packages/manifest.json" \
            --index "$RUNNER_TEMP/asr-packages/index.json"

      - name: 上传签名目录（artifact:asr-metadata）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ steps.names.outputs.metadata_artifact }}
          path: |
            ${{ runner.temp }}/asr-packages/index.json
            ${{ runner.temp }}/asr-packages/package-validation.json
            ${{ runner.temp }}/asr-packages/manifest.json
          retention-days: 7
          if-no-files-found: error

  publish:
    name: ⑦ CNB 发布（下载 artifact·回读核对）
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r .github/config/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:密钥引导为本地脚本(.github/actions/release/init_asr_secrets.py,
      # 初始化阶段已执行:生成 → 注册 secret → 改写 App 内嵌密钥与测试常量);
      # CI 只校验有值——缺失/为空 = 带日志硬错(绝不静默发明文包)。

      - name: 下载完整候选包（artifact:packages,compression-level 0）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: ${{ needs.build.outputs.packages_artifact }}
          path: ${{ runner.temp }}/asr-packages

      - name: 下载签名目录（artifact:metadata）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: ${{ needs.sign.outputs.metadata_artifact }}
          path: ${{ runner.temp }}/asr-meta

      - name: 合并签名目录进发布目录
        run: cp "$RUNNER_TEMP/asr-meta/manifest.json" "$RUNNER_TEMP/asr-packages/manifest.json"

      - name: 发布 ASR Release 至 CNB（不可变资产；回读核对）
        env:
          # 令牌仅注入本步骤(定案约束 17):读取/构建步骤无 CNB 写面。
          CNB_TOKEN: ${{ secrets.CNB_RESOURCE_TOKEN }}
          CNB_RESOURCE_REPOSITORY: ${{ vars.CNB_RESOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          # 有界重试防 CNB 资产表最终一致性误杀:发布成功但回读暂不可见是分布式
          # 系统常态;上传幂等(同名同摘要=复用),重试安全。重试仍失败 = 硬红阻断
          # TestFlight(回读失败不得降级为 warning——发布完整性唯一守门点)。
          for attempt in 1 2 3; do
            if python3 .github/actions/release/publish-asr-release.py publish \
                --index "$RUNNER_TEMP/asr-packages/index.json" \
                --directory "$RUNNER_TEMP/asr-packages" \
                --root Resources/ModelTrustRoot.json \
                --catalog "$RUNNER_TEMP/asr-packages/manifest.json" \
                --root-store Resources/ASRModelUpdates \
                --repository "$CNB_RESOURCE_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::CNB publish attempt $attempt failed; retrying" >&2
              sleep $((attempt * 15))
            fi
          done
          echo "::error::CNB publish failed after 3 attempts" >&2
          exit 1


  # ═══════════════════════════════════════════════════════════════
  # ⑧⑨ 目录面（2026-10-08 业主指令：seeds→config 生成显性化）：
  #   ⑧ 目录草案生成——seeds 家族名 → 发现（API 级）→ 深探（重下载实测）
  #      → 产出「可采纳物」:models/catalog-copy 候选 artifact（治理裁决：
  #      CI 只读不直写金样；人工采纳半环 = 复核后写回提交）。
  #   ⑨ 复现验收——下载 ⑤ 的报告 artifact 后断言 + 全景表 + 非 hf-repo
  #      字节补测。零密钥消费、零 CNB 写；全事件运行（push/dispatch/call）。
  #      闭环判据：inventory 全数在册、缺候选 0、未知 0 且 probe 零 mismatch。
  # ═══════════════════════════════════════════════════════════════
  catalog-draft:
    name: ⑧ 目录草案生成（seeds→发现→深探→候选 artifact）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      # 契约电池中的 yaml 消费测试（test-release-version / test-cnb-release-workflow
      # / test-model-trust）需要 PyYAML——与 models job 同一步骤同钉版清单
      # （CI 37722650928 实证：缺装即 ModuleNotFoundError 红）。
      - name: bootstrap 复现验收（inventory + 全档 probe）
        env:
          # 提高 api.github.com 限额（只增限额,不改语义）——匿名共享 runner IP
          # 极易 403 rate limit（2026-10-08 push 自动 run 实证:[unknown] qwen3
          # releases 查询被限流致 in_config 少 1）。与「解析上游最新版」步同法。
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 .github/actions/release/bootstrap-asr-model.py \
            --from-seeds .github/config/asr/seeds.json \
            --compare-config .github/config/asr/models.json \
            --probe \
            --workdir "$RUNNER_TEMP/asr-bootstrap" \
            --out "$RUNNER_TEMP/asr-repro.json" \
            --emit-config-candidates "$RUNNER_TEMP/asr-config-candidates" \
            --catalog-copy .github/config/asr/catalog-copy.json

      # 流程全景与待人工项表（2026-10-08 委员会:可见性+生成物归属）——仅读
      # 报告 JSON,零额外下载;来源标注消除「seeds 如何进 config」歧义。
      - name: 上传候选配置（新家族草案,如有）
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: asr-config-candidates
          path: ${{ runner.temp }}/asr-config-candidates
          retention-days: 7
          if-no-files-found: ignore

      - name: 上传复现报告
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: asr-bootstrap-repro
          path: ${{ runner.temp }}/asr-repro.json
          retention-days: 7
          if-no-files-found: warn

  verify:
    name: ⑨ 复现断言与全景（下载报告 artifact）
    needs: [catalog-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      # 契约电池中的 yaml 消费测试（test-release-version / test-cnb-release-workflow
      # / test-model-trust）需要 PyYAML——与 models job 同一步骤同钉版清单
      # （CI 37722650928 实证：缺装即 ModuleNotFoundError 红）。
      - name: 下载复现报告（artifact:asr-bootstrap-repro）
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4 线钉版（2026-10-07）
        with:
          name: asr-bootstrap-repro
          path: ${{ runner.temp }}

      - name: 流程全景与待人工项表（step summary）
        run: |
          python3 -I - "$RUNNER_TEMP/asr-repro.json" >> "$GITHUB_STEP_SUMMARY" <<'PYEOF'
          import json
          import sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          print("## ASR 流水线全景（verify：seeds → 家族发现 → 档位深探）")
          print("")
          print("- `seeds.json`：家族名清单（本 job 消费；**不进 models.json 生成链**）")
          print("- `models.json` / `catalog-copy.json`：提交配置金样（人工维护，本 job 只读校验）")
          print("- 深探 draft 见 artifact `asr-bootstrap-repro`（可采纳物：待人工项就地复核后写回）")
          print("")
          inv = doc["inventory"]
          s = inv["summary"]
          print("inventory：家族 %d / 候选 %d / 在册 %d / 未收录候选 %d / 钉版缺候选 %d / 未知 %d"
                % (s["families"], s["candidates"], s["in_config"], s["new_candidates"],
                   s["missing_pinned"], s["unknown"]))
          print("")
          print("| 家族 | 在册 | 新候选 | 状态 |")
          print("|---|---|---|---|")
          for row in inv.get("results", []):
              print("| %s | %s | %s | %s |" % (row.get("family"), row.get("in_config", 0),
                                               row.get("new_candidates", 0), row.get("status", "ok")))
          probes = doc.get("probes", [])
          if probes:
              print("")
              print("| 档位 | 仓 | match | mismatch | cosmetic | 待人工项 |")
              print("|---|---|---|---|---|---|")
              for row in probes:
                  compare = row.get("compare") or {}
                  draft = row.get("draft") or {}
                  review = []
                  if str(draft.get("license", "")).upper() == "REVIEW":
                      review.append("license")
                  if draft.get("variant") is None:
                      review.append("variant")
                  if not (draft.get("versionPolicy") or {}).get("prefix"):
                      review.append("versionPolicy.prefix")
                  print("| %s | %s | %s | %s | %s | %s |" % (
                      row.get("entry"), row.get("repo"), len(compare.get("match") or []),
                      len(compare.get("mismatch") or []), len(compare.get("cosmetic") or []),
                      ", ".join(review) or "—"))
          proposals = doc.get("proposals", [])
          if proposals:
              print("")
              print("### 新家族草案（生成链第一步:CI 生成、人工采纳）")
              print("")
              print("| 提案 | 仓 | 待人工项 |")
              print("|---|---|---|")
              for row in proposals:
                  draft = row.get("draft") or {}
                  review = []
                  if str(draft.get("license", "")).upper() == "REVIEW":
                      review.append("license")
                  if draft.get("variant") is None:
                      review.append("variant")
                  if not (draft.get("versionPolicy") or {}).get("prefix"):
                      review.append("versionPolicy.prefix")
                  print("| %s | %s | %s |" % (row.get("entry"), row.get("repo"),
                                              ", ".join(review) or "—"))
              print("")
              print("候选配置见 artifact `asr-config-candidates`"
                    "（models-candidate.json / catalog-copy-candidate.json;"
                    "文案骨架空串待人填,空串被投影器 fail-closed 拒）。")
          PYEOF

      - name: 断言（13 在册/0 缺失/0 未知；12/12 复现/0 mismatch/0 error）
        run: |
          python3 -I - "$RUNNER_TEMP/asr-repro.json" <<'PYEOF'
          import json
          import sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          # 期望值运行时取自单一数据源（无家族/计数硬编码,2026-10-08 业主指令）：
          # 在册=config 条目数;probe 面=hf-repo 型条目数（非 hf-repo 走字节补测）。
          config = json.load(open(".github/config/asr/models.json", encoding="utf-8"))
          entries = config["models"]
          expected_entries = len(entries)
          expected_probes = sum(1 for e in entries
                                if (e.get("watch") or {}).get("kind") == "hf-repo")
          summary = doc["inventory"]["summary"]
          problems = []
          if summary["in_config"] != expected_entries:
              problems.append("in_config=%s (期望 %d=config 条目数)" % (summary["in_config"], expected_entries))
          if summary["missing_pinned"] != 0:
              problems.append("missing_pinned=%s (期望 0)" % summary["missing_pinned"])
          if summary["unknown"] != 0:
              problems.append("unknown=%s (期望 0)" % summary["unknown"])
          probes = doc.get("probes", [])
          errors = sum(1 for row in probes if row.get("status") == "error")
          # compare 行=在册对账（计期望数）;新家族草案行（无 compare）不计数
          # （其待人工项由 g1 红出面+summary 表呈现,供采纳回路）。
          compare_rows = [row for row in probes if isinstance(row.get("compare"), dict)]
          if len(compare_rows) != expected_probes:
              problems.append("probes=%d (期望 %d=hf-repo 在册数;非 hf-repo 面另行字节补测)"
                              % (len(compare_rows), expected_probes))
          # 选件差异（单件替换）已在 compare_entry 归 cosmetic（2026-10-08 业主
          # 指令：无家族白名单硬编码）——此处只数真 mismatch（冗余多件/角色缺失/
          # 内容不符）。
          mismatches = sum(1 for row in probes if isinstance(row.get("compare"), dict)
                           and row["compare"]["mismatch"])
          if mismatches != 0:
              problems.append("mismatch=%d (期望 0)" % mismatches)
          # g1（2026-10-08 委员会,采纳回路闸）：每个 seed 家族必须 ≥1 在册——
          # seeds 加了名而 config 未钉版时点名红（新家族深探→人工写回的指路）。
          for row in doc["inventory"].get("results", []):
              if row.get("status") == "unknown":
                  continue  # unknown 已由 summary 计数判红
              if int(row.get("in_config", 0)) < 1:
                  problems.append("seed 家族「%s」在 config 无在册条目（新家族待钉版:"
                                  "本地 bootstrap 深探后写回 models.json）" % row.get("family"))
          # g2：金样不得含未完成人工裁决的占位（REVIEW / variant=null）。
          config_raw = open(".github/config/asr/models.json", encoding="utf-8").read()
          if "REVIEW" in config_raw:
              problems.append("models.json 含 REVIEW 占位（人工裁决未完成不得进金样）")
          elif '"variant": null' in config_raw:
              problems.append("models.json 含 variant=null（档位待人工判定不得进金样）")
          if errors != 0:
              problems.append("error=%d (期望 0)" % errors)
          if problems:
              print("::error::bootstrap 复现验收失败: " + "; ".join(problems))
              raise SystemExit(1)
          print("bootstrap 复现验收通过: %d/%d 在册 / %d 档 probe 复现 / 0 mismatch / 0 error"
                % (expected_entries, expected_entries, expected_probes))
          PYEOF

      # probe 只覆盖 hf-repo 在册项（见 bootstrap 主流程的 kind 跳过分派）；
      # 其余 watch 型（github-release 等,存档在 config archive 字段）的字节
      # 复现由此通用补测承担：逐条目下载并与金样比 sha256+bytes（不依赖
      # api.github.com）。无家族硬编码——新家族进 config 即自动纳入。

  archive-check:
    name: ⑩ 非 hf-repo 字节补测（archive 面）
    needs: [catalog-draft]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      # 契约电池中的 yaml 消费测试（test-release-version / test-cnb-release-workflow
      # / test-model-trust）需要 PyYAML——与 models job 同一步骤同钉版清单
      # （CI 37722650928 实证：缺装即 ModuleNotFoundError 红）。
      - name: 非 hf-repo 条目字节级补测（archive 面）
        run: |
          set -euo pipefail
          python3 -I - > "$RUNNER_TEMP/asr-archives.txt" <<'PYEOF'
          import json
          for entry in json.load(open(".github/config/asr/models.json"))["models"]:
              if (entry.get("watch") or {}).get("kind") == "hf-repo":
                  continue
              archive = entry.get("archive")
              if not isinstance(archive, dict) or not archive.get("url"):
                  raise SystemExit("非 hf-repo 条目缺 archive 面（需扩展补测形态）: " + entry["id"])
              print("%s\t%s\t%s\t%s" % (entry["id"], archive["url"],
                                        archive["bytes"], archive["sha256"]))
          PYEOF
          if [ ! -s "$RUNNER_TEMP/asr-archives.txt" ]; then
            echo "无非 hf-repo 条目，跳过字节补测"
            exit 0
          fi
          while IFS=$'\t' read -r mid url expected_bytes expected_sha; do
            archive_path="$RUNNER_TEMP/asr-archive-$mid.bin"
            curl -L --fail --silent --show-error "$url" -o "$archive_path"
            actual_sha=$(sha256sum "$archive_path" | cut -d' ' -f1)
            actual_bytes=$(stat -c %s "$archive_path")
            if [ "$actual_sha" != "$expected_sha" ] || [ "$actual_bytes" != "$expected_bytes" ]; then
              echo "::error::$mid 字节复现失败: sha=$actual_sha/$expected_sha bytes=$actual_bytes/$expected_bytes"
              exit 1
            fi
            echo "$mid 字节复现通过: sha256+bytes 与金样一致 ($actual_bytes bytes)"
            rm -f "$archive_path"
          done < "$RUNNER_TEMP/asr-archives.txt"

