# ASR 下载文件构建与发布：可被 TestFlight 调用，也可独立手动运行。
# 最新 = 当前提交中已批准的钉版模型清单；候选先构建，验签后方可发布。
name: Build ASR Model Packages

on:
  workflow_call:
    inputs:
      publish:
        description: 验证已签名目录后发布至 CNB asr-models（false 仅产候选 artifact）
        type: boolean
        default: true
    secrets:
      # 2026-10-03 cutover 定案:CNB 是唯一发布目的地;发布步骤缺失该令牌 = 硬红
      # (跳过发布 = 新签名目录从未进 CNB inventory,比红更糟的静默坏)。
      CNB_RESOURCE_TOKEN:
        required: true
      # 2026-10-05 业主指令:目录签名密钥入 secrets(轮换时生成候选签名目录,
      # 人工提交后再跑验证链)——缺失只跳过候选签名,不阻断构建/验证。
      ASR_SIGNING_KEYS_JSON:
        required: false
      # 2026-10-05 业主 R1:下载包必须加密——32 字节 hex 主密钥(与 App 内嵌
      # ASRPackageCrypto 常量同值,test-asr-package-integrity 断言一致)。
      # 缺失 = 构建/缓存解密硬红(绝不静默发明文包);workflow_dispatch 引导步
      # 会自动生成并注册(见「引导 ASR 包加密密钥」步)。
      ASR_PACKAGE_KEY:
        required: true
      # 2026-10-05 业主指令:ASR_PACKAGE_KEY 缺失时由 CI 自动生成并注册 secret。
      # ASR_ADMIN_TOKEN 是唯一需人工预置的管理 PAT(Actions secrets 读写权限);
      # 仅 workflow_dispatch 引导需要,调用方可不传(调用路径要求 secret 已存在)。
      ASR_ADMIN_TOKEN:
        required: false
    outputs:
      bundle_artifact:
        description: App 离线基线模型资源
        value: ${{ jobs.models.outputs.bundle_artifact }}
  workflow_dispatch:
    inputs:
      publish:
        description: 验证已签名目录后发布（首次更新模型可设 false 生成待签名候选）
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: asr-models-${{ github.repository }}
  cancel-in-progress: false

jobs:
  models:
    name: 构建、校验与发布 ASR 下载文件
    # contents: write 仅服务于「写回自动生成的 App 内嵌密钥」一步的 git push
    # (GITHUB_TOKEN 临时凭据;发布面仍走 CNB_TOKEN 且仅注入发布步)。被
    # workflow_call 调用时以调用方权限为准(build-testflight 为 read——调用
    # 路径要求 secret 已存在,永不触发写回)。
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # 包加密主密钥注入整个 job(prepare 缓存解密 / build 加密 / publish 校验
      # 共用;非 CNB 写令牌,不受「令牌仅注入发布步」约束)。secret 缺失时由
      # 「引导 ASR 包加密密钥」步生成并经 GITHUB_ENV 覆盖注入(同源语义)。
      ASR_PACKAGE_KEY: ${{ secrets.ASR_PACKAGE_KEY }}
    outputs:
      # 2026-10-05 审查:packages/metadata 两个输出无任何下游消费(artifact
      # 本体仍上传,人工从 run 页取),输出面只保留真实被 build-testflight
      # 消费的 bundle_artifact。
      bundle_artifact: ${{ steps.names.outputs.bundle_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 安装公开校验工具依赖（哈希钉版，S-M6）
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements/requirements-model-tools.txt

      # 2026-10-05 业主指令:ASR_PACKAGE_KEY 不存在时自动生成、注册 secret 并
      # 改写 App 内嵌密钥与测试常量;生成值写 0600 文件,本步 add-mask 后注入
      # GITHUB_ENV(后续步骤与既有 secret 注入路径完全同源)。secret 已存在且
      # 与内嵌一致 = 空操作;不一致 = 硬错(发布 App 解不开的包比红更糟)。
      - name: 引导 ASR 包加密密钥（缺失时自动生成并注册 secret）
        env:
          ASR_ADMIN_TOKEN: ${{ secrets.ASR_ADMIN_TOKEN }}
        run: |
          key_file="$RUNNER_TEMP/asr-package-key"
          python3 scripts/release/init_asr_secrets.py \
            --repo "${{ github.repository }}" \
            --key-out "$key_file"
          if [ -f "$key_file" ]; then
            key="$(cat "$key_file")"
            echo "::add-mask::$key"
            echo "ASR_PACKAGE_KEY=$key" >> "$GITHUB_ENV"
            rm -f "$key_file"
          fi

      # 生成过密钥的运行:把两处内嵌值写回仓库并推送;推送失败 = 硬红(secret
      # 已注册但内嵌值未入库,下一次运行仍会红——恢复 = 删除 secret 后重跑,
      # 或人工提交本次运行 checkout 里的两个文件)。
      - name: 写回自动生成的 App 内嵌密钥
        run: |
          if git diff --quiet -- CoreKit/Sources/Infrastructure/ASRPackageCrypto.swift \
                                scripts/release/test-asr-package-integrity.py; then
            echo "内嵌密钥未变化——无需写回"
            exit 0
          fi
          git config user.name "VitaLiber ASR CI"
          git config user.email "noreply@github.com"
          git add CoreKit/Sources/Infrastructure/ASRPackageCrypto.swift \
                  scripts/release/test-asr-package-integrity.py
          git commit -m "chore(asr): embed CI-provisioned ASR package key

          Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin HEAD

      - name: 校验构建、签名及版本规则
        run: |
          python3 scripts/release/test-release-version.py
          python3 scripts/release/test-asr-assets.py
          python3 scripts/release/test-asr-secrets-init.py
          python3 scripts/release/test-asr-package-integrity.py
          python3 scripts/release/test-model-trust.py
          python3 scripts/release/test-asr-release.py

      - name: 准备完整钉版权重（优先复用已验证 CNB Release）
        run: |
          python3 scripts/release/prepare-asr-source.py \
            --index Resources/ASRModelUpdates/index.json \
            --source Resources/ASRModels \
            --root "$RUNNER_TEMP/asr-source" \
            --cache "$RUNNER_TEMP/asr-cache" \
            --repository "${{ vars.CNB_RESOURCE_REPOSITORY }}"

      - name: 构建全部模型 ZIP 与离线基线 bundle
        run: |
          python3 scripts/release/build-asr-packages.py \
            --source-root "$RUNNER_TEMP/asr-source" \
            --index Resources/ASRModelUpdates/index.json \
            --output "$RUNNER_TEMP/asr-packages" \
            --reuse-directory "$RUNNER_TEMP/asr-cache"
          python3 scripts/release/fetch-asr-models.py \
            --root "$RUNNER_TEMP/asr-packages/bundle/ASRModels" --check

      # 2026-10-05 审查修复:此前该步 gated on inputs.publish——与 dispatch 输入
      # 的声明(publish=false = 生成待签名候选)直接矛盾:轮换流的第一步(先产候选、
      # 人工提交、再跑 publish=true)永远拿不到候选目录。改回无条件执行;
      # 缺 ASR_SIGNING_KEYS_JSON 时自跳过(目录不变无需轮换),publish=false
      # 的构建/验证仍完整。
      - name: 生成候选签名目录（轮换时人工提交后进验证链）
        env:
          ASR_SIGNING_KEYS_JSON: ${{ secrets.ASR_SIGNING_KEYS_JSON }}
        run: |
          if [ -z "$ASR_SIGNING_KEYS_JSON" ]; then
            echo "ASR_SIGNING_KEYS_JSON 未注入——跳过候选签名（目录不变无需轮换）"
            exit 0
          fi
          root_version=$(python3 -c 'import json,base64;print(json.loads(base64.b64decode(json.load(open("Resources/ModelTrustRoot.json"))["payload"]))["version"])')
          catalog_version=$(python3 -c 'import json,base64;print(json.loads(base64.b64decode(json.load(open("Resources/ASRModelUpdates/catalog.json"))["payload"]))["catalogVersion"] + 1)')
          python3 scripts/release/sign-asr-catalog.py \
            --root Resources/ModelTrustRoot.json \
            --index "$RUNNER_TEMP/asr-packages/index.json" \
            --root-version "$root_version" \
            --catalog-version "$catalog_version" \
            --output "$RUNNER_TEMP/asr-packages/candidate-catalog.json"
          echo "candidate-catalog.json 已生成（catalogVersion=$catalog_version）——下载本步产物、核对后提交 Resources/ASRModelUpdates/catalog.json 与版本化副本"

      - name: 核对公开签名与实际生成的包索引
        if: ${{ inputs.publish }}
        run: |
          python3 scripts/release/model-trust.py verify \
            --root Resources/ModelTrustRoot.json \
            --catalog Resources/ASRModelUpdates/catalog.json \
            --index "$RUNNER_TEMP/asr-packages/index.json"

      - name: 生成 artifact 标识
        id: names
        run: |
          echo "bundle_artifact=asr-bundle-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "packages_artifact=asr-packages-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          echo "metadata_artifact=asr-metadata-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: 输出轻量签名输入（无需下载本地模型文件）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.metadata_artifact }}
          path: |
            ${{ runner.temp }}/asr-packages/index.json
            ${{ runner.temp }}/asr-packages/package-validation.json
            ${{ runner.temp }}/asr-packages/candidate-catalog.json
          retention-days: 7
          if-no-files-found: error

      - name: 输出离线基线 bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.bundle_artifact }}
          path: ${{ runner.temp }}/asr-packages/bundle/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

      - name: 输出完整候选包和校验回执
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.names.outputs.packages_artifact }}
          path: |
            ${{ runner.temp }}/asr-packages/*.zip
            ${{ runner.temp }}/asr-packages/index.json
            ${{ runner.temp }}/asr-packages/package-validation.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: 发布 ASR Release 至 CNB（不可变资产；回读核对；无需签名私钥）
        if: ${{ inputs.publish }}
        env:
          # 令牌仅注入本步骤(定案约束 17):读取/构建步骤无 CNB 写面。
          CNB_TOKEN: ${{ secrets.CNB_RESOURCE_TOKEN }}
          CNB_RESOURCE_REPOSITORY: ${{ vars.CNB_RESOURCE_REPOSITORY }}
        run: |
          set -euo pipefail
          # 有界重试防 CNB 资产表最终一致性误杀:发布成功但回读暂不可见是分布式
          # 系统常态;上传幂等(同名同摘要=复用),重试安全。重试仍失败 = 硬红阻断
          # TestFlight(回读失败不得降级为 warning——发布完整性唯一守门点)。
          for attempt in 1 2 3; do
            if python3 scripts/release/publish-asr-release.py publish \
                --index "$RUNNER_TEMP/asr-packages/index.json" \
                --directory "$RUNNER_TEMP/asr-packages" \
                --root Resources/ModelTrustRoot.json \
                --catalog Resources/ASRModelUpdates/catalog.json \
                --repository "$CNB_RESOURCE_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::CNB publish attempt $attempt failed; retrying" >&2
              sleep $((attempt * 15))
            fi
          done
          echo "::error::CNB publish failed after 3 attempts" >&2
          exit 1
