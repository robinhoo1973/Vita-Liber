# ============================================================================
# 仅查询：Vita Liber 的 TestFlight build 登记与处理状态（不上传不编译）
#
# 用途：上传后 Apple 处理需要数分钟到数十分钟，本工作流可随时手动触发，
#       廉价轮询 ASC 侧真实状态，判断 build 是否最终登记（无需重复上传）。
# ============================================================================
name: Check Build Status

on:
  workflow_dispatch:
    inputs:
      delivery_uuid:
        description: 可选，altool 日志中的 Delivery UUID（查询该 buildUpload 实例的精确状态）
        required: false
        default: ''

jobs:
  check:
    name: '查询 ASC Build 状态'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
    steps:
      - name: 准备 API Key 并查询
        run: |
          set -euo pipefail
          [ -n "$APPLE_API_KEY_P8" ] || { echo "::error::未配置 APPLE_API_KEY_P8"; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          K="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$K"
          chmod 600 "$K"
          python3 -m pip install --user PyJWT cryptography >/tmp/pip.log 2>&1 \
            || python3 -m pip install --user --break-system-packages PyJWT cryptography >/tmp/pip.log 2>&1 \
            || true
          TOKEN=$(python3 -c "
          import jwt, time
          with open('$K') as f: key = f.read()
          now = int(time.time())
          payload = {'iss': '$APPLE_API_KEY_ISSUER_ID', 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'}
          print(jwt.encode(payload, key, algorithm='ES256', headers={'alg': 'ES256', 'kid': '$APPLE_API_KEY_ID'}))
          " 2>/dev/null || true)
          [ -n "$TOKEN" ] || { echo "::error::JWT 生成失败"; exit 1; }
          AUTH="Authorization: Bearer $TOKEN"
          BID='com.vitaliber.app'
          echo "── ① App 记录 ──"
          curl -sS -g --max-time 30 "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=$BID" \
            -H "$AUTH" 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          for it in d.get('data',[]):
              a=it['attributes']
              print(f\"App {it['id']} name={a.get('name')} bundleId={a.get('bundleId')} sku={a.get('sku')}\")
          if not d.get('data'): print('(无 App 记录)')
          "
          echo "── ② 最近 builds（builds 列表）──"
          curl -sS -g --max-time 30 \
            "https://api.appstoreconnect.apple.com/v1/builds?sort=-uploadedDate&limit=10&filter[app]=6806786437" \
            -H "$AUTH" 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'errors' in d:
              print('API 错误:', json.dumps(d['errors'],ensure_ascii=False)[:400]); raise SystemExit
          bs=d.get('data',[])
          if not bs: print('(builds 列表为空 —— 尚无 build 登记)')
          for b in bs:
              a=b['attributes']
              print(f\"Build {a.get('version','?')} state={a.get('processingState','?')} compliance={a.get('missingExportCompliance','?')} uploaded={a.get('uploadedDate','?')}\")
          print(f\"(共 {d.get('meta',{}).get('paging',{}).get('total',len(bs))} 条)\")
          "
          echo "── ③ 指定 buildUpload 实例状态（若提供 UUID）──"
          if [ -n "${{ inputs.delivery_uuid }}" ]; then
            curl -sS -g --max-time 30 \
              "https://api.appstoreconnect.apple.com/v1/buildUploads/${{ inputs.delivery_uuid }}" \
              -H "$AUTH" 2>/dev/null | python3 -c "
            import json,sys
            d=json.load(sys.stdin)
            if 'errors' in d:
                print('API 错误:', json.dumps(d['errors'],ensure_ascii=False)[:400]); raise SystemExit
            a=d['data']['attributes']; st=a.get('state',{})
            print(f\"buildUpload {d['data']['id']} ver={a.get('cfBundleShortVersionString')} build={a.get('cfBundleVersion')} state={st.get('state')} errors={len(st.get('errors',[]))} warnings={len(st.get('warnings',[]))}\")
            if st.get('errors'): print('errors:', json.dumps(st['errors'],ensure_ascii=False)[:800])
            if st.get('warnings'): print('warnings:', json.dumps(st['warnings'],ensure_ascii=False)[:800])
            if not (st.get('errors') or st.get('warnings')): print('(无 errors/warnings)')
            "
          else
            echo "(未提供 delivery_uuid，跳过)"
          fi
          echo "── ④ 最近 buildUploads 处理状态（列表不可用则忽略）──"
          curl -sS -g --max-time 30 "https://api.appstoreconnect.apple.com/v1/buildUploads?sort=-uploadedDate&limit=5" \
            -H "$AUTH" 2>/dev/null | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          if 'errors' in d:
              print('API 错误:', json.dumps(d['errors'],ensure_ascii=False)[:400]); raise SystemExit
          for it in d.get('data',[]):
              a=it['attributes']; st=a.get('state',{})
              print(f\"buildUpload {it['id'][:8]}… ver={a.get('cfBundleShortVersionString')} build={a.get('cfBundleVersion')} state={st.get('state')} errors={len(st.get('errors',[]))} warnings={len(st.get('warnings',[]))}\")
              if st.get('errors'): print('  errors:', json.dumps(st['errors'],ensure_ascii=False)[:600])
              if st.get('warnings'): print('  warnings:', json.dumps(st['warnings'],ensure_ascii=False)[:600])
          "
