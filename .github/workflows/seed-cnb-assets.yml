# 一次性资产迁移(2026-10-03 cutover 定案 Task 2):把已批准的历史模型资产从
# GitHub Release 校验后上传到 CNB 资源 Release。GitHub 读取面仅存在于本工作流;
# --plan 只下载校验零写入,手动触发即隐式批准(定案 §7.6),不加逐次审批。
name: Seed CNB Resource Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 资源 tag(asr-models / llama-models / llama-xcframework)
        type: choice
        options: [asr-models, llama-models, llama-xcframework]
        default: asr-models

permissions:
  contents: read

jobs:
  seed:
    name: 校验并上传历史资产至 CNB
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # 令牌仅注入本 job 的写面步骤(定案约束 17);--plan 不需要令牌。
      CNB_RESOURCE_REPOSITORY: ${{ vars.CNB_RESOURCE_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13.5'

      - name: 确保 CNB 仓有初始提交(空仓引导 README,定案 §2.1)
        env:
          CNB_TOKEN: ${{ secrets.CNB_RESOURCE_TOKEN }}
        run: |
          set -euo pipefail
          if git ls-remote "https://cnb.cool/${{ vars.CNB_RESOURCE_REPOSITORY }}.git" HEAD | grep -q .; then
            echo "CNB repo already has commits; skipping bootstrap"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/cnb-bootstrap"
          cp .github/actions/release/cnb-resource-repository-readme.md "$RUNNER_TEMP/cnb-bootstrap/README.md"
          cd "$RUNNER_TEMP/cnb-bootstrap"
          git init -q -b main
          git -c user.name=vitaliber-ci -c user.email=ci@vitaliber.local add README.md
          git -c user.name=vitaliber-ci -c user.email=ci@vitaliber.local commit -q -m "bootstrap resource-only repository"
          git -c "credential.helper=!f() { echo username=robinhoo1973; echo password=$CNB_TOKEN; }; f" \
              push -q "https://cnb.cool/${{ vars.CNB_RESOURCE_REPOSITORY }}.git" main:main
          echo "CNB repo bootstrapped with README on branch main"

      - name: 校验并上传(asr-models:签名目录为期望源,旧索引为 GitHub 名映射)
        env:
          CNB_TOKEN: ${{ secrets.CNB_RESOURCE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.tag }}" != "asr-models" ]; then
            echo "::error::本批仅实现 asr-models 种子(llama 标签待 Task 2 扩展)"
            exit 1
          fi
          python3 .github/actions/release/seed-cnb-model-assets.py \
            --tag asr-models \
            --catalog Resources/ASRModelUpdates/catalog.json \
            --legacy-index .github/actions/release/seed-fixtures/asr-legacy-index.json \
            --github-repository "$GITHUB_REPOSITORY" \
            --work-dir "$RUNNER_TEMP/seed" \
            --execute
