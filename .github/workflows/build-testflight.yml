# ============================================================================
# 构建 + TestFlight 发布 CI
#
# 职责：编译项目 → 成功 → 签名归档 → 推送 TestFlight。
#   1) L0 静态门禁（swift 容器，任意机器可跑）—— 不过不进编译；
#   2) 编译门禁：xcodegen + xcodebuild build-for-testing —— 失败即停（不上传）；
#   3) 签名归档：p12 本地签名（绕开云签名权限限制）：
#      导入 dev/dis p12 到 keychain → build 用 dev cert → export 用 dis cert；
#   4) 导出 .ipa（method=app-store, manual signing）→ fastlane pilot 推送 TestFlight。
#
# 签名策略说明（Round 5）：
#   - App Store Connect API Key 分两种角色：Developer（仅上传）和 Admin（可云签名）。
#   - 云签名（-allowProvisioningUpdates + API Key）需 Admin 角色。
#   - 若 API Key 为 Developer 角色，build/export 使用 p12 证书本地签名，
#     API Key 仅用于 fastlane pilot 上传（Developer 权限足够）。
#
# 触发：
#   - push master（日常合入即发 TestFlight）
#   - push v* 标签（发版）
#   - workflow_dispatch（手动，可填版本说明）
#
# 前置凭据（仓库 Settings → Secrets → Actions）：
#   APPLE_API_KEY_ID / APPLE_API_KEY_ISSUER_ID / APPLE_API_KEY_P8
#       App Store Connect API Key（.p8 base64）——签名自动管理 + 上传认证
#   APPLE_TEAM_ID      Apple Developer Team ID（exportOptions 需要）
#
# 说明：
#   - 本文件是本仓库唯一的发布/分发通道（App 元数据与 Beta 审核在 ASC 网页管理）。
#   - 未配置签名凭据时：只跑 L0 + 编译门禁，明确 WARNING 提示跳过上传（不误报绿）。
#   - 版本号取自构建配置（CFBundleVersion），无需在此维护。
# ============================================================================
name: 构建 + TestFlight 发布

on:
  workflow_dispatch:
    inputs:
      notes:
        description: TestFlight 版本说明（whatsNew）
        required: false
        default: ''
  push:
    branches: [master]
    tags: ['v*']

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write    # 需 gh release list/create（版本解析与无 release 时自动建 v0.0.1）

env:
  SCHEME: VitaLiber
  XCODEPROJ: VitaLiber.xcodeproj

jobs:
  # ── L0 静态门禁：不过不进编译 ─────────────────────────────────
  l0-static-gate:
    name: 'L0 · 静态门禁'
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run l0-static-gate.sh
        run: bash .github/workflows/l0-static-gate.sh

  # ── 编译 → 签名归档 → TestFlight ─────────────────────────────
  build-testflight:
    name: '编译 + TestFlight'
    needs: l0-static-gate
    runs-on: macos-latest
    timeout-minutes: 60
    # 签名/上传凭据映射到 job env：if: 与步骤都能读（step env 不进入 if 上下文）
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
      APPLE_DIS_CERT_P12: ${{ secrets.APPLE_DIS_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_DIS_PROVISION_PROFILE: ${{ secrets.APPLE_DIS_PROVISION_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境与工具链
        run: |
          xcodebuild -version
          command -v fastlane >/dev/null 2>&1 && fastlane --version | head -1 || echo "fastlane 未预装（上传步骤会 brew 安装）"

      - name: 生成 Xcode 工程
        run: |
          if [ -d "$XCODEPROJ" ]; then
            echo "已有 $XCODEPROJ"
          elif [ -f project.yml ]; then
            brew install xcodegen >/dev/null 2>&1 && xcodegen generate
          else
            echo "::error::缺 project.yml 且无 xcodeproj"; exit 1
          fi

      - name: 解析版本（GitHub 最高 Release → 版本主体；无则自动建 v0.0.1）
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "当前无 GitHub Release → 自动创建 v0.0.1"
            gh release create v0.0.1 --title "v0.0.1" --notes "初始基线版本（CI 自动创建）" >/dev/null
            VERSION="0.0.1"
          else
            VERSION="${TAG#v}"
          fi
          BUILD="$(printf '%03d' ${{ github.run_number }})"
          HASH="$(git rev-parse --short=8 HEAD)"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "CODE_HASH=$HASH" >> "$GITHUB_ENV"
          echo "三部件版本 → Version $VERSION | Build $BUILD | Code Hash $HASH"

      # ── 编译门禁（模拟器切片，未签名）：失败即停，绝不进上传 ──
      - name: 编译门禁（build-for-testing）
        run: |
          set -o pipefail
          mkdir -p Build
          DEST=$(python3 - <<'PY'
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","--json","devices","available"]))
          pairs = [(rt, v["name"], v["udid"]) for rt, devs in d["devices"].items()
                   for v in devs if v.get("isAvailable") and v["name"].startswith("iPhone")]
          spec = [p for p in pairs if p[1] == "iPhone 15"]
          pick = spec[0] if spec else sorted(pairs)[0]
          # 用 UDID 而非 name：同名校验在 Xcode 26 多 runtime 下脆弱（实测
          # macos-latest/Xcode 26.6 报 Unable to find device），UDID 精确无歧义
          print(f"platform=iOS Simulator,id={pick[2]}")
          PY
          )
          echo "destination: $DEST"
          xcodebuild build-for-testing \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath Build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-build.log
          echo "编译门禁通过 ✓"

      # ── 解码 ASC API Key（Path A 自动签名用）──────────────────
      - name: 解码 App Store Connect API Key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "API Key 已就绪"

      # ── 导入签名证书（p12）—— 用于本地签名，不依赖 API Key 云签名 ────────
      # Cloud signing 需要 Admin 级 API Key；Developer 级 Key 只能上传，不能签。
      # 用 p12 证书导入 keychain 做本地签名，彻底绕开云签名权限限制。
      - name: 导入签名证书（p12）
        if: ${{ env.APPLE_DEV_CERT_P12 != '' && env.APPLE_DIS_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          KC=build.keychain
          KC_PASS="buildkeychain"
          echo "$APPLE_DEV_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dev_cert.p12"
          echo "$APPLE_DIS_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dis_cert.p12"
          for f in dev_cert dis_cert; do
            B="$RUNNER_TEMP/$f.p12"
            [ -s "$B" ] || { echo "::error::$f.p12 解码为空"; exit 1; }
            FIRST="$(xxd -p -l 1 "$B")"
            [ "$FIRST" = "30" ] || { echo "::error::$f.p12 首字节 0x$FIRST（期望 0x30）——非合法 PKCS12"; exit 1; }
          done
          echo "p12 解码校验通过"
          security create-keychain -p "$KC_PASS" "$KC" 2>/dev/null || true
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -t 3600 "$KC"
          # 使用 openssl 导入（macOS security import 对某些 p12 格式兼容性差）
          import_p12() {
            local f="$1" pass="$2" name="$3"
            # 方案A：openssl 导出 PEM → security 导入 PEM
            local pem="$f.pem"
            if openssl pkcs12 -in "$f" -passin "pass:$pass" -nodes -out "$pem" 2>/dev/null; then
              local cert_pem="$f.cert.pem"
              local key_pem="$f.key.pem"
              openssl pkcs12 -in "$f" -passin "pass:$pass" -clcerts -nokeys -out "$cert_pem" 2>/dev/null
              openssl pkcs12 -in "$f" -passin "pass:$pass" -nocerts -nodes -out "$key_pem" 2>/dev/null
              if [ -s "$cert_pem" ] && [ -s "$key_pem" ]; then
                security import "$cert_pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                security import "$key_pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                echo "$name: PEM 拆分导入成功"
                rm -f "$pem" "$cert_pem" "$key_pem"
                return 0
              fi
              # 方案B：openssl 重封装 p12 → security 导入
              local std_p12="$f.std.p12"
              openssl pkcs12 -export -in "$pem" -passout "pass:$pass" -out "$std_p12" 2>/dev/null
              if [ -s "$std_p12" ]; then
                security import "$std_p12" -k "$KC" -P "$pass" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                echo "$name: 重封装 p12 导入成功"
                rm -f "$pem" "$std_p12"
                return 0
              fi
              rm -f "$pem" "$std_p12"
            fi
            echo "::error::$name: 所有导入路径均失败"
            return 1
          }
          for f in dev_cert dis_cert; do
            P12="$RUNNER_TEMP/$f.p12"
            NAME="${f%%_*}"
            if openssl pkcs12 -in "$P12" -passin "pass:$APPLE_CERT_PASSWORD" -noout 2>/dev/null; then
              import_p12 "$P12" "$APPLE_CERT_PASSWORD" "$NAME" && continue
            fi
            if openssl pkcs12 -in "$P12" -passin pass: -noout 2>/dev/null; then
              import_p12 "$P12" "" "$NAME" && continue
            fi
            echo "::error::$NAME: 密码错误（secret 密码与空密码均无法解析 p12）"
            exit 1
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychain -d user -s "$KC"
          echo "已导入 identities:"
          security find-identity -v -p codesigning "$KC"

      # ── 导入 Provisioning Profile ─────────────────────────────────
      - name: 导入 Provisioning Profile
        if: ${{ env.APPLE_DIS_PROVISION_PROFILE != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_DIS_PROVISION_PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision"
          # 打印 profile 信息供诊断
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision" 2>/dev/null | \
            plutil -extract Name raw - 2>/dev/null && echo "profile 名称 ✓" || echo "profile 导入完成"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"
      - name: 未配置 Provisioning Profile
        if: ${{ env.APPLE_DIS_PROVISION_PROFILE == '' }}
        run: |
          echo "::warning::未配置 APPLE_DIS_PROVISION_PROFILE——签名可能因缺少 profile 失败"
          echo "配置：Settings → Secrets → Actions → APPLE_DIS_PROVISION_PROFILE（base64 编码的 .mobileprovision）"

      # ── 签名归档：build + 手拼 xcarchive（绕开 Xcode 16 SPM archive bug）──────
      # 5WHY 实证（13-17 轮）：xcodebuild archive 在 Xcode 16.4 对 SPM 资源 bundle
      # （GRDB_GRDB.bundle）的自动集成 Copy phase 源固定指向 archive 空间
      # BuildProductsPath/Debug-iphoneos/，而产物落 UninstalledProducts——工程侧无开关、
      # 产物侧预种入被 archive 清理，无法修复。普通 xcodebuild build 无此缺陷
      # （bundle 正常嵌入 VitaLiber.app，第 15 轮实证）。故：Release build（自动签名
      # development）→ 按 xcarchive 规范手拼归档（Products/Applications + Info.plist）
      # → 既有 exportArchive 步骤以 API key 自动重签为 distribution 并导出 ipa。
      #
      # 签名策略（Round 5 修正）：p12 本地签名 + API Key 仅上传
      # - Cloud signing 需 Admin 级 API Key；Developer 级 Key 只能上传 TestFlight。
      # - build 用 keychain 中的 dev cert（手动签名），
      # - export 用 keychain 中的 dis cert（手动签名，重签为 App Store），
      # - upload 用 API Key（仅需 Developer 权限）。
      - name: 签名归档（archive + 导出）
        if: ${{ env.APPLE_DEV_CERT_P12 != '' }}
        run: |
          set -o pipefail
          ARCH="Build/VitaLiber.xcarchive"
          rm -rf "$ARCH" Build/export
          # 使用 xcodebuild archive（而非手动拼装）——确保 archive 结构完整
          xcodebuild archive \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCH" \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_KEY_ISSUER_ID" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" VITA_LIBER_CODE_HASH="$CODE_HASH" \
            2>&1 | tee Build/xcodebuild-archive.log
          echo "archive 完成 ✓"
          echo "=== archive Info.plist ==="
          plutil -p "$ARCH/Info.plist" 2>/dev/null || cat "$ARCH/Info.plist"
          # 导出 IPA
          PROFILE_FILE="$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)"
          PROFILE_NAME=""
          if [ -n "$PROFILE_FILE" ]; then
            PROFILE_NAME="$(security cms -D -i "$PROFILE_FILE" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)"
          fi
          if [ -z "$PROFILE_NAME" ] || [ "$PROFILE_NAME" = "null" ]; then
            echo "::error::未找到 Provisioning Profile"; exit 1
          fi
          echo "profile: $PROFILE_NAME"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$ARCH/Products/Applications/VitaLiber.app/Info.plist" 2>/dev/null || echo 'com.vitaliber.app')"
          echo "bundle id: $APP_ID"
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key><string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$APP_ID</key><string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key><true/>
              <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath Build/export \
            2>&1 | tee Build/xcodebuild-export.log
          test -f Build/export/VitaLiber.ipa && echo "ipa 导出成功 ✓"

      # ── 导出 .ipa —— 已合并到「签名归档」步骤 ────────

      # ── 推送 TestFlight（API Key 认证，无需 2FA）────────────
      - name: 上传 TestFlight（fastlane pilot）
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          command -v fastlane >/dev/null 2>&1 || brew install fastlane >/dev/null 2>&1
          NOTES="${{ inputs.notes }}"
          # fastlane 需要 JSON 格式的 API Key 文件
          KEY_JSON="$GITHUB_WORKSPACE/AuthKey.json"
          P8="$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          python3 -c "
          import json, sys
          with open(sys.argv[1]) as f: key = f.read()
          data = {'key_id': sys.argv[2], 'issuer_id': sys.argv[3], 'key': key}
          with open(sys.argv[4], 'w') as f: json.dump(data, f)
          " "$P8" "$APPLE_API_KEY_ID" "$APPLE_API_KEY_ISSUER_ID" "$KEY_JSON"
          # app_identifier 不硬编码：pilot 默认从 ipa 的 CFBundleIdentifier 解析
          PILOT_OPTS=(upload --ipa Build/export/VitaLiber.ipa --api_key_path "$KEY_JSON")
          if [ -n "$NOTES" ]; then PILOT_OPTS+=(--changelog "$NOTES"); fi
          fastlane pilot "${PILOT_OPTS[@]}"
          echo "TestFlight 上传完成 ✓"

      # ── 未配置凭据时明确提示（不误报）───────────────────────
      - name: 凭据未配置——仅完成编译，跳过上传
        if: ${{ env.APPLE_API_KEY_P8 == '' && env.APPLE_DEV_CERT_P12 == '' }}
        run: |
          echo "::warning::未配置 APPLE_API_KEY_P8 等签名凭据——本次仅跑 L0+编译门禁，未上传 TestFlight"
          echo "配置：Settings → Secrets → Actions → APPLE_API_KEY_ID / APPLE_API_KEY_ISSUER_ID / APPLE_API_KEY_P8 / APPLE_TEAM_ID"
