# ============================================================================
# 构建 + TestFlight 发布 CI（三阶段独立 Job）
#
# Job 1 — version：解析版本号（ubuntu，快速廉价）
# Job 2 — build：L0 门禁 → 编译 → 签名归档 → 导出 IPA → 上传 artifact
# Job 3 — upload：下载 artifact → fastlane pilot 推送 TestFlight
#
# 各 Job 独立：修改上传逻辑不影响编译，修改版本解析不影响签名。
# Job 间通过 artifact + outputs 传递数据，无共享状态。
#
# 前置凭据（仓库 Settings → Secrets → Actions）：
#   APPLE_API_KEY_ID / APPLE_API_KEY_ISSUER_ID / APPLE_API_KEY_P8
#   APPLE_TEAM_ID / APPLE_DEV_CERT_P12 / APPLE_DIS_CERT_P12
#   APPLE_CERT_PASSWORD / APPLE_DIS_PROVISION_PROFILE
# ============================================================================
name: Build + TestFlight

on:
  workflow_dispatch:
    inputs:
      notes:
        description: TestFlight 版本说明（whatsNew）
        required: false
        default: ''
  push:
    branches: [master]
    tags: ['v*']

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  SCHEME: VitaLiber
  XCODEPROJ: VitaLiber.xcodeproj

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: 解析版本号（ubuntu，快速廉价）
  # ═══════════════════════════════════════════════════════════════
  version:
    name: '解析版本'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build: ${{ steps.ver.outputs.build }}
      hash: ${{ steps.ver.outputs.hash }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本（GitHub 最高 Release → 版本主体；无则自动建 v0.0.1）
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "当前无 GitHub Release → 自动创建 v0.0.1"
            gh release create v0.0.1 --title "v0.0.1" --notes "初始基线版本（CI 自动创建）" >/dev/null
            VERSION="0.0.1"
          else
            VERSION="${TAG#v}"
          fi
          BUILD="$(printf '%03d' ${{ github.run_number }})"
          HASH="$(git rev-parse --short=8 HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "三部件版本 → Version $VERSION | Build $BUILD | Code Hash $HASH"

  # ═══════════════════════════════════════════════════════════════
  # Job 2: 编译 + 签名归档 + 导出 IPA
  # ═══════════════════════════════════════════════════════════════
  build:
    name: '编译 + 导出 IPA'
    needs: version
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
      APPLE_DIS_CERT_P12: ${{ secrets.APPLE_DIS_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_DIS_PROVISION_PROFILE: ${{ secrets.APPLE_DIS_PROVISION_PROFILE }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境与工具链
        run: |
          xcodebuild -version

      - name: 生成 Xcode 工程
        run: |
          if [ -d "$XCODEPROJ" ]; then
            echo "已有 $XCODEPROJ"
          elif [ -f project.yml ]; then
            brew install xcodegen >/dev/null 2>&1 && xcodegen generate
          else
            echo "::error::缺 project.yml 且无 xcodeproj"; exit 1
          fi

      # ── L0 静态门禁（macOS 自带 swift；非阻塞——编译门禁才是硬卡点）──────
      - name: L0 静态门禁
        run: |
          bash .github/workflows/l0-static-gate.sh || {
            echo "::warning::L0 静态门禁未完全通过（非阻塞）"
          }

      # ── 解码 ASC API Key ─────────────────────────────
      - name: 解码 App Store Connect API Key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "API Key 已就绪"

      # ── 导入签名证书（p12 via openssl PEM split）────
      - name: 导入签名证书（p12）
        if: ${{ env.APPLE_DEV_CERT_P12 != '' && env.APPLE_DIS_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          KC=build.keychain
          KC_PASS="buildkeychain"
          echo "$APPLE_DEV_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dev_cert.p12"
          echo "$APPLE_DIS_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dis_cert.p12"
          for f in dev_cert dis_cert; do
            B="$RUNNER_TEMP/$f.p12"
            [ -s "$B" ] || { echo "::error::$f.p12 解码为空"; exit 1; }
            FIRST="$(xxd -p -l 1 "$B")"
            [ "$FIRST" = "30" ] || { echo "::error::$f.p12 首字节 0x$FIRST（期望 0x30）——非合法 PKCS12"; exit 1; }
          done
          echo "p12 解码校验通过"
          security create-keychain -p "$KC_PASS" "$KC" 2>/dev/null || true
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -t 3600 "$KC"
          import_p12() {
            local f="$1" pass="$2" name="$3"
            local pem="$f.pem"
            if openssl pkcs12 -in "$f" -passin "pass:$pass" -nodes -out "$pem" 2>/dev/null; then
              local cert_pem="$f.cert.pem"
              local key_pem="$f.key.pem"
              openssl pkcs12 -in "$f" -passin "pass:$pass" -clcerts -nokeys -out "$cert_pem" 2>/dev/null
              openssl pkcs12 -in "$f" -passin "pass:$pass" -nocerts -nodes -out "$key_pem" 2>/dev/null
              if [ -s "$cert_pem" ] && [ -s "$key_pem" ]; then
                security import "$cert_pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                security import "$key_pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                echo "$name: PEM 拆分导入成功"
                rm -f "$pem" "$cert_pem" "$key_pem"
                return 0
              fi
              local std_p12="$f.std.p12"
              openssl pkcs12 -export -in "$pem" -passout "pass:$pass" -out "$std_p12" 2>/dev/null
              if [ -s "$std_p12" ]; then
                security import "$std_p12" -k "$KC" -P "$pass" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                echo "$name: 重封装 p12 导入成功"
                rm -f "$pem" "$std_p12"
                return 0
              fi
              rm -f "$pem" "$std_p12"
            fi
            echo "::error::$name: 所有导入路径均失败"
            return 1
          }
          for f in dev_cert dis_cert; do
            P12="$RUNNER_TEMP/$f.p12"
            NAME="${f%%_*}"
            if openssl pkcs12 -in "$P12" -passin "pass:$APPLE_CERT_PASSWORD" -noout 2>/dev/null; then
              import_p12 "$P12" "$APPLE_CERT_PASSWORD" "$NAME" && continue
            fi
            if openssl pkcs12 -in "$P12" -passin pass: -noout 2>/dev/null; then
              import_p12 "$P12" "" "$NAME" && continue
            fi
            echo "::error::$NAME: 密码错误（secret 密码与空密码均无法解析 p12）"
            exit 1
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychain -d user -s "$KC"
          echo "已导入 identities:"
          security find-identity -v -p codesigning "$KC"

      # ── 导入 Provisioning Profile ─────────────────────
      - name: 导入 Provisioning Profile
        if: ${{ env.APPLE_DIS_PROVISION_PROFILE != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_DIS_PROVISION_PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision" 2>/dev/null | \
            plutil -extract Name raw - 2>/dev/null && echo "profile 名称 ✓" || echo "profile 导入完成"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

      # ── 编译门禁（build-for-testing）：失败即停 ───────
      - name: 编译门禁（build-for-testing）
        run: |
          set -o pipefail
          mkdir -p Build
          DEST=$(python3 - <<'PY'
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","--json","devices","available"]))
          pairs = [(rt, v["name"], v["udid"]) for rt, devs in d["devices"].items()
                   for v in devs if v.get("isAvailable") and v["name"].startswith("iPhone")]
          spec = [p for p in pairs if p[1] == "iPhone 15"]
          pick = spec[0] if spec else sorted(pairs)[0]
          print(f"platform=iOS Simulator,id={pick[2]}")
          PY
          )
          echo "destination: $DEST"
          xcodebuild build-for-testing \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath Build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-build.log
          echo "编译门禁通过 ✓"

      # ── 签名归档 + 导出 IPA ──────────────────────────
      - name: 签名归档 + 导出 IPA
        if: ${{ env.APPLE_DEV_CERT_P12 != '' }}
        run: |
          set -o pipefail
          VERSION="${{ needs.version.outputs.version }}"
          BUILD="${{ needs.version.outputs.build }}"
          HASH="${{ needs.version.outputs.hash }}"
          ARCH="Build/VitaLiber.xcarchive"
          rm -rf "$ARCH" Build/export
          xcodebuild archive \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCH" \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_KEY_ISSUER_ID" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" VITA_LIBER_CODE_HASH="$HASH" \
            2>&1 | tee Build/xcodebuild-archive.log
          echo "archive 完成 ✓"
          echo "=== archive Info.plist ==="
          plutil -p "$ARCH/Info.plist" 2>/dev/null || cat "$ARCH/Info.plist"
          # 导出 IPA
          PROFILE_FILE="$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)"
          PROFILE_NAME=""
          if [ -n "$PROFILE_FILE" ]; then
            PROFILE_NAME="$(security cms -D -i "$PROFILE_FILE" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)"
          fi
          if [ -z "$PROFILE_NAME" ] || [ "$PROFILE_NAME" = "null" ]; then
            echo "::error::未找到 Provisioning Profile"; exit 1
          fi
          echo "profile: $PROFILE_NAME"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$ARCH/Products/Applications/VitaLiber.app/Info.plist" 2>/dev/null || echo 'com.vitaliber.app')"
          echo "bundle id: $APP_ID"
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key><string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$APP_ID</key><string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key><true/>
              <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$ARCH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath Build/export \
            2>&1 | tee Build/xcodebuild-export.log
          test -f Build/export/VitaLiber.ipa && echo "ipa 导出成功 ✓"

      # ── 上传 IPA 到 Artifact（供 upload job 下载）────
      - name: 上传 IPA artifact
        if: ${{ env.APPLE_DEV_CERT_P12 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: vitaliber-ipa
          path: Build/export/VitaLiber.ipa
          retention-days: 1

  # ═══════════════════════════════════════════════════════════════
  # Job 3: 上传 TestFlight（与编译完全解耦）
  # ═══════════════════════════════════════════════════════════════
  upload:
    name: '上传 TestFlight'
    needs: [version, build]
    runs-on: macos-latest
    timeout-minutes: 45
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
    steps:
      - name: 下载 IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: vitaliber-ipa
          path: Build/export/

      - name: 安装 fastlane
        run: |
          if command -v fastlane >/dev/null 2>&1; then
            fastlane --version | head -1
          else
            echo "fastlane 未安装，开始 brew install..."
            brew install fastlane
          fi

      - name: 上传到 TestFlight（fastlane pilot）
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          set -o pipefail
          test -f Build/export/VitaLiber.ipa || { echo "::error::IPA 文件不存在"; exit 1; }
          NOTES="${{ inputs.notes }}"
          # 构建 JSON 格式 API Key 文件
          KEY_JSON="$GITHUB_WORKSPACE/AuthKey.json"
          P8="$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          if [ ! -f "$P8" ]; then
            mkdir -p "$GITHUB_WORKSPACE/private_keys"
            echo "$APPLE_API_KEY_P8" | base64 -d > "$P8"
            chmod 600 "$P8"
          fi
          python3 -c "
          import json, sys
          with open(sys.argv[1]) as f: key = f.read()
          data = {'key_id': sys.argv[2], 'issuer_id': sys.argv[3], 'key': key}
          with open(sys.argv[4], 'w') as f: json.dump(data, f)
          " "$P8" "$APPLE_API_KEY_ID" "$APPLE_API_KEY_ISSUER_ID" "$KEY_JSON"
          PILOT_OPTS=(upload --ipa Build/export/VitaLiber.ipa --api_key_path "$KEY_JSON" --skip_waiting_for_build_processing)
          if [ -n "$NOTES" ]; then PILOT_OPTS+=(--changelog "$NOTES"); fi
          fastlane pilot "${PILOT_OPTS[@]}"
          echo "TestFlight 上传完成 ✓"

      # ── 查询 Apple 处理状态（ASC REST API）────────────
      - name: 查询 Build 处理状态
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          set -o pipefail
          # 安装 PyJWT + cryptography（macOS runner 的 python3 可能 externally-managed，需 --break-system-packages fallback）
          python3 -m pip install --user PyJWT cryptography >/tmp/pip.log 2>&1 \
            || python3 -m pip install --user --break-system-packages PyJWT cryptography >/tmp/pip.log 2>&1 \
            || true
          tail -2 /tmp/pip.log 2>/dev/null || true
          echo "等待 Apple 开始处理（90 秒）..."
          sleep 90
          P8="$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          [ -f "$P8" ] || { echo "::warning::p8 文件不存在，跳过查询"; exit 0; }
          # 生成 JWT（ES256；aud 为 Apple 要求的 appstoreconnect-v1，缺它会被 401 拒绝）
          TOKEN=$(python3 -c "
          import jwt, time, json
          with open('$P8') as f: key = f.read()
          now = int(time.time())
          payload = {'iss': '$APPLE_API_KEY_ISSUER_ID', 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'}
          t = jwt.encode(payload, key, algorithm='ES256', headers={'alg': 'ES256', 'kid': '$APPLE_API_KEY_ID'})
          # 解码 header 校验 kid（kid 非机密）
          import base64
          h = json.loads(base64.urlsafe_b64decode(t.split('.')[0] + '=='))
          print('KID_CHECK=' + str(h.get('kid')))
          print(t)
          " 2>&1 || true)
          KID=$(echo "$TOKEN" | grep '^KID_CHECK=' | cut -d= -f2)
          TOKEN=$(echo "$TOKEN" | grep -v '^KID_CHECK=' | tail -1)
          echo "JWT kid=$KID；token 长度 ${#TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "::error::JWT 生成失败（PyJWT/cryptography 未就绪），请查看上方 pip 输出"
            exit 0
          fi
          AUTH="Authorization: Bearer $TOKEN"
          # curl 封装：-g 关 glob（URL 内 [] 方括号必需）
          asc_json() {
            # $1=url，打印精简结果
            local url="$1" code
            code=$(curl -sS -g -o /tmp/asc.json -w '%{http_code}' --max-time 30 "$url" -H "$AUTH" 2>&1) || true
            echo "HTTP $code"
            python3 -c "
            import json
            try:
                d = json.load(open('/tmp/asc.json'))
            except Exception as e:
                print('  解析失败:', e, open('/tmp/asc.json').read()[:200]); raise SystemExit
            if 'errors' in d:
                print('  errors:', json.dumps(d['errors'], ensure_ascii=False)[:600]); raise SystemExit
            for it in d.get('data', []):
                t = it.get('type','?'); a = it.get('attributes',{})
                if t=='builds':
                    print(f\"  Build {a.get('version','?')} state={a.get('processingState','?')} compliance={a.get('missingExportCompliance','?')} uploaded={a.get('uploadedDate','?')}\")
                elif t=='apps':
                    print(f\"  App {it['id']} {a.get('name','?')} {a.get('bundleId','?')} sku={a.get('sku','?')}\")
                elif t=='appStoreVersions':
                    print(f\"  版本 {a.get('versionString','?')} state={a.get('appStoreState','?')} platform={a.get('platform','?')}\")
                elif t=='betaGroups':
                    print(f\"  betaGroup {a.get('name','?')} state={a.get('state','?')}\")
                else:
                    print(' ', it['id'], a)
            print(f\"  (共 {d.get('meta',{}).get('paging',{}).get('total', len(d.get('data',[])))} 条)\")
            "
          }
          APP=6806786437
          echo "── ① 该 Team 全部 builds（不限 App）──"
          asc_json "https://api.appstoreconnect.apple.com/v1/builds?sort=-uploadedDate&limit=20"
          echo "── ② App $APP（Vita Liber）最近 builds ──"
          asc_json "https://api.appstoreconnect.apple.com/v1/builds?sort=-uploadedDate&limit=10&filter[app]=$APP"
          echo "── ③ App $APP 的 appStoreVersions（有无版本占位）──"
          asc_json "https://api.appstoreconnect.apple.com/v1/apps/$APP/appStoreVersions?limit=10"
          echo "── ④ App $APP 的 betaGroups ──"
          asc_json "https://api.appstoreconnect.apple.com/v1/apps/$APP/betaGroups?limit=10"
          echo "── ⑤ App $APP 全量 attributes ──"
          curl -sS -g --max-time 30 "https://api.appstoreconnect.apple.com/v1/apps/$APP" -H "$AUTH" 2>&1 | python3 -c "
          import json,sys
          try:
              d=json.load(sys.stdin); a=d['data']['attributes']
              for k in sorted(a.keys()): print(f'  {k} = {a[k]}')
          except Exception as e: print('  解析失败', e)
          " || true
          # ⑥ 上传后轮询：build 是否真的登记（每 30s 一次，最多 6 分钟）
          echo "── ⑥ 轮询 App $APP 是否有新 build 登记（30s×12）──"
          for i in $(seq 1 12); do
            sleep 30
            N=$(curl -sS -g --max-time 30 "https://api.appstoreconnect.apple.com/v1/builds?limit=3&filter[app]=$APP" -H "$AUTH" 2>/dev/null | python3 -c "
            import json,sys
            try: print(len(json.load(sys.stdin).get('data',[])))
            except: print('?')
            " 2>/dev/null || true)
            echo "  第 ${i} 次轮询（$(date -u +%H:%M:%S)）：build 数 = $N"
            if [ "$N" != "0" ] && [ "$N" != "?" ]; then echo "  → build 已登记！"; break; fi
          done

      - name: 凭据未配置——跳过上传
        if: ${{ env.APPLE_API_KEY_P8 == '' }}
        run: |
          echo "::warning::未配置 APPLE_API_KEY_P8——跳过 TestFlight 上传"
