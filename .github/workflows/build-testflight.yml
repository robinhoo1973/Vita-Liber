# ============================================================================
# 构建 + TestFlight 发布 CI
#
# 职责：编译项目 → 成功 → 签名归档 → 推送 TestFlight。
#   1) L0 静态门禁（swift 容器，任意机器可跑）—— 不过不进编译；
#   2) 编译门禁：xcodegen + xcodebuild build-for-testing —— 失败即停（不上传）；
#   3) 签名归档：Path A（Xcode Cloud Signing，自动签名）：
#      ASC API Key 认证，Xcode 自动管理证书/描述文件（-allowProvisioningUpdates）；
#   4) 导出 .ipa（method=app-store）→ fastlane pilot 推送 TestFlight。
#
# 触发：
#   - push master（日常合入即发 TestFlight）
#   - push v* 标签（发版）
#   - workflow_dispatch（手动，可填版本说明）
#
# 前置凭据（仓库 Settings → Secrets → Actions）：
#   APPLE_API_KEY_ID / APPLE_API_KEY_ISSUER_ID / APPLE_API_KEY_P8
#       App Store Connect API Key（.p8 base64）——签名自动管理 + 上传认证
#   APPLE_TEAM_ID      Apple Developer Team ID（exportOptions 需要）
#
# 说明：
#   - 本文件是本仓库唯一的发布/分发通道（App 元数据与 Beta 审核在 ASC 网页管理）。
#   - 未配置签名凭据时：只跑 L0 + 编译门禁，明确 WARNING 提示跳过上传（不误报绿）。
#   - 版本号取自构建配置（CFBundleVersion），无需在此维护。
# ============================================================================
name: 构建 + TestFlight 发布

on:
  workflow_dispatch:
    inputs:
      notes:
        description: TestFlight 版本说明（whatsNew）
        required: false
        default: ''
  push:
    branches: [master]
    tags: ['v*']

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write    # 需 gh release list/create（版本解析与无 release 时自动建 v0.0.1）

env:
  SCHEME: VitaLiber
  XCODEPROJ: VitaLiber.xcodeproj

jobs:
  # ── L0 静态门禁：不过不进编译 ─────────────────────────────────
  l0-static-gate:
    name: 'L0 · 静态门禁'
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run l0-static-gate.sh
        run: bash .github/workflows/l0-static-gate.sh

  # ── 编译 → 签名归档 → TestFlight ─────────────────────────────
  build-testflight:
    name: '编译 + TestFlight'
    needs: l0-static-gate
    runs-on: macos-latest
    timeout-minutes: 60
    # 签名/上传凭据映射到 job env：if: 与步骤都能读（step env 不进入 if 上下文）
    env:
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
      APPLE_DIS_CERT_P12: ${{ secrets.APPLE_DIS_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 环境与工具链
        run: |
          xcodebuild -version
          command -v fastlane >/dev/null 2>&1 && fastlane --version | head -1 || echo "fastlane 未预装（上传步骤会 brew 安装）"

      - name: 生成 Xcode 工程
        run: |
          if [ -d "$XCODEPROJ" ]; then
            echo "已有 $XCODEPROJ"
          elif [ -f project.yml ]; then
            brew install xcodegen >/dev/null 2>&1 && xcodegen generate
          else
            echo "::error::缺 project.yml 且无 xcodeproj"; exit 1
          fi

      - name: 解析版本（GitHub 最高 Release → 版本主体；无则自动建 v0.0.1）
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then
            echo "当前无 GitHub Release → 自动创建 v0.0.1"
            gh release create v0.0.1 --title "v0.0.1" --notes "初始基线版本（CI 自动创建）" >/dev/null
            VERSION="0.0.1"
          else
            VERSION="${TAG#v}"
          fi
          BUILD="$(printf '%03d' ${{ github.run_number }})"
          HASH="$(git rev-parse --short=8 HEAD)"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "CODE_HASH=$HASH" >> "$GITHUB_ENV"
          echo "三部件版本 → Version $VERSION | Build $BUILD | Code Hash $HASH"

      # ── 编译门禁（模拟器切片，未签名）：失败即停，绝不进上传 ──
      - name: 编译门禁（build-for-testing）
        run: |
          set -o pipefail
          mkdir -p Build
          DEST=$(python3 - <<'PY'
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","--json","devices","available"]))
          pairs = [(rt, v["name"], v["udid"]) for rt, devs in d["devices"].items()
                   for v in devs if v.get("isAvailable") and v["name"].startswith("iPhone")]
          spec = [p for p in pairs if p[1] == "iPhone 15"]
          pick = spec[0] if spec else sorted(pairs)[0]
          # 用 UDID 而非 name：同名校验在 Xcode 26 多 runtime 下脆弱（实测
          # macos-latest/Xcode 26.6 报 Unable to find device），UDID 精确无歧义
          print(f"platform=iOS Simulator,id={pick[2]}")
          PY
          )
          echo "destination: $DEST"
          xcodebuild build-for-testing \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath Build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-build.log
          echo "编译门禁通过 ✓"

      # ── 解码 ASC API Key（Path A 自动签名用）──────────────────
      - name: 解码 App Store Connect API Key
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "API Key 已就绪"

            # ── 导入签名证书（p12，业界最佳实践：证书私钥持久化为 CI secret，
      #    每轮导入 keychain 复用——避免 Xcode 自动签名每轮新建证书直至账号上限
      #    "Choose a certificate to revoke"）─────────────────────────
      # ── 证书 secret 提示（根治：证书应来自 secret 而非每轮自动创建——Xcode
      #    自动创建会每轮 +1 张直至账号上限 "Choose a certificate to revoke"；
      #    p12 就绪前以 warning 继续，用剩余配额验证全链路）────────────
      - name: 提示配置签名证书 secret（p12）
        if: ${{ env.APPLE_DEV_CERT_P12 == '' || env.APPLE_DIS_CERT_P12 == '' }}
        run: |
          echo "::warning::未配置 APPLE_DEV_CERT_P12/APPLE_DIS_CERT_P12/APPLE_CERT_PASSWORD——本轮将由 Xcode 自动管理证书（每轮新建，配额有限）"
          echo "::warning::根治方案：Mac 钥匙串导出含私钥证书为 p12 → base64 存 APPLE_DEV_CERT_P12（开发）和 APPLE_DIS_CERT_P12（发布），密码存 APPLE_CERT_PASSWORD"

      - name: 导入签名证书（p12）
        if: ${{ env.APPLE_DEV_CERT_P12 != '' && env.APPLE_DIS_CERT_P12 != '' }}
        run: |
          set -euo pipefail
          KC=build.keychain
          KC_PASS="buildkeychain"
          echo "$APPLE_DEV_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dev_cert.p12"
          echo "$APPLE_DIS_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dis_cert.p12"
          # 解码自检：PKCS12 为 DER（首字节 0x30）。损坏的 secret（截断/含空格）
          # 会报与密码错误相同的 MAC verification failed——先区分数据 vs 密码。
          for f in dev_cert dis_cert; do
            B="$RUNNER_TEMP/$f.p12"
            if [ ! -s "$B" ]; then
              echo "::error::$f.p12 解码为空——APPLE_${f%%_*}_CERT_P12 secret 缺失或为空"; exit 1
            fi
            FIRST="$(xxd -p -l 1 "$B")"
            if [ "$FIRST" != "30" ]; then
              echo "::error::$f.p12 解码后首字节 0x$FIRST（期望 0x30）——secret 值不是完整 p12 base64（检查截断/多余字符）"
              exit 1
            fi
          done
          echo "p12 解码校验通过（dev/dis 均为合法 PKCS12）"
          security create-keychain -p "$KC_PASS" "$KC"
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/dev_cert.p12" -k "$KC" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A
          security import "$RUNNER_TEMP/dis_cert.p12" -k "$KC" \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychain -d user -s "$KC"
          echo "签名证书已导入 keychain:"
          security find-identity -v -p codesigning "$KC" | head -5

      # ── 签名归档：两段式（Xcode 26 SPM bundle Copy 源仍字面 Debug-iphoneos，产物
      #    在小写 release-iphoneos——26 布局已变，两段式种入或可生效）─────────
      # 5WHY：Xcode 26.6 对 SPM 资源 bundle 的 archive Copy phase 源仍指向
      # BuildProductsPath/Debug-iphoneos/（字面），而 26 实际构建产物经 symlink 落
      # release-iphoneos——源与产物目录错位 → "couldn't be opened"。首 archive 生成
      # 布局后种入 bundle 至 Debug-iphoneos 再二次 archive；成功后为真实归档，
      # 导出探测/云签名路径与 Xcode 原生一致。
      - name: 签名归档（archive，两段式）
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          set -o pipefail
          DD="$GITHUB_WORKSPACE/Build/ArchiveDerivedData"
          archive_cmd() {
            xcodebuild archive -project "$XCODEPROJ" -scheme "$SCHEME" \
              -configuration release -destination 'generic/platform=iOS' \
              -derivedDataPath Build/ArchiveDerivedData \
              -archivePath Build/VitaLiber.xcarchive \
              -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
              -authenticationKeyID "$APPLE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPLE_API_KEY_ISSUER_ID" \
              -allowProvisioningUpdates \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              MARKETING_VERSION="$RELEASE_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" VITA_LIBER_CODE_HASH="$CODE_HASH"
          }
          rm -rf Build/ArchiveDerivedData Build/VitaLiber.xcarchive
          set +e
          archive_cmd 2>&1 | tee Build/xcodebuild-archive-1.log
          RC1=${PIPESTATUS[0]}
          set -e
          if [ "$RC1" -ne 0 ]; then
            echo "首 archive 失败（预期：Xcode SPM bundle 源/产物目录错位）——种入后重试"
            BP="$DD/Build/Intermediates.noindex/ArchiveIntermediates/VitaLiber/BuildProductsPath"
            BUNDLE="$(find "$DD" -type d -name GRDB_GRDB.bundle 2>/dev/null | head -1)"
            echo "BuildProductsPath: $BP"
            echo "bundle 源: $BUNDLE"
            if [ -n "$BUNDLE" ] && [ -d "$BP" ]; then
              mkdir -p "$BP/Debug-iphoneos"
              cp -R "$BUNDLE" "$BP/Debug-iphoneos/" 2>/dev/null || true
              echo "已种入 $BP/Debug-iphoneos/"
            else
              echo "::warning::bundle 源或 BuildProductsPath 缺失"
            fi
            archive_cmd 2>&1 | tee Build/xcodebuild-archive-2.log
          fi

      # ── 导出 .ipa（app-store 方法）───────────────────────────
      - name: 导出 .ipa
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          /usr/libexec/PlistBuddy -c "Delete :teamID" exportOptions.plist 2>/dev/null || true
          cat > exportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store</string>
              <key>teamID</key><string>TEAM_PLACEHOLDER</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" exportOptions.plist
          rm -rf Build/export
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath Build/VitaLiber.xcarchive \
            -exportOptionsPlist exportOptions.plist \
            -exportPath Build/export \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_KEY_ISSUER_ID" \
            -allowProvisioningUpdates \
            2>&1 | tee Build/xcodebuild-export.log
          ls -la Build/export/
          test -f Build/export/VitaLiber.ipa && echo "ipa 导出成功 ✓"
          # 评审修正：打印 ipa 实际 bundle id 供上传诊断——pilot 应默认从 ipa 解析，
          # 硬编码 app_identifier 曾与 project.yml（com.vitaliber.VitaLiber）不一致
          IPA_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "Build/VitaLiber.xcarchive/Products/Applications/VitaLiber.app/Info.plist" 2>/dev/null || echo unknown)"
          echo "ipa bundle id: $IPA_APP_ID"

      # ── 推送 TestFlight（API Key 认证，无需 2FA）────────────
      - name: 上传 TestFlight（fastlane pilot）
        if: ${{ env.APPLE_API_KEY_P8 != '' }}
        run: |
          command -v fastlane >/dev/null 2>&1 || brew install fastlane >/dev/null 2>&1
          NOTES="${{ inputs.notes }}"
          # app_identifier 不硬编码：pilot 默认从 ipa 的 CFBundleIdentifier 解析，
          # 与 project.yml/归档产物天然一致（评审修正——硬编码曾与真实 bundle id 不符）
          PILOT_OPTS=(upload --ipa Build/export/VitaLiber.ipa)
          PILOT_OPTS+=(--api_key_path "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8")
          PILOT_OPTS+=(--api_key_id "$APPLE_API_KEY_ID")
          PILOT_OPTS+=(--api_key_issuer_id "$APPLE_API_KEY_ISSUER_ID")
          if [ -n "$NOTES" ]; then PILOT_OPTS+=(--changelog "$NOTES"); fi
          fastlane pilot "${PILOT_OPTS[@]}"
          echo "TestFlight 上传完成 ✓"

      # ── 未配置凭据时明确提示（不误报）───────────────────────
      - name: 凭据未配置——仅完成编译，跳过上传
        if: ${{ env.APPLE_API_KEY_P8 == '' }}
        run: |
          echo "::warning::未配置 APPLE_API_KEY_P8 等签名凭据——本次仅跑 L0+编译门禁，未上传 TestFlight"
          echo "配置：Settings → Secrets → Actions → APPLE_API_KEY_ID / APPLE_API_KEY_ISSUER_ID / APPLE_API_KEY_P8 / APPLE_TEAM_ID"
