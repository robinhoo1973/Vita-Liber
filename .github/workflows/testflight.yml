# ============================================================================
# 构建 + TestFlight 发布 CI（2026-10-07 瘦身 P2；2026-10-07 消解 ci-tests.yml）
#
# gates (ubuntu ∥)：L0 十九节 + schema 完整性（含 swiftc 断言）——挡 upload（机械冻结；
#   单源定义 .github/workflows/l0-static-gate.yml）
# build (macos)：版本内联 → 签名材料导入 → archive → export → IPA 校验 → artifact
# upload (macos)：altool → 复核（buildUploads 秒级正面证据 + ≤3 轮列表确认）
# corekit / l1 (macos ∥)：swift test / 编译门禁 + L1 单元/UI——自 ci-tests.yml 迁入
#   （业主 2026-10-07 指令「没必要保留 ci-tests.yml，迁移到对应的 yml」）。
#
# 发布裁决 = 整流全绿（2026-10-07 业主裁决,当日终稿三阶段 DAG）：
#   **(L0 ∥ CoreKit) → (L1 ∥ build) → upload**
# 一级任一红不进二级（L0 不过不进 L1 字面兑现）；二级 l1∥build 并联（两个编译
# 互相独立,绿路径省 ≈13-22 分钟）；upload 依赖四者 success——测试红 ⇒ 不上传
# TestFlight（安全闸口不变,二级红白烧的只是免费分钟）。
# 触发：workflow_dispatch 唯一发布入口（2026-10-08 业主指令）；2026-10-09 增
#   schedule（每月 2 日）仅驱动 llama XCFramework 自动重建（最新 llama.cpp
#   release），App 侧全链在 schedule 事件下整体跳过。push 不自动跑整流/上传；
#   推送链路的静态面由本地 pre-push 钩子承担（L0 20 节 + CoreKit 测试 + symcheck）。
# 2026-10-06 业主指令：ASR/LLAMA 构建步骤已删除（归 asr.yml）。
# 2026-10-07 业主指令：ASR/LLAMA 痕迹零残留之延伸；v* tag 触发删除（无版本语义）。
# 委员会重设计全文：refactor/discussions/2026-10-06-build-testflight-slim-round1.md。
#
# 前置凭据（Settings → Secrets → Actions）：APPLE_API_KEY_ID / APPLE_API_KEY_ISSUER_ID /
#   APPLE_API_KEY_P8（base64）/ APPLE_TEAM_ID / APPLE_DEV_CERT_P12 / APPLE_DIS_CERT_P12 /
#   APPLE_CERT_PASSWORD / APPLE_DIS_PROVISION_PROFILE（base64）。
# 上传方式：xcrun altool --upload-app（NetDiagnostics 同款；2026-09-03 起替代 fastlane
#   pilot——后者上传后 build 永不登记）。altool 弃用 tripwire 保留（日志含 deprecat→::warning::）。
# Xcode 主版本升级指引：①确认全绿基线；②同步「环境与工具链」断言；③L0→L1→归档→上传
#   全链路回归；④新工具链若令编译/测试变红，按错误族修复并沉淀。
# CI/CD 审计脉络：2026-09-10 round1 / 2026-09-21 hardening / 2026-10-06 slim-round1 /
#   2026-10-07 ci-tests 消解 / 2026-10-07 触发面手动化（取消 push 自动触发） /
#   2026-10-08 PR 触发删除——仅手动 dispatch（本轮）。
#
name: Build + TestFlight

on:
  workflow_dispatch:
    inputs:
      build_xcframework:
        # 2026-10-09 业主指令:llama XCFramework 构建自 llm.yml 迁入(它是 App 构建
        # 依赖——CoreKit/Package.swift binaryTarget——归属发布面而非蒸馏管线)。
        # 勾选=仅重建并发布 zip(release llama-xcframework);App 构建/上传全部跳过。
        description: "只重建 llama XCFramework（发布 zip 到 release；跳过 App 构建与上传）"
        type: boolean
        default: false
      llama_ref:
        # 2026-10-09 业主指令：XCF 构建自动获取最新且适合 iOS 的 llama.cpp
        # release，每月自动 run 一次（schedule）；本输入仅在需要回钉历史版本时使用。
        description: "（可选）llama.cpp 版本覆盖（如 b11012）；留空=自动取最新 release"
        type: string
        required: false
        default: ""
  schedule:
    # 每月 2 日 03:41 UTC 自动重建 llama XCFramework（业主 2026-10-09 指令：
    # 自动取最新 llama.cpp release 构建）。错开整点（cron 高峰延迟官方点名）。
    # 产物=内容寻址新资产（绝不覆写历史资产）——App 消费的仍是 Package.swift
    # 钉死的那一份，切换=人工提交一行（本 job 产出可粘贴行 + API digest 对账）。
    # 注：GitHub 对 60 天无活动仓停用 schedule（本仓高频活动，风险低，登记）。
    - cron: '41 3 2 * *'
  # 2026-10-07 业主指令：取消 push 自动触发——push master 不再自动跑整流并随之上传
  # TestFlight（发布入口改为手动 dispatch；同 llm.yml 先例「重建改手动」同族法理）。
  # 历史：v* tag 触发亦已于 2026-10-07 删除（tag 不携带 App 版本语义，版本唯一
  # 来源 version.txt，tag run 独立并发组可与上传并行造成重复构建）。

concurrency:
  group: testflight-${{ github.ref }}
  # 2026-09-27 委员会裁决 P9：发布路径取消语义 → 排队——新 push 取消进行中的
  # TestFlight 上传会造成半上传态 + build 号已占（重跑 90189 终态）+ 发布面半成品。
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCHEME: VitaLiber
  XCODEPROJ: VitaLiber.xcodeproj

jobs:
  # ═══════════════════════════════════════════════════════════════
  # Job 1: 解析版本号（ubuntu，快速廉价）
  # ═══════════════════════════════════════════════════════════════
  # ═══════════════════════════════════════════════════════════════
  # L0 静态门禁（ubuntu 并行）：与 build 同时跑,失败挡 upload（机械冻结——
  # 仓库无分支保护,此为五架构门禁唯一自我兑现装置）。2026-10-07 起执行体为
  # composite action ./.github/actions/l0-gate（workflows/ 四文件化）；测试 job
  # （corekit/l1）同文件下方并行运行。版本解析已内联进 build。
  # ═══════════════════════════════════════════════════════════════
  gates:
    name: 'L0 静态门禁（并行）'
    # schedule（月度 XCF 重建）不跑 App 侧全链——只跑 llama-xcframework job。
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # caller 显式权限（composite 无权限面，job 承担；workflow 级声明为兜底）。
    permissions:
      contents: read
    steps:
      # v7.0.1；固定完整 SHA（node24 运行时）。本地 action 要求先检出。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/l0-gate
        with:
          artifact-name: release-gates-l0-log

  # ═══════════════════════════════════════════════════════════════
  # 测试面（2026-10-07 自 ci-tests.yml 迁入——业主指令消解该文件；与
  # gates/build 并行；2026-10-07 业主裁决：upload 四依赖门控（测试红不上传）。）
  # ═══════════════════════════════════════════════════════════════
  corekit:
    name: 'CoreKit 域层测试（swift test）'
    # 2026-10-09:仅重建 XCFramework 时跳过 App 侧全链(见 on.workflow_dispatch.inputs)
    if: ${{ github.event_name != 'schedule' && inputs.build_xcframework != true }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: 缓存 CoreKit SPM 构建中间物
        uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7   # v5.0.2 restore-only（node24；固定完整 SHA）
        with:
          # **路径集必须与写入方（发布链 spm-v2 缓存）逐项一致**——actions/cache 的
          # 缓存"版本"= 键+路径集哈希,子集请求与前缀 restore 均互不可见
          #（CI 37480186873 实证 "Cache not found"）。
          # restore-only（2026-10-07 SRE 席实证修复）：原用 actions/cache@v5.0.2 +
          # lookup-only:true，但 Post 步仍建新条目（run 37580929300 日志：
          # "Lookup only - skipping download" 之后 Post 仍 "Cache saved with key
          # ck-v1-macOS-…" 829MB）——配额 9.94/10GB 的主因之一。restore 子动作
          # 无 Post 写面，从机制上杜绝；写入方只留发布链。
          # 未命中时回退冷路径（llama 资产已重建,下载 96MB 可通）。
          path: |
            CoreKit/.build
            Build/DerivedData/SourcePackages
          key: ck-v1-${{ runner.os }}-${{ hashFiles('CoreKit/Package.resolved', 'CoreKit/Package.swift') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-

      - name: CoreKit 域层测试（swift test）
        run: |
          set -o pipefail
          mkdir -p Build
          cd CoreKit
          # 防御（2026-10-07，CI 37517009998 实证）：恢复的缓存可能携带陈旧
          # workspace-state.json（旧 binaryTarget 校验和），SwiftPM 反篡改守卫
          # 据此拒载新产物——清状态强制重解析（检出仍在,重解析秒级）。
          rm -f .build/workspace-state.json
          # 诊断先关 errexit：默认 shell bash -e 会在管道失败瞬间杀步，
          # 失败摘要/注解块永远执行不到（CI #634 实证：零注解）。
          set +e
          swift test 2>&1 | tee ../Build/corekit-swift-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # 2026-10-03 审计（CI #629-#635 排障盲区）：job 日志需登录、诊断产物需 auth，
            # 唯一公开可读的通道 = 注解（::error:: 服务端渲染）+ step summary。
            # 并行编译下错误行之后还有在途「Compiling」行冲刷——tail 会错过错误行，
            # 注解通道用 grep 直抓错误行，tail 仅作上下文兜底。
            {
              echo "### CoreKit swift test 失败摘要（自动截取）"
              echo '```'
              grep -E "error:|✘|failed|Fatal" ../Build/corekit-swift-test.log | tail -30 || true
              echo '--- 上下文（tail 25）---'
              tail -25 ../Build/corekit-swift-test.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|✘|failed|Fatal" ../Build/corekit-swift-test.log | head -8 | while IFS= read -r line; do
              echo "::error::CoreKit: $line"
            done || true
            grep -E "error:|✘" ../Build/corekit-swift-test.log | tail -6 | while IFS= read -r line; do
              echo "::error::CoreKit: $line"
            done || true
            exit "$status"
          fi
          echo "CoreKit 域层测试通过 ✓"

      - name: 上传 CoreKit 诊断日志（失败时）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: corekit-test-log
          path: Build/corekit-swift-test.log
          retention-days: 7
          if-no-files-found: ignore

  # ── 编译门禁（Debug 快通道）+ L1 单元/UI（复用同一构建产物）───────
  l1:
    name: '编译门禁 + L1 单元/UI'
    # 2026-10-09:仅重建 XCFramework 时跳过(同 corekit;upload 四依赖门控随之
    # 整体跳过——重建 dispatch 绝不触发 TestFlight 上传)
    if: ${{ github.event_name != 'schedule' && inputs.build_xcframework != true }}
    runs-on: macos-26
    timeout-minutes: 60
    # 二级闸：第一级 gates+corekit 全绿才进入（业主 2026-10-07 三阶段 DAG：
    # (L0 ∥ CoreKit) → (L1 ∥ build) → upload——L0 不过不进 L1 在依赖图上成字面）。
    needs: [gates, corekit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          # 3.13 宽 pin 命中 macos-26 镜像 toolcache（3.13.15）——精确 pin 3.13.5
          # 会走下载（发布链同款修复随 P2 落地）；哈希钉轮子为 cp313,ABI 兼容。
          python-version: '3.13'

      - name: 缓存 SPM 依赖与编译产物
        uses: actions/cache/restore@8b402f58fbc84540c8b491a91e594a4576fec3d7   # v5.0.2 restore-only（node24；固定完整 SHA）
        with:
          path: |
            CoreKit/.build
            Build/DerivedData/SourcePackages
          # 与发布链 spm-v2 同键同路径集,仅恢复不写（旧设计的两个陷阱:子集路径
          # →"版本"失配恢复不到;同键异构写出→覆盖发布链条目反噬其 CoreKit/.build。
          # CI 37480186873 实证）。2026-10-07 SRE 席实证修复:改 restore 子动作——
          # 原 lookup-only 形态的 Post 步仍写条目（PR merge-ref 656MB 死条目即此
          # 步产物，master 永不可恢复）。
          key: spm-v2-${{ runner.os }}-${{ hashFiles('CoreKit/Package.resolved', 'CoreKit/Package.swift', 'project.yml') }}
          restore-keys: |
            spm-v2-${{ runner.os }}-

      - name: 环境与工具链
        run: |
          xcodebuild -version
          # 发布流水线 Xcode 主版本断言（审计 2026-09-10）：macos-26 镜像
          # 的 Xcode 主版本变化时按文件头「Xcode 主版本升级指引」显式放行，
          # 防止 Swift 语言模式/编译器默认值随镜像静默漂移造成「昨天绿今天红」。
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)"
          if [ "$XCODE_MAJOR" != "26" ]; then
            echo "::error::runner Xcode 主版本为 $XCODE_MAJOR（期望 26）——请按 workflow 文件头升级指引评估后同步断言"
            exit 1
          fi
          # 纯 ASCII 输出：日志服务对「数字紧跟全角括号」的 UTF-8 字节组合
          # 会输出替换字符（U+FFFD），诊断时无法肉眼读取实际值。
          echo "Xcode major assertion passed: actual=$XCODE_MAJOR expected=26"

      - name: 生成 Xcode 工程
        run: |
          set -o pipefail
          mkdir -p Build
          if [ -d "$XCODEPROJ" ]; then
            echo "已有 $XCODEPROJ"
          elif [ -f project.yml ]; then
            # 审计 2026-09-10：不再吞 stderr——brew 失败即步骤失败且原因落盘。
            brew install xcodegen 2>&1 | tee Build/brew-xcodegen.log && xcodegen generate
          else
            echo "::error::缺 project.yml 且无 xcodeproj"; exit 1
          fi

      - name: 读取 App release 版本（version.txt）
        id: ver
        run: |
          set -euo pipefail
          python3 .github/actions/release/release-version.py \
            --version-file version.txt \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --code-hash "$(git rev-parse --short=8 HEAD)" \
            --output "$GITHUB_OUTPUT"

      # ── ASR 校验依赖（2026-10-06 CI 37391026526 实证）：Xcode 预构建脚本
      # 「Generate trusted model hashes」经 model-trust.py → asr_package →
      # asr_envelope 导入链需要 cryptography（R1 信封批引入）——macOS runner
      # 不预装。哈希钉版 venv 一次装齐，MODEL_PYTHON 注入编译步使脚本用 venv
      # 解释器（PEP 668 同族,ERR#54）。

      - name: 安装 ASR 校验依赖（哈希钉版）
        run: |
          if [ ! -x /tmp/model-tools-venv/bin/python3 ]; then
            python3 -m venv /tmp/model-tools-venv
          fi
          if ! /tmp/model-tools-venv/bin/python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/config/requirements/requirements-model-tools.txt" >/tmp/model-pip.log 2>&1; then
            echo "::error::ASR 校验依赖安装失败"
            cat /tmp/model-pip.log
            exit 1
          fi
          echo "ASR 校验依赖安装成功（venv，哈希钉版）"

      # ── 编译门禁（build-for-testing）：失败即停 ───────

      - name: 编译门禁（build-for-testing）
        env:
          MODEL_PYTHON: /tmp/model-tools-venv/bin/python3
        run: |
          set -o pipefail
          mkdir -p Build
          DEST=$(python3 - <<'PY'
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","--json","devices","available"]))
          pairs = [(rt, v["name"], v["udid"]) for rt, devs in d["devices"].items()
                   for v in devs if v.get("isAvailable") and v["name"].startswith("iPhone")]
          spec = [p for p in pairs if p[1] == "iPhone 15"]
          pick = spec[0] if spec else sorted(pairs)[0]
          print(f"platform=iOS Simulator,id={pick[2]}")
          PY
          )
          echo "destination: $DEST"
          # 评审修正第二轮（三份拷贝合并）：L1 单元/UI 两步复用同一目的地——
          # 模拟器解析逻辑单一来源，命名漂移只改一处
          echo "DEST=$DEST" >> "$GITHUB_ENV"
          # 防御（同 corekit 步）：恢复的 SourcePackages 可能含陈旧
          # workspace-state.json——xcodebuild 亦受 SwiftPM 反篡改守卫约束。
          rm -f Build/DerivedData/SourcePackages/workspace-state.json
          # 子项目 I（CI 34758298829 实证）：swift-perception 带 SwiftPM 宏目标（PerceptionMacros），
          # Xcode 15+ 对第三方宏做指纹信任校验，无人值守构建报「Macro … must be enabled before it
          # can be used」。-skipMacroValidation 等价 IDESkipMacroFingerprintValidation；供应链约束由
          # project.yml exactVersion + Package.resolved 钉版承担，不在此处放松。四处 xcodebuild 同旗标。
          # 类型检查预算诊断（业主 2026-09-17 定：仅告警，不阻断）。
          # CI 35166937683 实证：`List → ForEach → WithPerceptionTracking` 里 13 实参 + 链式
          # 修饰符的 View 表达式会让编译器 abort（unable to type-check in reasonable time），
          # 而这族在本机无型检通道时**永远看不见**——本轮为此烧了 3 轮 CI（≈57 分钟）。
          # 业界口径：用编译器自带的开关，而非自研启发式；且**不得**配 warnings-as-errors——
          # 该告警非确定（同一表达式在慢机器上更容易越线），做硬门禁会随机红。
          # 详见 discussions/2026-09-17-confirm-review-benchmark-round1.md §8.1。
          # 诊断先关 errexit（同 CoreKit 步：bash -e 会在管道失败瞬间杀步）
          set +e
          xcodebuild build-for-testing \
            -skipMacroValidation \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath Build/DerivedData \
            MARKETING_VERSION="${{ steps.ver.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.ver.outputs.build }}" \
            VITA_LIBER_CODE_HASH="${{ steps.ver.outputs.hash }}" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS='-Xfrontend -warn-long-expression-type-checking=500 -Xfrontend -warn-long-function-bodies=1000' \
            2>&1 | tee Build/xcodebuild-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # 2026-10-03 审计：编译失败摘要落 step summary + 注解（公开可读），
            # 与本步 tee 的完整日志互补——远端排障不再盲猜（CI #629-#633 盲区复盘）。
            {
              echo "### xcodebuild 编译失败摘要（自动截取 tail 60 行原文）"
              echo '```'
              tail -60 Build/xcodebuild-build.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:" Build/xcodebuild-build.log | head -10 | while IFS= read -r line; do
              echo "::error::xcodebuild: $line"
            done || true
            tail -8 Build/xcodebuild-build.log | while IFS= read -r line; do
              echo "::error::xcodebuild: $line"
            done || true
            exit "$status"
          fi
          echo "编译门禁通过 ✓"

      # 型检预算报告（仅告警）：即使编译失败也出报告——失败时最需要它。

      - name: 类型检查预算报告（超预算表达式 / 函数体）
        if: always()
        run: |
          LOG=Build/xcodebuild-build.log
          if [ ! -f "$LOG" ]; then echo "无构建日志，跳过"; exit 0; fi
          # 带出「文件:行号」，直接可点；同时打日志与 step summary——本仓的检索习惯是读日志，
          # 只写 summary 等于只有点开 UI 才看得见（首轮实测如此）。
          grep -E 'took [0-9]+ms to (type-check|compile)' "$LOG" | sort -u > /tmp/long-typecheck.txt || true
          {
            echo "## 类型检查预算（表达式 >500ms / 函数体 >1000ms）"
            echo ""
            echo "告警不代表失败（该告警非确定，故不阻断）——但反复出现的表达式应当拆解。"
            echo ""
            if [ -s /tmp/long-typecheck.txt ]; then
              echo '```'
              head -40 /tmp/long-typecheck.txt
              echo '```'
            else
              echo "无超预算表达式 ✓"
            fi
          } | tee /tmp/long-typecheck-summary.md >> "$GITHUB_STEP_SUMMARY"

      # ── L1 测试（评审修正 C4 + 业主决定第 7 项）────────────
      # 此前全流水线仅 build-for-testing（编译），gate-suites.tsv 里 26 个
      # required 测试套件**从未被执行**——「套件存在」≠「套件跑过」
      # （ERR#27/30/39 同族）。业主决定：Linux CoreKit job 整体移除，
      # 应用层/UI 套件在 iOS 模拟器真实执行（scheme 测试目标 =
      # VitaLiberTests + VitaLiberUITests）；CoreKit 包测试由上方
      # `swift test` 步骤在 macOS runner 真实执行（XcodeGen 不支持
      # 包测试目标进 scheme）。复用 build-for-testing 产物
      # （test-without-building）省去二次编译；任一 red 即阻断归档上传。

      - name: L1 单元测试（VitaLiberTests）
        run: |
          set -o pipefail
          echo "destination: ${DEST}"
          # 同 CoreKit/编译门禁步：诊断先关 errexit，失败摘要/注解可达
          set +e
          xcodebuild test-without-building \
            -skipMacroValidation \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DEST" \
            -derivedDataPath Build/DerivedData \
            -only-testing:VitaLiberTests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### L1 单元测试失败摘要（自动截取 tail 60 行原文）"
              echo '```'
              tail -60 Build/xcodebuild-test.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "recorded an issue|Expectation failed|XCTAssert" Build/xcodebuild-test.log | head -10 | while IFS= read -r line; do
              echo "::error::xcodebuild-test: $line"
            done || true
            tail -4 Build/xcodebuild-test.log | while IFS= read -r line; do
              echo "::error::xcodebuild-test: $line"
            done || true
            exit "$status"
          fi
          echo "L1 单元测试通过 ✓"

      # ── L1 UI 测试（XCUITest，CLAUDE.md L1 第二条命令）────────

      - name: L1 UI 测试（VitaLiberUITests）
        run: |
          set -o pipefail
          echo "destination: ${DEST}"
          # 失败重试（2026-09-16，CI 35061342620 实证）：
          # `Failed to launch ... via Xcode: Timed out while launching application`
          # 是 XCUITest 在 CI 上的**已知环境抖动**（冷模拟器 / runner 资源竞争），
          # 不是产品缺陷——同一份 App 代码在 35058385040 通过、在 35061342620 因启动
          # 超时失败，两次唯一的差别是 runner 状态。Apple 为此提供
          # `-retry-tests-on-failure`，UI 测试失败重试是业界标准做法。
          #
          # **重试不得静默**（本仓 ERR#27「缺证据被当成有证据」纪律）：下方在最终
          # 通过时反查日志里的失败计数，若曾出现失败即打印告警——重试掩盖真实缺陷
          # 是本仓明令禁止的，必须让人看见并判断「是不是抖动」。
          #
          # 不加 `-test-iterations 2`（评审指出）：它会让**全部** UI 测试基线时长翻倍，
          # 且每次迭代都重启一次 App——恰好**增加**了本项要防御的启动超时抖动的暴露
          # 次数（每次启动是独立抖动机会），与防御目标相抵。`-retry-tests-on-failure`
          # 单独即达成「容忍单次抖动」，且只在真的失败时才多跑一次。
          # 同族诊断：先关 errexit，失败摘要/注解可达（bash -e 杀诊断块族）
          set +e
          xcodebuild test-without-building \
            -skipMacroValidation \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "${DEST}" \
            -derivedDataPath Build/DerivedData \
            -only-testing:VitaLiberUITests \
            -retry-tests-on-failure \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-uitest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### L1 UI 测试失败摘要（自动截取 tail 60 行原文）"
              echo '```'
              tail -60 Build/xcodebuild-uitest.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -12 Build/xcodebuild-uitest.log | while IFS= read -r line; do
              echo "::error::xcodebuild-uitest: $line"
            done || true
            exit "$status"
          fi
          if grep -qE "with [1-9][0-9]* failure" Build/xcodebuild-uitest.log; then
            echo "::warning::UI 测试曾失败并被重试后通过——请核对 Build/xcodebuild-uitest.log 是启动抖动还是真实缺陷。重试只容忍环境抖动，不容忍产品缺陷。"
            grep -nE "Timed out while launching|with [1-9][0-9]* failure" Build/xcodebuild-uitest.log | head -10
          fi
          echo "L1 UI 测试通过 ✓"

      - name: 上传构建诊断日志（失败/取消时）
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-diagnostics
          path: |
            Build/*.log
            Build/corekit-swift-test.log
            Build/xcodebuild-*.log
            Build/brew-xcodegen.log
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  # 编译 + 签名归档 + 导出 IPA
  # ═══════════════════════════════════════════════════════════════
  build:
    name: '编译 + 导出 IPA'
    # 2026-10-09:仅重建 XCFramework 时跳过(同 corekit/l1)
    if: ${{ github.event_name != 'schedule' && inputs.build_xcframework != true }}
    outputs:
      # 2026-09-27 委员会裁决 P6：产物存在性输出（不信任 env 布尔，信任产物文件）
      ipa_ready: ${{ steps.ipa-ready.outputs.ipa_ready }}
      # 版本内联（2026-10-07 P2）：upload 侧复核精确匹配本值。
      build_number: ${{ steps.ver.outputs.build }}
    # 钉版 macos-26（审计 2026-09-10）：发布流水线拒绝隐式工具链漂移；
    # 镜像内 Xcode 主版本变化由下方断言显式拦截，升级按文件头指引执行。
    runs-on: macos-26
    # 2026-10-07 P2：瘦身后预期 ~16-20min，60 保留 3x 余量（原 120×实测 43min；
    # 挂死 run 在排队语义下会堵整条队——超时即释放队首）。
    timeout-minutes: 60
    # 三阶段 DAG 第二级（业主 2026-10-07）：(L0 ∥ CoreKit) → (L1 ∥ build) → upload。
    # gates/corekit 任一红 ⇒ 默认跳过（不入二级）；**l1 与 build 并联**——两个编译
    # 互相独立，串行白等 l1 的 UI 测试时长（≈13-22 分钟/绿路径）；l1 红在 upload
    # 闸口拦截（四依赖门控见下），安全语义不变。
    needs: [gates, corekit]
    # 密钥面收窄：job 级 env 只保留存在性布尔，实际密钥值由各消费步骤
    # 以 step 级 env 注入——不消费密钥的步骤（artifact 上传等）
    # 不再可见密钥内容。
    env:
      HAS_P8: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      HAS_CERTS: ${{ secrets.APPLE_DEV_CERT_P12 != '' && secrets.APPLE_DIS_CERT_P12 != '' }}
      HAS_PP: ${{ secrets.APPLE_DIS_PROVISION_PROFILE != '' }}
    steps:
      # v7.0.1；固定完整 SHA，防可变 tag 被上游供应链替换（node24 运行时）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          # 3.13 宽 pin 命中 macos-26 镜像 toolcache（3.13.15,精确 3.13.5 会走下载）
          python-version: '3.13'

      - name: 读取 App release 版本（version.txt；2026-10-07 P2 内联自 version job）
        id: ver
        run: |
          set -euo pipefail
          python3 .github/actions/release/release-version.py \
            --version-file version.txt \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --code-hash "$(git rev-parse --short=8 HEAD)" \
            --output "$GITHUB_OUTPUT"

      # 凭据完备性硬校验（2026-10-07 P2）：缺任一签名凭据即具名红——防
      # 「绿而无 IPA」在纯编译+上传定位下静默通过（ERR#30 族）。
      - name: 签名凭据完备性校验
        run: |
          missing=""
          [ "$HAS_P8" = "true" ] || missing="$missing APPLE_API_KEY_P8"
          [ "$HAS_CERTS" = "true" ] || missing="$missing APPLE_DEV_CERT_P12/APPLE_DIS_CERT_P12"
          [ "$HAS_PP" = "true" ] || missing="$missing APPLE_DIS_PROVISION_PROFILE"
          if [ -n "$missing" ]; then
            echo "::error::签名凭据缺失:$missing——补建 Secrets 后重跑（纯编译+上传链不允许跳签名）"
            exit 1
          fi

      # 构建缓存（2026-09-16 委员会评审·性能）：CI 43 分钟里 SPM 依赖图被
      # `swift test` 与 Xcode 构建**冷编译两次**（此前全 workflow 零 cache）。
      # 键含 Package.resolved/Package.swift/project.yml 哈希——依赖或工程定义变化
      # 即自动失效，不引入陈旧构建（缓存只存依赖与编译中间物，不存产物）。
      - name: 缓存 SPM 依赖与编译产物
        uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7   # v5.0.2（node24 运行时；固定完整 SHA）
        with:
          path: |
            CoreKit/.build
            Build/DerivedData/SourcePackages
          # Cache namespace bump: Package.swift binaryTarget checksums can change
          # while the old artifact remains valid in a broad restore-key cache.
          # Never restore a pre-checksum-update artifact into SwiftPM.
          key: spm-v2-${{ runner.os }}-${{ hashFiles('CoreKit/Package.resolved', 'CoreKit/Package.swift', 'project.yml') }}
          # 2026-10-07 移除 restore-keys（原 CI-37480186873/37517009998 实证）：
          # 键变更日（Package.swift 等入哈希）前缀命中的旧缓存携带旧
          # workspace-state.json——SwiftPM 反篡改守卫据其拒载新校验和产物
          #（'artifact has changed checksum … won't be downloaded'）,冷路径
          # 反而健康。键变更时全冷重建的代价（依赖重编）换确定性。


      - name: 环境与工具链
        run: |
          xcodebuild -version
          # 发布流水线 Xcode 主版本断言（审计 2026-09-10）：macos-26 镜像
          # 的 Xcode 主版本变化时按文件头「Xcode 主版本升级指引」显式放行，
          # 防止 Swift 语言模式/编译器默认值随镜像静默漂移造成「昨天绿今天红」。
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)"
          if [ "$XCODE_MAJOR" != "26" ]; then
            echo "::error::runner Xcode 主版本为 $XCODE_MAJOR（期望 26）——请按 workflow 文件头升级指引评估后同步断言"
            exit 1
          fi
          # 纯 ASCII 输出：日志服务对「数字紧跟全角括号」的 UTF-8 字节组合
          # 会输出替换字符（U+FFFD），诊断时无法肉眼读取实际值。
          echo "Xcode major assertion passed: actual=$XCODE_MAJOR expected=26"

      - name: 生成 Xcode 工程
        run: |
          set -o pipefail
          mkdir -p Build
          if [ -d "$XCODEPROJ" ]; then
            echo "已有 $XCODEPROJ"
          elif [ -f project.yml ]; then
            # 审计 2026-09-10：不再吞 stderr——brew 失败即步骤失败且原因落盘。
            brew install xcodegen 2>&1 | tee Build/brew-xcodegen.log && xcodegen generate
          else
            echo "::error::缺 project.yml 且无 xcodeproj"; exit 1
          fi

      # ── 签名材料到期预警（审计 2026-09-10 新增）──────────────
      # 证书/PP 到期是「静默悬崖」：平时一切绿色，到期日归档/导出突然失败，
      # 且失败信息晦涩（errSecInternalComponent / 无可用 signing identity）。
      # 左移为门禁：≤30 天 ::warning::（进入轮换窗口），≤7 天 ::error::
      # 阻断（已过 Apple 提醒期仍未轮换，立即处理并更新仓库 Secrets）。
      - name: 签名材料到期预警
        if: ${{ env.HAS_CERTS == 'true' && env.HAS_PP == 'true' }}
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DIS_CERT_P12: ${{ secrets.APPLE_DIS_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DIS_PROVISION_PROFILE: ${{ secrets.APPLE_DIS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          echo "$APPLE_DEV_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/exp_dev.p12"
          echo "$APPLE_DIS_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/exp_dis.p12"
          echo "$APPLE_DIS_PROVISION_PROFILE" | base64 -d > "$RUNNER_TEMP/exp_profile.mobileprovision"
          fail=0
          check_days() {
            local label="$1" enddate="$2" days
            days=$(python3 - "$enddate" <<'PY'
          import sys
          from datetime import datetime, timezone
          s = sys.argv[1]
          end = None
          for fmt in ('%b %d %H:%M:%S %Y %Z', '%Y-%m-%dT%H:%M:%SZ', '%Y-%m-%dT%H:%M:%S.%fZ'):
              try:
                  end = datetime.strptime(s, fmt)
                  break
              except ValueError:
                  continue
          if end is None:
              print('PARSE_FAIL'); raise SystemExit
          if end.tzinfo is None:
              end = end.replace(tzinfo=timezone.utc)
          print((end - datetime.now(timezone.utc)).days)
          PY
          )
            if [ "$days" = "PARSE_FAIL" ]; then
              echo "::warning::$label 到期日解析失败：$enddate"
              return 0
            fi
            # 2026-09-27 委员会裁决 P5：负天数=已过期（比 ≤7 更严重）——此前与
            # -1 哨兵碰撞被当「解析失败」仅 warning 放行，门禁在唯一重要的日子失职。
            if [ "$days" -lt 0 ]; then
              echo "::error::$label 已过期 $((-days)) 天（$enddate）——立即轮换并更新仓库 Secrets"
              return 1
            fi
            if [ "$days" -le 7 ]; then
              echo "::error::$label 将在 $days 天内到期（$enddate）——请立即轮换并更新仓库 Secrets"
              return 1
            elif [ "$days" -le 30 ]; then
              echo "::warning::$label 将在 $days 天内到期（$enddate）——请安排轮换并更新仓库 Secrets"
            else
              echo "$label 剩余 $days 天 ✓"
            fi
            return 0
          }
          for f in dev dis; do
            cert_pem="$RUNNER_TEMP/exp_$f.cert.pem"
            # 解析失败不触发 set -e（走 check_days 的告警路径），故显式 || true。
            (P12_PASS="$APPLE_CERT_PASSWORD" openssl pkcs12 -in "$RUNNER_TEMP/exp_$f.p12" -passin env:P12_PASS -clcerts -nokeys -out "$cert_pem" 2>/dev/null \
             || openssl pkcs12 -in "$RUNNER_TEMP/exp_$f.p12" -passin pass: -clcerts -nokeys -out "$cert_pem" 2>/dev/null) || true
            end=$(openssl x509 -in "$cert_pem" -noout -enddate 2>/dev/null | sed 's/^notAfter=//' || true)
            check_days "$f 证书" "$end" || fail=1
            rm -f "$cert_pem"
          done
          pp_end=$(security cms -D -i "$RUNNER_TEMP/exp_profile.mobileprovision" 2>/dev/null | plutil -extract ExpirationDate raw - 2>/dev/null || true)
          check_days "Provisioning Profile" "$pp_end" || fail=1
          rm -f "$RUNNER_TEMP"/exp_*
          if [ "$fail" = "1" ]; then exit 1; fi
          echo "签名材料到期预警通过 ✓"

      # ── 解码 ASC API Key ─────────────────────────────
      - name: 解码 App Store Connect API Key
        if: ${{ env.HAS_P8 == 'true' }}
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          umask 077
          mkdir -p "$GITHUB_WORKSPACE/private_keys"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          chmod 600 "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "API Key 已就绪"

      # ── 导入签名证书（p12 via openssl PEM split）────
      - name: 导入签名证书（p12）
        if: ${{ env.HAS_CERTS == 'true' }}
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DIS_CERT_P12: ${{ secrets.APPLE_DIS_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KC=build.keychain
          KC_PASS="buildkeychain"
          export P12_PASS="$APPLE_CERT_PASSWORD"
          echo "$APPLE_DEV_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dev_cert.p12"
          echo "$APPLE_DIS_CERT_P12" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/dis_cert.p12"
          for f in dev_cert dis_cert; do
            B="$RUNNER_TEMP/$f.p12"
            [ -s "$B" ] || { echo "::error::$f.p12 解码为空"; exit 1; }
            FIRST="$(xxd -p -l 1 "$B")"
            [ "$FIRST" = "30" ] || { echo "::error::$f.p12 首字节 0x${FIRST}（期望 0x30）——非合法 PKCS12"; exit 1; }
          done
          echo "p12 解码校验通过"
          security create-keychain -p "$KC_PASS" "$KC" 2>/dev/null || true
          security default-keychain -s "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -t 3600 "$KC"
          import_p12() {
            local f="$1" pass="$2" name="$3"
            local pem="$f.pem"
            if P12_PASS="$pass" openssl pkcs12 -in "$f" -passin env:P12_PASS -nodes -out "$pem" 2>/dev/null; then
              local cert_pem="$f.cert.pem"
              local key_pem="$f.key.pem"
              P12_PASS="$pass" openssl pkcs12 -in "$f" -passin env:P12_PASS -clcerts -nokeys -out "$cert_pem" 2>/dev/null
              P12_PASS="$pass" openssl pkcs12 -in "$f" -passin env:P12_PASS -nocerts -nodes -out "$key_pem" 2>/dev/null
              if [ -s "$cert_pem" ] && [ -s "$key_pem" ]; then
                security import "$cert_pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                security import "$key_pem" -k "$KC" -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                echo "$name: PEM 拆分导入成功"
                rm -f "$pem" "$cert_pem" "$key_pem"
                return 0
              fi
              local std_p12="$f.std.p12"
              # 仅在 umask 077 的 RUNNER_TEMP 内临时重封装为空密码 p12；
              # 不把 APPLE_CERT_PASSWORD 传给 security -P（该参数会出现在进程列表）。
              openssl pkcs12 -export -in "$pem" -passout pass: -out "$std_p12" 2>/dev/null
              if [ -s "$std_p12" ]; then
                security import "$std_p12" -k "$KC" -P '' -T /usr/bin/codesign -T /usr/bin/xcodebuild -A 2>/dev/null
                echo "$name: 重封装 p12 导入成功"
                rm -f "$pem" "$std_p12"
                return 0
              fi
              rm -f "$pem" "$std_p12"
            fi
            echo "::error::$name: 所有导入路径均失败"
            return 1
          }
          for f in dev_cert dis_cert; do
            P12="$RUNNER_TEMP/$f.p12"
            NAME="${f%%_*}"
            if openssl pkcs12 -in "$P12" -passin env:P12_PASS -noout 2>/dev/null; then
              import_p12 "$P12" "$APPLE_CERT_PASSWORD" "$NAME" && continue
            fi
            if openssl pkcs12 -in "$P12" -passin pass: -noout 2>/dev/null; then
              import_p12 "$P12" "" "$NAME" && continue
            fi
            echo "::error::$NAME: 密码错误（secret 密码与空密码均无法解析 p12）"
            exit 1
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychain -d user -s "$KC"
          echo "已导入 identities:"
          security find-identity -v -p codesigning "$KC"

      # ── 导入 Provisioning Profile ─────────────────────
      - name: 导入 Provisioning Profile
        if: ${{ env.HAS_PP == 'true' }}
        env:
          APPLE_DIS_PROVISION_PROFILE: ${{ secrets.APPLE_DIS_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$APPLE_DIS_PROVISION_PROFILE" | base64 -d > "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision" 2>/dev/null | \
            plutil -extract Name raw - 2>/dev/null && echo "profile 名称 ✓" || echo "profile 导入完成"
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # 能力核对（2026-09-16 主动排查，不等它变成末端阻塞）：
          # App 声明了 com.apple.developer.healthkit（VitaLiber.entitlements 与
          # project.yml entitlements.properties 双声明，F16 只读接入所需）。若本
          # profile 未授予该能力，流水线会在**末端**的 exportArchive 处以模糊的
          # entitlement 报错失败——那一步之后才是 TestFlight 上传，定位成本最高，
          # 且失败信息不会指出「是 profile 缺能力」。此处前移到导入步骤并点名原因。
          PP="$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision"
          security cms -D -i "$PP" > /tmp/pp.plist 2>/dev/null || true
          if plutil -p /tmp/pp.plist 2>/dev/null | grep -q 'com.apple.developer.healthkit'; then
            echo "profile 含 HealthKit capability ✓"
          else
            echo "::error::导入的 Provisioning Profile 未授予 com.apple.developer.healthkit。App 声明了该 entitlement，归档/导出必失败。请在 Apple Developer 后台为该 App ID 启用 HealthKit 并重新生成 profile，再更新 APPLE_DIS_PROVISION_PROFILE 机密。"
            exit 1
          fi
      - name: 安装 ASR 校验依赖（哈希钉版）
        run: |
          if [ ! -x /tmp/model-tools-venv/bin/python3 ]; then
            python3 -m venv /tmp/model-tools-venv
          fi
          if ! /tmp/model-tools-venv/bin/python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/config/requirements/requirements-model-tools.txt" >/tmp/model-pip.log 2>&1; then
            echo "::error::ASR 校验依赖安装失败"
            cat /tmp/model-pip.log
            exit 1
          fi
          # 2026-10-07 P2：venv 即 MODEL_PYTHON 单一来源（系统 pip 重复装已删）——
          # archive 的预构建脚本（Generate trusted model hashes）经它导入 cryptography。
          echo "MODEL_PYTHON=/tmp/model-tools-venv/bin/python3" >> "$GITHUB_ENV"
          echo "ASR 校验依赖安装成功（venv，哈希钉版）"
      - name: 签名归档 + 导出 IPA
        if: ${{ env.HAS_CERTS == 'true' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          BUILD="${{ steps.ver.outputs.build }}"
          HASH="${{ steps.ver.outputs.hash }}"
          ARCH="Build/VitaLiber.xcarchive"
          rm -rf "$ARCH" Build/export
          # 同族诊断：先关 errexit（bash -e 杀诊断块族）
          set +e
          xcodebuild archive \
            -skipMacroValidation \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath Build/DerivedData \
            -archivePath "$ARCH" \
            -authenticationKeyPath "$GITHUB_WORKSPACE/private_keys/AuthKey_$APPLE_API_KEY_ID.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_KEY_ISSUER_ID" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD" VITA_LIBER_CODE_HASH="$HASH" \
            2>&1 | tee Build/xcodebuild-archive.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### xcodebuild archive 失败摘要（自动截取 tail 60 行原文）"
              echo '```'
              tail -60 Build/xcodebuild-archive.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -12 Build/xcodebuild-archive.log | while IFS= read -r line; do
              echo "::error::xcodebuild-archive: $line"
            done || true
            exit "$status"
          fi
          echo "archive 完成 ✓"
          echo "=== archive Info.plist ==="
          plutil -p "$ARCH/Info.plist" 2>/dev/null || cat "$ARCH/Info.plist"
          # 归档内嵌提交哈希硬闸（通用断言,2026-10-07 起）：App 内嵌 VITA_LIBER_CODE_HASH
          # 必须等于当前 HEAD——将「产物与提交身份一致性」钉成端到端断言（任一日后引入的
          # 增量/缓存/环境混装导致陈旧对象渗入,此闸秒级拦截）。
          BUILT_HASH="$(/usr/libexec/PlistBuddy -c 'Print :VitaLiberBuildHash' \
            "$ARCH/Products/Applications/VitaLiber.app/Info.plist" 2>/dev/null || echo '?')"
          CURRENT_HASH="$(git rev-parse --short=8 HEAD)"
          if [ "$BUILT_HASH" != "$CURRENT_HASH" ]; then
            echo "::error::归档内嵌提交哈希($BUILT_HASH)≠当前 HEAD($CURRENT_HASH)——产物与提交身份不一致(陈旧对象渗入/构建环境混装);请报告此事件并全量冷跑复核"
            exit 1
          fi
          echo "构建哈希闸通过: $BUILT_HASH"
          # 导出 IPA
          PROFILE_FILE="$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)"
          PROFILE_NAME=""
          if [ -n "$PROFILE_FILE" ]; then
            PROFILE_NAME="$(security cms -D -i "$PROFILE_FILE" 2>/dev/null | plutil -extract Name raw - 2>/dev/null || true)"
          fi
          if [ -z "$PROFILE_NAME" ] || [ "$PROFILE_NAME" = "null" ]; then
            echo "::error::未找到 Provisioning Profile"; exit 1
          fi
          echo "profile: $PROFILE_NAME"
          APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$ARCH/Products/Applications/VitaLiber.app/Info.plist" 2>/dev/null || echo 'com.vitaliber.app')"
          echo "bundle id: $APP_ID"
          cat > exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key><string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$APP_ID</key><string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key><true/>
              <!-- 2026-10-07 P2：Xcode 13+ 默认代管构建号会改写 CFBundleVersion,
                   使复核「精确匹配本次 build」永不命中（假红/假宽容）——显式钉死。 -->
              <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          set +e
          xcodebuild -exportArchive \
            -archivePath "$ARCH" \
            -exportOptionsPlist exportOptions.plist \
            -exportPath Build/export \
            2>&1 | tee Build/xcodebuild-export.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### xcodebuild exportArchive 失败摘要（自动截取 tail 60 行原文）"
              echo '```'
              tail -60 Build/xcodebuild-export.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -12 Build/xcodebuild-export.log | while IFS= read -r line; do
              echo "::error::xcodebuild-export: $line"
            done || true
            exit "$status"
          fi
          test -f Build/export/VitaLiber.ipa && echo "ipa 导出成功 ✓"

      - name: 校验 IPA 框架 minOS 与路径安全
        if: ${{ env.HAS_CERTS == 'true' }}
        run: python3 .github/actions/release/reconcile-frameworks.py --ipa Build/export/VitaLiber.ipa

      # 模型单源断言（2026-10-09 换型+下载化批；L0 [20] 的产物面镜像）：
      # 模型不随包（运行时自 CNB 下载）——包内出现 .gguf 即红；
      # 信任锚目录 catalog.json 必须在包内（丢了 = 下载面失能而不自知）。
      - name: 校验 IPA 不含下载件（模型单源断言）
        if: ${{ env.HAS_CERTS == 'true' }}
        run: |
          set -euo pipefail
          IPA="Build/export/VitaLiber.ipa"
          [ -f "$IPA" ] || { echo "::error::IPA 不存在"; exit 1; }
          if unzip -l "$IPA" | grep -E '\.gguf$'; then
            echo "::error::IPA 内含 .gguf——模型应经运行时下载，不得随包（单一来源纪律）"
            exit 1
          fi
          if ! unzip -l "$IPA" | grep -E 'LLMCatalog/catalog\.json$'; then
            echo "::error::IPA 缺 LLMCatalog/catalog.json——信任锚目录未入包，下载面将失能"
            exit 1
          fi
          echo "IPA 模型单源断言通过：无 .gguf、含 LLMCatalog/catalog.json"

      # ── 上传 IPA 到 Artifact（供 upload job 下载）────
      # 2026-09-27 委员会裁决 P6：IPA 产物存在性标记——签名材料缺失时 build 仍是
      # success（签名步骤被 if 跳过），upload job 若只看 result 会在 download-artifact
      # 处以谜之错误失败。此处按产物文件判真并输出，upload 侧具名失败。
      - name: 记录 IPA 产物存在性
        id: ipa-ready
        if: always()
        run: |
          if [ -f Build/export/VitaLiber.ipa ]; then
            echo "ipa_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ipa_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传 IPA artifact
        if: ${{ env.HAS_CERTS == 'true' }}
        # v7.0.1；固定完整 SHA（node24 运行时），artifact action 运行在含签名材料的 job 中。
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vitaliber-ipa
          path: Build/export/VitaLiber.ipa
          retention-days: 1
          if-no-files-found: error

      # hosted runner 会销毁，但失败/取消路径也必须主动删签名材料，避免后续步骤误上传。
      - name: 清理构建签名材料
        if: ${{ always() }}
        run: |
          rm -rf "$GITHUB_WORKSPACE/private_keys"
          rm -f "$RUNNER_TEMP/dev_cert.p12" "$RUNNER_TEMP/dis_cert.p12" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/dev.mobileprovision" \
            exportOptions.plist
          # 2026-10-07 P2 修复：原 rm 相对路径是 no-op（钥匙串在 ~/Library/Keychains/）——
          # 改用 security delete-keychain 真正删除。
          security delete-keychain build.keychain 2>/dev/null || true

      # ── 失败诊断 artifact（审计 2026-09-10 新增）────────
      # hosted runner 销毁后失败证据即灭失；此前只能靠 workflow 日志猜。
      - name: 上传构建诊断日志（失败/取消时）
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: build-diagnostics
          path: |
            Build/*.log
            Build/xcodebuild-*.log
            Build/brew-xcodegen.log
          retention-days: 7
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  # Job 3: 上传 TestFlight —— 直接 xcrun altool（NetDiagnostics 已验证方式）
  # ═══════════════════════════════════════════════════════════════
  upload:
    name: '上传 TestFlight'
    needs: [build, gates, corekit, l1]
    # 与 build job 同钉 macos-26（审计 2026-09-10），防工具链漂移。
    runs-on: macos-26
    # P2：altool ~95s + 复核收窄后 ≤~4min + 固定开销——15 保留 3x 余量。
    timeout-minutes: 15
    # 三个 needs 齐绿才放行（2026-10-07 委员会取证修复）：`!cancelled()` 是状态检查
    # 函数——会让本 job 在依赖失败时照常评估 if，而原式只查 build ⇒ **gates（L0
    # 机械冻结）红时 upload 照跑**，与 :4/:55 注释声明的「gates 挡 upload」相悖
    # （声明的断言≠执行的断言族；历史尚未触发=潜伏缺口）。补 gates 子句：
    # 红/跳过（result != 'success'）一律不放行，取消语义（!cancelled）保持原样。
    # 测试门控上传（业主 2026-10-07 裁决：测试红 ⇒ 不上传 TestFlight——
    # 注释「任一 red 即阻断归档上传」由此成真；整流全绿 = 已发布 = 单一裁决）。
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.gates.result == 'success'
        && needs.corekit.result == 'success' && needs.l1.result == 'success' }}
    steps:
      # 哈希钉版清单（requirements-asc-tools.txt）随仓获取，与 build job 同纪律。
      # 顺序纪律（CI 35585337312 实证）：checkout 默认 clean 会 git clean -ffdx
      # **连同 git-ignored 的 Build/ 一起删除**——必须排在下载 artifact 之前，
      # 否则刚下载的 IPA 被清掉、检查步骤报「IPA 文件不存在」。
      - name: 检出仓库（哈希钉版依赖清单）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # 钉版 Python（2026-09-21；2026-10-07 P2 宽 pin）：pip --require-hashes 钉的
      # 轮子按解释器版本取哈希（cffi cp313）——3.13 宽 pin 命中 macos-26 镜像
      # toolcache（3.13.15），精确 3.13.5 会走下载（省 ~25s/job）。
      - name: 配置钉版 Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'

      # 2026-09-27 委员会裁决 P6：build 成功但无 IPA = 签名材料缺失——具名失败，
      # 而非在 download-artifact 处以 "No artifacts found" 谜之失败。
      - name: 前置检查 IPA 产物
        if: ${{ needs.build.outputs.ipa_ready != 'true' }}
        run: |
          echo "::error::build 成功但未产出 IPA——签名材料缺失或导出失败；请核对 APPLE_* Secrets 后重跑"
          exit 1

      - name: 下载 IPA artifact
        if: ${{ needs.build.outputs.ipa_ready == 'true' }}
        # v8.0.1；固定完整 SHA（node24 运行时），避免可变 tag 供应链风险。
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vitaliber-ipa
          path: Build/export/

      # ── 凭据与产物检查：缺失即失败（不再“绿色成功 + 跳过”）────
      - name: 检查 TestFlight 上传凭据
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$APPLE_API_KEY_P8" ] || missing+=(APPLE_API_KEY_P8)
          [ -n "$APPLE_API_KEY_ID" ] || missing+=(APPLE_API_KEY_ID)
          [ -n "$APPLE_API_KEY_ISSUER_ID" ] || missing+=(APPLE_API_KEY_ISSUER_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::TestFlight 上传凭据未配置：${missing[*]}，本次上传失败"
            exit 1
          fi
          test -f Build/export/VitaLiber.ipa || { echo "::error::IPA 文件不存在"; exit 1; }
          echo "凭据与 IPA 就绪"

      # ── 写入 ASC API Key 到 altool 约定路径 ──────────────────
      # altool --apiKey <ID> 会读取 ~/.appstoreconnect/private_keys/AuthKey_<ID>.p8
      - name: 准备 App Store Connect API Key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          K="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          echo "$APPLE_API_KEY_P8" | base64 -d > "$K"
          chmod 600 "$K"
          [ -s "$K" ] || { echo "::error::API Key 解码为空"; exit 1; }
          echo "API Key 文件已就绪：$K"

      # ── 注册/核对 Bundle ID 与 App 记录（NetDiagnostics asc_app_ensure）──
      # 上传前确保 App ID(com.vitaliber.app) 已在开发者门户注册、App 记录存在。
      - name: 注册/核对 Bundle ID 与 App 记录
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # 固定版本并禁用缓存/交互；依赖安装失败立即停，绝不在含 p8 的 job 中继续执行未知代码。
          # PEP 668（externally-managed-environment，ERR#54）：macOS runner 的
          # Homebrew Python 拒绝裸 pip install（含 --user）——统一走 venv，
          # PATH 前置后本步骤后续 python3 调用即用 venv 解释器（jwt 导入可用）。
          if [ ! -x /tmp/asc-venv/bin/python3 ]; then
            python3 -m venv /tmp/asc-venv
          fi
          export PATH="/tmp/asc-venv/bin:$PATH"
          if ! python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/config/requirements/requirements-asc-tools.txt" >/tmp/pip.log 2>&1; then
            echo "::error::Python 依赖安装失败"
            cat /tmp/pip.log
            exit 1
          fi
          echo "Python 依赖安装成功（venv，哈希钉版）"
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          [ -f "$P8" ] || { echo "::error::p8 不存在"; exit 1; }
          KEYID="$APPLE_API_KEY_ID" ISS="$APPLE_API_KEY_ISSUER_ID" \
          python3 - "$P8" <<'PYEOF'
          import sys, os, json, time, urllib.request, urllib.error
          import jwt
          p8 = open(sys.argv[1]).read()
          now = int(time.time())
          tok = jwt.encode({'iss': os.environ['ISS'], 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'},
                           p8, algorithm='ES256', headers={'alg': 'ES256', 'kid': os.environ['KEYID']})
          BASE = 'https://api.appstoreconnect.apple.com/v1'
          def call(method, url, body=None):
              req = urllib.request.Request(url, method=method)
              req.add_header('Authorization', 'Bearer ' + tok)
              req.add_header('Accept', 'application/json')
              if body is not None:
                  req.add_header('Content-Type', 'application/json')
                  req.data = json.dumps(body).encode()
              try:
                  with urllib.request.urlopen(req) as r:
                      return r.status, json.loads(r.read() or b'{}')
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read() or b'{}')
          BID = 'com.vitaliber.app'
          APP_NAME = 'Vita Liber'
          # 1) Bundle ID（App ID）注册核对
          st, d = call('GET', f'{BASE}/bundleIds?filter[identifier]={BID}')
          bids = d.get('data', [])
          if bids:
              print(f'[OK] Bundle ID 已注册: id={bids[0]["id"]} identifier={bids[0]["attributes"].get("identifier")}')
          else:
              print(f'[..] Bundle ID 未注册 → 创建 Vita Liber / {BID}')
              st, d = call('POST', f'{BASE}/bundleIds', {'data': {'type': 'bundleIds', 'attributes': {'name': 'Vita Liber', 'identifier': BID, 'platform': 'IOS'}}})
              bids = d.get('data', [])
              if bids:
                  print(f'[OK] Bundle ID 已创建: id={bids[0]["id"]}')
              else:
                  print('[X] Bundle ID 创建失败:', json.dumps(d.get("errors", d), ensure_ascii=False)[:400])
                  raise SystemExit(1)
          # 2) App 记录：查询（缺失时由下方创建或 altool 上传自动创建）
          st, d = call('GET', f'{BASE}/apps?filter[bundleId]={BID}')
          apps = d.get('data', [])
          if not apps:
              print(f'[..] 尝试创建 App 记录: name="{APP_NAME}" bundle={BID} sku=VITA-LIBER')
              st, d = call('POST', f'{BASE}/apps', {'data': {'type': 'apps', 'attributes': {'name': APP_NAME, 'bundleId': BID, 'sku': 'VITA-LIBER', 'primaryLocale': 'en-US'}}})
              apps = d.get('data', [])
              if not apps:
                  print('[WARN] API 创建 App 失败（当前 API Key 可能无 CREATE 权限，仅 GET/UPDATE）:')
                  print('     ', json.dumps(d.get("errors", d), ensure_ascii=False)[:400])
                  print('[WARN] 将交由 altool 上传自动创建 App 记录；若仍失败请手动在 ASC 创建')
                  print('       My Apps → + → 名称 Vita Liber / Bundle ID 选 com.vitaliber.app / SKU VITA-LIBER')
          if apps:
              a = apps[0]['attributes']
              print(f'[OK] App 记录: id={apps[0]["id"]} name="{a.get("name")}" bundleId={a.get("bundleId")} sku={a.get("sku")}')
              if BID in (a.get('name') or ''):
                  print('[WARN] App name 包含 bundle id —— 记录可能由上传自动创建，名称非人工设置')
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('APP_ID=' + apps[0]['id'] + '\n')
              print('APP_ID=' + apps[0]['id'])
          else:
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write('APP_ID=\n')
              print('APP_ID=（空 —— 上传自动创建后由复核步骤按 bundleId 解析）')
          PYEOF

      # ── 上传：xcrun altool（同步校验，退出码即结果）─────────
      # 参考 NetDiagnostics action.yml：--upload-app + --apiKey/--apiIssuer。
      # altool 会同步完成 Apple 初步校验，失败返回非零退出码并在日志给出 ITMS 错误。
      - name: 上传 TestFlight（xcrun altool）
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f Build/export/VitaLiber.ipa -t ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_KEY_ISSUER_ID" \
            --verbose 2>&1 | tee Build/altool-upload.log
          # 捕获 Delivery UUID（buildUpload 资源 id），供复核步骤查询 Apple 处理状态
          UUID=$(grep -oE 'Delivery UUID: [0-9a-fA-F-]{36}' Build/altool-upload.log | awk '{print $3}' | head -1 || true)
          if [ -n "$UUID" ]; then
            echo "捕获 Delivery UUID: $UUID"
            echo "DELIVERY_UUID=$UUID" >> "$GITHUB_ENV"
          else
            echo "::warning::未在 altool 日志中捕获到 Delivery UUID"
          fi
          echo "altool 已受理上传 ✓（Apple 处理完成前 TestFlight 不会立即可见，通常几分钟）"
          # 2026-09-27 委员会 P7 第一批：弃用/协议漂移 tripwire——不阻断（弃用仍工作），
          # 但命中必须让人看见（Apple 移除 altool/旧协议时静默断供的前哨）。
          if grep -iE 'deprecat' Build/altool-upload.log; then
            echo "::warning::altool 日志含弃用提示——上传协议漂移前哨（委员会 P7）；迁移路线见 workflow 头注"
          fi

      # ── 复核：轮询 Build 是否登记 + 查询 buildUpload 处理错误 ──
      # JWT 用 PyJWT + cryptography 签发（含 aud=appstoreconnect-v1，缺它 401）。
      # ① 查 preflight 确定的 App（$APP_ID）最近 builds；② 查本次 Delivery 处理状态。
      - name: 复核 Build 登记状态
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
        run: |
          set -euo pipefail
          # PEP 668 同族（ERR#54）：复用前一步骤 venv；若前序未建（job 重跑
          # 单步等场景）则此处重建，保持复核步骤的宽容语义（失败仅告警）。
          if [ ! -x /tmp/asc-venv/bin/python3 ]; then
            python3 -m venv /tmp/asc-venv || { echo "::warning::venv 创建失败，跳过复核"; exit 0; }
          fi
          export PATH="/tmp/asc-venv/bin:$PATH"
          if ! python3 -m pip install --disable-pip-version-check --no-cache-dir \
            --require-hashes -r "$GITHUB_WORKSPACE/.github/config/requirements/requirements-asc-tools.txt" >/tmp/pip.log 2>&1; then
            echo "::warning::复核步骤 Python 依赖安装失败，跳过复核"
            cat /tmp/pip.log
            exit 0
          fi
          echo "Python 依赖安装成功（venv，哈希钉版）"
          P8="$HOME/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY_ID.p8"
          [ -f "$P8" ] || { echo "::warning::p8 不存在，跳过复核"; exit 0; }
          # 与「注册/核对」步骤同一签发模式（heredoc + os.environ，CI 35588830526 实证
          # 该模式可用）：此前为 python3 -c 内联插值 + `2>/dev/null || true`——失败原因
          # 被吞（响亮失败纪律违反），且与另两处签发各写一份（三副本漂移）。失败时
          # 输出 stderr 到日志，复核降级为告警但不再静默。
          mk_token() {
            local err="$RUNNER_TEMP/mktoken-err.$$"
            if KEYID="$APPLE_API_KEY_ID" ISS="$APPLE_API_KEY_ISSUER_ID" python3 - "$P8" 2>"$err" <<'PYEOF'
          import sys, os, time
          import jwt
          key = open(sys.argv[1]).read()
          now = int(time.time())
          tok = jwt.encode({'iss': os.environ['ISS'], 'iat': now, 'exp': now + 1200, 'aud': 'appstoreconnect-v1'},
                           key, algorithm='ES256', headers={'alg': 'ES256', 'kid': os.environ['KEYID']})
          print(tok)
          PYEOF
            then
              rm -f "$err"
              return 0
            else
              # 告警必须走 stderr：stdout 会被 TOKEN=$(mk_token) 捕获成「伪令牌」
              echo "::warning::JWT 签发失败：$(head -5 "$err" 2>/dev/null || echo 无 stderr)" >&2
              rm -f "$err"
              return 1
            fi
          }
          # 避免把短期 JWT 作为 curl -H 命令行参数暴露给同 runner 的进程列表。
          asc_curl() {
            local url="$1" cfg="$RUNNER_TEMP/asc-curl-${RANDOM}.conf"
            umask 077
            printf 'header = "Authorization: Bearer %s"\n' "$TOKEN" > "$cfg"
            curl -sS -g --max-time 30 --config "$cfg" "$url"
            rm -f "$cfg"
          }
          # ② 查询本次 buildUpload 的 Apple 处理状态/错误（若捕获到 UUID）——
          # 2026-10-07 P2：错误即刻硬红（秒级失败证据,不再等满轮询窗口）。
          if [ -n "${DELIVERY_UUID:-}" ]; then
            TOKEN=$(mk_token || true)
            if [ -n "$TOKEN" ]; then
              echo "── buildUpload ${DELIVERY_UUID} 处理状态 ──"
              # 程序走 heredoc stdin、数据走 argv 文件（mk_token 同形态——heredoc 会
              # 覆盖管道 stdin，`| python3 - <<EOF` 时数据根本进不来；-c 形态又有
              # 续行缩进坑，两害相权取此）
              asc_curl "https://api.appstoreconnect.apple.com/v1/buildUploads/$DELIVERY_UUID" 2>/dev/null > "$RUNNER_TEMP/resp-upload.json"
              UPLOAD_EARLY=$(python3 - "$RUNNER_TEMP/resp-upload.json" <<'PYEOF'
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print('解析失败:', e); raise SystemExit
          if 'errors' in d:
              print('API 错误:', json.dumps(d['errors'], ensure_ascii=False)[:400]); raise SystemExit
          a = d.get('data', {}).get('attributes', {})
          st = a.get('state', {})
          print('cfBundle:', a.get('cfBundleShortVersionString'), 'build', a.get('cfBundleVersion'))
          print('state:', st.get('state'))
          if st.get('errors'):
              print('!! errors:', json.dumps(st['errors'], ensure_ascii=False)[:800])
          if st.get('warnings'):
              print('!! warnings:', json.dumps(st['warnings'], ensure_ascii=False)[:800])
          if not (st.get('errors') or st.get('warnings')):
              print('(无 errors/warnings)')
          PYEOF
              )
              echo "$UPLOAD_EARLY"
              if echo "$UPLOAD_EARLY" | grep -q '!! errors:'; then
                echo "::error::buildUpload state.errors 非空——Apple 已出具失败证据（秒级）;见上方详情"
                exit 1
              fi
            fi
          fi
          # 解析要查询的 App id（优先 preflight 写入的 APP_ID；为空则按 bundleId 反查）
          APP="${APP_ID:-}"
          if [ -z "$APP" ]; then
            echo "按 bundleId=com.vitaliber.app 解析当前 App id..."
            TOKEN=$(mk_token || true)
            if [ -n "$TOKEN" ]; then
              asc_curl "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.vitaliber.app" 2>/dev/null > "$RUNNER_TEMP/resp-app.json"
              APP=$(python3 - "$RUNNER_TEMP/resp-app.json" 2>/dev/null <<'PYEOF' || true
          import json, sys
          try: print(json.load(open(sys.argv[1]))['data'][0]['id'])
          except Exception: print('')
          PYEOF
            )
            fi
            echo "解析到 APP=$APP"
          fi
          # 审计 2026-09-10 修正：此前任一 build 命中即 break，把上一轮的
          # 旧 build 当成「本次已登记」（实证：本轮 306.1 上传后，复核在第 1
          # 次轮询命中旧 build 305.1 即报「已登记」）。改为精确匹配本次
          # BUILD（= CFBundleVersion），登记结论与合规告警才指向本次 build。
          EXPECTED="${{ needs.build.outputs.build_number }}"
          found=0
          # 3×30s = 90s 列表确认（2026-10-07 P2 收窄,业主裁决）：Apple 侧入列
          # 延迟是常量（实测 ~4min）——正面证据改由上方 buildUploads 秒级查询承担
          #（无 errors 即受理证据）；本循环只做「更快看到已登记」的增量确认。
          # 三档判定与红条件不变（未入列且 state=PROCESSING → 宽容档绿）。
          for i in $(seq 1 3); do
            TOKEN=$(mk_token || true)
            if [ -z "$TOKEN" ]; then
              echo "::error::JWT 生成失败——「受理≠登记」，无 Apple 侧正面证据不得以绿色冒充成功（委员会 P4）"
              exit 1
            fi
            if [ -z "$APP" ]; then
              echo "::error::仍无 App 记录且上传未自动创建——build 登记无从验证（委员会 P4：未证实即红）"
              exit 1
            fi
            asc_curl "https://api.appstoreconnect.apple.com/v1/builds?sort=-uploadedDate&limit=5&filter[app]=$APP" 2>/dev/null > "$RUNNER_TEMP/resp-builds.json"
            OUT=$(python3 - "$RUNNER_TEMP/resp-builds.json" 2>/dev/null <<'PYEOF' || true
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception:
              raise SystemExit
          if 'errors' in d:
              print('APIERR ' + json.dumps(d['errors'], ensure_ascii=False)[:300]); raise SystemExit
          bs = d.get('data', [])
          if not bs:
              print('NONE')
          else:
              for b in bs:
                  a = b['attributes']
                  mc = a.get('missingExportCompliance')
                  comp = 'YES' if mc is True else ('NO' if mc is False else '?')
                  print('BUILD %s state=%s compliance=%s uploaded=%s' % (a.get('version','?'), a.get('processingState','?'), comp, a.get('uploadedDate','?')))
          PYEOF
            )
            echo "  第 ${i} 次复核（$(date -u +%H:%M:%S)）：$(echo "$OUT" | head -1)"
            if echo "$OUT" | grep -qF "BUILD ${EXPECTED} state="; then
              echo "$OUT" | grep -F "BUILD ${EXPECTED} " | head -3
              echo "→ 本次 build ${EXPECTED} 已登记（VALID 后 TestFlight 就绪；PROCESSING 属正常处理中）"
              # 审计 2026-09-10：出口合规缺失 = build 已上传但分发被阻塞，
              # 且此前只混在字段里打印，无人注意——改为对本次 build 显式告警 + 处置指引。
              if echo "$OUT" | grep -F "BUILD ${EXPECTED} " | grep -q 'compliance=YES'; then
                echo "::warning::本次 build ${EXPECTED} 缺少出口合规声明（Missing Compliance）——TestFlight 分发被阻塞；请到 App Store Connect → TestFlight → 构建版本 → Export Compliance 作答（本应用无加密内容，选豁免）后恢复"
              fi
              found=1
              break
            fi
            sleep 30
          done
          # 2026-09-27 委员会 P4 三档判定：
          #   红 = 无 Apple 侧正面证据（未证实不得绿——ERR#27 纪律延伸）
          #   宽容 = Apple API 自证「处理中」（慢日档，build 320.1 历史假阴性的正解）
          #   90189/90xx = 确定终态，不享宽容（重跑无用，指引 bump 版本号）
          if [ "$found" = "0" ]; then
            UPLOAD_STATE="$(python3 - "$RUNNER_TEMP/resp-upload.json" 2>/dev/null <<'PYEOF' || echo UNKNOWN
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
              st = d.get('data', {}).get('attributes', {}).get('state', {})
              print('PROCESSING' if st and not st.get('errors') else ('ERRORS' if st and st.get('errors') else 'UNKNOWN'))
          except Exception:
              print('UNKNOWN')
          PYEOF
            )"
            if grep -qE 'ITMS-90[0-9]+' Build/altool-upload.log; then
              echo "::error::altool 返回 ITMS-90xx（含 90189 重复构建号）——确定终态；重跑无用，请 bump CURRENT_PROJECT_VERSION 后重跑"
              exit 1
            elif [ "$UPLOAD_STATE" = "ERRORS" ]; then
              echo "::error::buildUpload state.errors 非空——Apple 已出具失败证据，见上方 buildUpload 详情"
              exit 1
            elif [ "$UPLOAD_STATE" = "UNKNOWN" ]; then
              echo "::error::约 6 分钟内 build ${EXPECTED} 未登记且无 Apple 侧正面证据（无 Delivery UUID/状态未知）——未证实不得绿；请用 maintenance workflow 的 asc-status job 查处理状态"
              exit 1
            else
              echo "::warning::build ${EXPECTED} 尚未入列表但 buildUpload state=PROCESSING——Apple 自证处理中（慢日档），后续请用 maintenance workflow 的 asc-status job 核对"
            fi
          fi

      # 2026-10-07 P2：altool/复核日志此前只落上传 job 工作区,随 runner 销毁灭失——
      # 与 build 侧同款 7 天诊断 artifact（唯一比当天更长寿命的公开证据通道）。
      - name: 上传诊断日志（失败/取消时）
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: upload-diagnostics
          path: |
            Build/*.log
            Build/altool-upload.log
          retention-days: 7
          if-no-files-found: ignore

      - name: 清理上传凭据
        if: ${{ always() }}
        run: |
          rm -rf "$HOME/.appstoreconnect"
          rm -f "$RUNNER_TEMP"/asc-curl-*.conf

  # ═══════════════════════════════════════════════════════════════
  # llama XCFramework（2026-10-09 业主指令：自 llm.yml 迁入——它是 App 构建
  # 依赖（CoreKit/Package.swift binaryTarget），归属发布面而非蒸馏管线）。
  # 2026-10-09 业主二次指令：**自动获取最新且适合 iOS 的 llama.cpp release
  # 构建，每月 run 一次**（schedule 见 on:；dispatch 勾 build_xcframework 为
  # 手动补跑/回钉（llama_ref 覆盖）；App 侧全链在 schedule 下自动跳过）。
  # 分发纪律（内容寻址，绝不覆写历史）：
  #   - 资产名 = llama-<ref>-xcframework-<设备切片内容前16位>.zip——同名=同内容
  #     （切片二进制跨重建稳定，2026-10-09 测试席实证），重发幂等；
  #   - **不再 --clobber**：旧钉版资产原地不动，App 消费的始终是 Package.swift
  #     钉死的那一份；切换 = 人工提交一行（本 job 在 step summary 产出可粘贴行，
  #     并以 API digest 与本地 sha256 对账后才给）。
  # minOS：sed 16.4→16.0 后**硬断言已生效**（上游改字面串即红，防静默产出 16.4
  # 切片只在末端 reconcile 才爆）；构建后断言三切片存在且 minOS==16.0。
  # ═══════════════════════════════════════════════════════════════
  llama-xcframework:
    name: 'llama XCFramework 重建（最新/指定版）'
    if: ${{ github.event_name == 'schedule' || inputs.build_xcframework == true }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: 环境断言
        run: |
          xcodebuild -version
          cmake --version
          sysctl -n hw.logicalcpu

      - name: 解析构建版本（默认最新 release；dispatch 可用 llama_ref 覆盖）
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.llama_ref }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE" ]; then
            REF="$OVERRIDE"
          else
            REF="$(gh api repos/ggml-org/llama.cpp/releases/latest --jq .tag_name)"
          fi
          # 只接受上游常规数字 tag（b#### 系列）——latest 指向异常标签即红，不带着怪值去构建
          case "$REF" in
            b[0-9]*) ;;
            *) echo "::error::llama.cpp 版本标签异常：$REF"; exit 1 ;;
          esac
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "resolved llama.cpp ref: $REF"

      - name: 检出 llama.cpp（解析出的版本）
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: git clone --depth 1 --branch "$REF" https://github.com/ggml-org/llama.cpp.git llama-src

      - name: 构建三切片 xcframework 并打包（含 minOS/切片断言）
        id: build
        working-directory: llama-src
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: |
          set -euo pipefail
          # 官方脚本：参数 = 构建集合；顺序产出 build-apple/llama.xcframework
          # 平台下限改 16.0（上游默认 16.4 是随意值——llama.cpp 无 16.4 专属 API；
          # 应用基线 iOS 16.0，reconcile-frameworks.py 门禁拒绝 16.4 切片）。
          # sed 无断言 = 上游改字面串即静默 no-op（产出 16.4 只在末端爆）——断言生效：
          sed -i.bak 's/IOS_MIN_OS_VERSION=16.4/IOS_MIN_OS_VERSION=16.0/' build-xcframework.sh
          grep -q 'IOS_MIN_OS_VERSION=16.0' build-xcframework.sh || { echo "::error::minOS sed 未生效（上游 build-xcframework.sh 字面串漂移）"; exit 1; }
          ./build-xcframework.sh ios-sim ios-device macos
          test -d build-apple/llama.xcframework || { echo "::error::xcframework 未产出"; exit 1; }
          python3 - <<'PY'
          import pathlib, plistlib, sys
          root = pathlib.Path("build-apple/llama.xcframework")
          expected = {"ios-arm64": "16.0", "ios-arm64_x86_64-simulator": "16.0", "macos-arm64_x86_64": None}
          missing = [name for name in expected if not (root / name).is_dir()]
          if missing:
              sys.exit(f"切片缺失（上游构建面变化）: {missing}")
          for name, minos in expected.items():
              if minos is None:
                  continue
              info = plistlib.loads((root / name / "llama.framework" / "Info.plist").read_bytes())
              actual = info.get("MinimumOSVersion")
              if actual != minos:
                  sys.exit(f"{name} minOS={actual} ≠ {minos}（sed 未覆盖该切片路径）")
          print("三切片与 minOS 断言通过")
          PY
          cd build-apple
          # 内容寻址：设备切片二进制跨重建稳定（2026-10-09 实证）——同名=同内容，重发幂等
          SLICE_SHA16="$(shasum -a 256 llama.xcframework/ios-arm64/llama.framework/llama | cut -c1-16)"
          ASSET="llama-${REF}-xcframework-${SLICE_SHA16}.zip"
          zip -r -y "$ASSET" llama.xcframework
          shasum -a 256 "$ASSET" | tee checksum.txt
          ls -la "$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: 打包产物兜底上传（发布失败不丢构建）
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # 与 asr.yml 同款 pin
        with:
          name: llama-xcframework
          path: llama-src/build-apple/*.zip
          retention-days: 14

      - name: 发布到 release（内容寻址资产，不覆写历史）
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.build.outputs.asset }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          ZIP="llama-src/build-apple/$ASSET"
          DIR="llama-src/build-apple"
          # 未 checkout 本仓：gh 命令必须显式 -R 指明仓库（否则 git 报 not a git repository）
          if gh release view llama-xcframework -R "$REPO" >/dev/null 2>&1; then
            if gh release view llama-xcframework -R "$REPO" --json assets --jq '.assets[].name' | grep -qx "$ASSET"; then
              echo "资产已存在（同名=同内容寻址）——跳过上传：$ASSET"
            else
              gh release upload llama-xcframework "$ZIP" -R "$REPO"
            fi
          else
            gh release create llama-xcframework "$ZIP" \
              --title "llama XCFramework（内容寻址：<版本>-<切片内容前16位>）" \
              --notes "自建：ggml-org/llama.cpp 源码经官方 build-xcframework.sh 构建三切片（ios-sim/ios-device/macos，minOS 16.0）；每月自动重建（latest release）或手动 dispatch（llama_ref 回钉）。" \
              -R "$REPO"
          fi
          # 权威 digest：API 回读与本地 sha256 对账（不一致 = 资产与构建不符，硬红）
          DIGEST="$(gh api "repos/$REPO/releases/tags/llama-xcframework" --jq ".assets[] | select(.name==\"$ASSET\") | .digest")"
          LOCAL_SHA="$(cut -d' ' -f1 "$DIR/checksum.txt")"
          if [ "$DIGEST" != "sha256:$LOCAL_SHA" ]; then
            echo "::error::API digest(${DIGEST:-空}) ≠ 本地 sha256(sha256:$LOCAL_SHA)——资产与构建不一致，不得切换"
            exit 1
          fi
          URL="https://github.com/$REPO/releases/download/llama-xcframework/$ASSET"
          {
            echo "## llama XCFramework 就绪（须人工切换 Pin）"
            echo ""
            echo "- 资产：\`$ASSET\`"
            echo "- sha256（API digest 已对账）：\`$LOCAL_SHA\`"
            echo ""
            echo "CoreKit/Package.swift binaryTarget 切换行（确认后提交；旧钉版资产原地保留可直接回退）："
            echo '```swift'
            echo ".binaryTarget(name: \"LlamaFramework\","
            echo "    url: \"$URL\","
            echo "    checksum: \"$LOCAL_SHA\")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "checksum=${LOCAL_SHA}"
          echo "::notice::llama xcframework asset=$ASSET checksum=$LOCAL_SHA"