# ============================================================================
# L0 静态门禁 · 可复用工作流（2026-10-07 委员会：单源定义，消 gates/l0 两份
# 29 行仅差 5 行的副本——CI 2026-10-07 已实证双维护漂移：schema 步两处同改）。
#
# 调用纪律（平台/SRE 两席定稿）：
#   - 调用方 job 必须显式 `permissions: contents: read`（未声明时被调方按默认
#     权限解析——F5 权限陷阱）；
#   - 本文件内禁声明 concurrency（并发由调用方 run 决定）；
#   - 调用方保留各自 job 名与 needs 图（upload 的 needs 不动）；
#   - 改动本文件 = 发布面变更（与 build-testflight.yml 同级评审）；本文件承载
#     「仓库无分支保护下唯一机械冻结」的执行体，先以暂存分支
#     `workflow_dispatch --ref` 做负向实验（L0 违例 ⇒ gates 红 ⇒ upload 跳过）
#     再进 master。
# ============================================================================
name: L0 static gate

on:
  workflow_call:
    inputs:
      artifact-name:
        description: 失败时诊断日志 artifact 名（各链保持自身命名）
        required: true
        type: string

jobs:
  l0:
    name: 'L0 静态门禁'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # v7.0.1；固定完整 SHA（node24 运行时）。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # 工具链断言（跨载体平权红线）：ubuntu 无 swiftc 时 L0 第 7 节只 warn
      # 跳过 = 静默降级（test-plan 守则 13 禁止）——显式 fail-fast。
      - name: 断言 Swift 工具链存在
        run: |
          command -v swiftc >/dev/null || { echo "::error::ubuntu runner 缺 swiftc——L0 第 7 节将静默降级,已阻断"; exit 1; }
          swiftc --version | head -2

      # PyYAML 显式钉版（2026-10-07）：L0 [19] 工作流结构节与左移的发布契约测试
      # （test-cnb-release-workflow / test-release-version / test-model-trust）均
      # import yaml——ubuntu 镜像的隐式预装不构成契约，禁走隐式（供应链纪律：
      # 与 requirements-*.txt 的钉版同精神，单件 CI 工具不设独立清单）。
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: 安装 PyYAML（单件工具，版本钉版）
        run: |
          python3 -m pip install --quiet "pyyaml==6.0.2"
          python3 -c "import yaml; print('pyyaml', yaml.__version__)"

      - name: L0 静态门禁
        run: |
          set -o pipefail
          bash scripts/gates/l0-static-gate.sh 2>&1 | tee /tmp/l0-gate.log
          python3 scripts/gates/test-schema-integrity.py 2>&1 | tee -a /tmp/l0-gate.log

      # 发布契约测试左移（2026-10-07 委员会：原仅在 release-asr-models.yml 的
      # dispatch 链路执行——引用面断裂/断言失配要等下次 ASR 发布才暴露，天级延迟。
      # 12 脚本全部纯离线、Linux 本地实测 rc=0 全绿；release 链保留原步为发布前复检。
      - name: 发布契约测试（离线矩阵）
        run: |
          set -o pipefail
          for t in test-release-version test-next-catalog-version test-asr-assets \
                   test-asr-secrets-init test-asr-package-integrity test-model-trust \
                   test-asr-release test-asr-release-page test-medical-package-fixture \
                   test-cnb-release test-cnb-release-workflow test-seed-cnb-model-assets; do
            echo "── $t"
            python3 "scripts/release/$t.py"
          done 2>&1 | tee -a /tmp/l0-gate.log

      - name: 上传 L0 诊断日志（失败时）
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: /tmp/l0-gate.log
          retention-days: 7
          if-no-files-found: ignore
