# apple-app-bootstrap CI — Signing path A (Xcode Cloud Signing)
# No certificate secrets: ASC API Key authenticates xcodebuild, Xcode creates
# and renews the cert/profile automatically (Automatically manage signing).
# §16.3 / §19.5 / §23.4.
name: apple-app-bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-sign-upload:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Decode API key
        run: |
          mkdir -p private_keys
          echo "$APPLE_API_KEY_P8" | base64 -d > private_keys/AuthKey_$APPLE_API_KEY_ID.p8
          chmod 600 private_keys/AuthKey_$APPLE_API_KEY_ID.p8
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      - name: Build & sign
        run: |
          xcodebuild archive \
            -scheme "$SCHEME" \
            -configuration release \
            -archivePath build.xcarchive \
            -authenticationKeyPath private_keys/AuthKey_$APPLE_API_KEY_ID.p8 \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_KEY_ISSUER_ID" \
            -allowProvisioningUpdates
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          SCHEME: ${{ vars.SCHEME }}
      - name: Upload (Transporter / fastlane deliver)
        run: |
          # Export compliance is declared via ITSAppUsesNonExemptEncryption in
          # the Release Info.plist (preferred, §23.2(a)); PATCH is the fallback.
          fastlane deliver --upload_without_waiting_for_review --skip_submission
        env:
          FASTLANE_USER: ${{ secrets.FASTLANE_USER }}
