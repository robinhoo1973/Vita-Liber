# ============================================================================
# macOS 远程调试 CI（ngrok 隧道）
#
# 用途：在 GitHub 托管 macOS runner 上：
#   1) xcodegen 生成工程 + xcodebuild 编译（build-for-testing）；
#   2) 启动 iOS 模拟器并安装/启动 App（GUI 调试现场）；
#   3) 启用 Remote Login(SSH:22) + Screen Sharing(VNC:5900)；
#   4) 用 ngrok 开两条 TCP 隧道，让你从本机远程接入调试。
#
# 触发：手动 workflow_dispatch（Actions → 本工作流 → Run workflow）
#
# 前置凭据（仓库 Settings → Secrets and variables → Actions → New repository secret）：
#   NGROK_AUTHTOKEN   必填：ngrok 账户 authtoken（dashboard.ngrok.com 免费注册 → Your Authtoken）
#   DEBUG_SSH_PUBKEY  选填：你的 SSH 公钥；不填则自动生成随机密码并打印在 Job summary
#   SERVERCHAN_SENDKEY  选填：Server酱（微信推送）SendKey（sct.ftqq.com 微信扫码登录 → SendKey 形如 SCT...）；
#                     环境就绪时推「仅提示」（连接口令留在 Job summary，第三方推送不可见）
#
# 接入信息：跑起来后打开本 run 的「Job summary」即可看到 ngrok 地址与口令。
#
# 已知约束（诚实说明，勿跳坑）：
#   - 托管 macOS runner 是临时虚拟化实例：SSH 稳定可用；VNC + 模拟器 GUI 为**尽力而为**，
#     若 GitHub 该 runner 无控制台会话则 VNC 可能连不上——需要稳定 macOS GUI 调试请用自托管 Mac。
#   - macOS 无原生 RDP；本方案 GUI = VNC（macOS 屏幕共享）。
#   - ngrok 免费版：1 个在线 agent（本文件 2 条隧道共用 1 个 agent，合规）。
#   - 会话期间持续消耗 GitHub Actions minutes；调试完请在 Actions 页 Cancel run。
#   - 安全：隧道仅在 run 存活期间有效，凭据只写进 Job summary（不回显日志）。
# ============================================================================
name: macOS 远程调试（ngrok）

on:
  workflow_dispatch:
    inputs:
      debug_minutes:
        description: 调试会话保持分钟数（建议 ≤55）
        type: number
        default: 45
      do_build:
        description: 编译项目（build-for-testing）
        type: boolean
        default: true
      launch_simulator:
        description: 启动模拟器并安装/启动 App
        type: boolean
        default: true

concurrency:
  group: remote-debug
  cancel-in-progress: true

permissions:
  contents: read

env:
  SCHEME: VitaLiber
  NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
  DEBUG_SSH_PUBKEY: ${{ secrets.DEBUG_SSH_PUBKEY }}
  SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}

jobs:
  remote-debug:
    name: 编译 + 模拟器 + SSH/VNC 隧道
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          sw_vers
          uname -m

      - name: 校验 ngrok 凭据已配置
        run: |
          if [ -z "$NGROK_AUTHTOKEN" ]; then
            echo "::error::缺少 secret NGROK_AUTHTOKEN —— 仓库 Settings→Secrets→Actions 添加后重跑"
            exit 1
          fi
          echo "NGROK_AUTHTOKEN 已配置 ✓"

      - name: 生成 Xcode 工程
        run: |
          if [ -d VitaLiber.xcodeproj ]; then
            echo "已有 VitaLiber.xcodeproj"
          elif [ -f project.yml ]; then
            echo "用 xcodegen 从 project.yml 生成"
            brew install xcodegen >/dev/null 2>&1 && xcodegen generate
          else
            echo "::error::缺 project.yml 且无 xcodeproj"
            exit 1
          fi

      - name: 解析可用模拟器
        id: sim
        run: |
          python3 - <<'PY'
          import json, subprocess
          d = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "--json", "devices", "available"]))
          pairs = [(rt, v["name"], v["udid"]) for rt, devs in d["devices"].items()
                   for v in devs if v.get("isAvailable") and v["name"].startswith("iPhone")]
          spec = [p for p in pairs if p[1] == "iPhone 15"]
          pick = spec[0] if spec else sorted(pairs)[0]
          print(f"MODEL={pick[1]}")
          print(f"RUNTIME={pick[0]}")
          print(f"UDID={pick[2]}")
          PY
          echo "选型: ${{ steps.sim.outputs.MODEL }}"

      - name: 编译项目（build-for-testing）
        if: ${{ inputs.do_build }}
        run: |
          set -o pipefail
          mkdir -p Build
          xcodebuild build-for-testing \
            -project VitaLiber.xcodeproj -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.MODEL }}" \
            -derivedDataPath Build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-build.log
          echo "编译产物:"
          find Build/DerivedData/Build/Products -maxdepth 2 -name '*.app' 2>/dev/null

      - name: 启动模拟器并安装/启动 App
        if: ${{ inputs.launch_simulator }}
        run: |
          UDID="${{ steps.sim.outputs.UDID }}"
          APP=$(find Build/DerivedData/Build/Products -maxdepth 2 -name '*.app' -path '*iphonesimulator*' 2>/dev/null | head -1)
          xcrun simctl bootstatus "$UDID" -b || true
          open -a Simulator || true      # 尽力而为：拉起 GUI（VNC 可见前提）
          if [ -n "$APP" ]; then
            xcrun simctl install "$UDID" "$APP" || echo "install 失败（看 APP 路径）"
            xcrun simctl launch "$UDID" com.vitaliber.app || echo "launch 失败（App 可能需首次引导）"
          else
            echo "未找到 .app（do_build=false 或编译失败）——仅提供系统模拟器"
          fi

      - name: 启用 Remote Login（SSH）
        run: |
          sudo systemsetup -setremotelogin on >/dev/null 2>&1 || \
            sudo launchctl enable system/com.openssh.sshd || true
          # 优先公钥；否则生成随机密码（写 summary，不回显日志）
          if [ -n "$DEBUG_SSH_PUBKEY" ]; then
            mkdir -p "$HOME/.ssh"
            echo "$DEBUG_SSH_PUBKEY" >> "$HOME/.ssh/authorized_keys"
            chmod 700 "$HOME/.ssh"; chmod 600 "$HOME/.ssh/authorized_keys"
            echo "SSH_AUTH=key" >> "$GITHUB_ENV"
          else
            PW=$(openssl rand -base64 12 | tr -d '/+=' | cut -c1-14)
            sudo dscl . -passwd /Users/runner "$PW" || true
            echo "SSH_AUTH=password" >> "$GITHUB_ENV"
            echo "SSH_PASSWORD=$PW" >> "$GITHUB_ENV"
          fi
          echo "Remote Login 已启用 ✓"

      - name: 启用 Screen Sharing（VNC，尽力而为）
        run: |
          sudo launchctl enable system/com.apple.screensharing || true
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          echo "Screen Sharing 已尝试启用（尽力而为）"

      - name: 启动隧道并保持会话（连接信息见 Job summary；Cancel 结束）
        run: |
          set -uo pipefail
          # 1) 安装并启动 ngrok（本步骤内常驻——GitHub 会在步骤结束时清理后台进程，故不可拆分）
          command -v ngrok >/dev/null 2>&1 || brew install ngrok >/dev/null 2>&1
          ngrok config add-authtoken "$NGROK_AUTHTOKEN" >/dev/null 2>&1
          cat > ngrok.yml <<'EOF'
          version: "2"
          tunnels:
            ssh:
              proto: tcp
              addr: 22
            vnc:
              proto: tcp
              addr: 5900
          EOF
          nohup ngrok start --config ngrok.yml --log stdout > ngrok.log 2>&1 &
          NGROK_PID=$!
          # 2) 等待 ngrok API 就绪（最多 20s），解析两条隧道端点
          EP=""
          for _ in $(seq 1 10); do
            sleep 2
            EP=$(curl -s http://127.0.0.1:4040/api/tunnels || true)
            [ -n "$EP" ] && break
          done
          if [ -z "$EP" ]; then
            echo "::error::ngrok 未就绪——见 ngrok.log"
            tail -20 ngrok.log
            exit 1
          fi
          SSH_HOST=$(printf '%s' "$EP" | python3 -c 'import sys,json
          d=json.load(sys.stdin)
          for t in d.get("tunnels",[]):
              if t.get("name")=="ssh":
                  u=t["public_url"]; print(u.replace("tcp://",""))')
          VNC_URL=$(printf '%s' "$EP" | python3 -c 'import sys,json
          d=json.load(sys.stdin)
          for t in d.get("tunnels",[]):
              if t.get("name")=="vnc": print(t["public_url"])')
          {
            echo "## 🔌 远程调试连接信息（run 存活期间有效）"
            echo ""
            echo "### SSH"
            echo "- 地址: \`$SSH_HOST\`  （示例: \`ssh -p ${SSH_HOST##*:} runner@${SSH_HOST%%:*}\`）"
            echo "- 用户名: \`runner\`"
            if [ "$SSH_AUTH" = "key" ]; then
              echo "- 认证: SSH 公钥（secret DEBUG_SSH_PUBKEY）"
            else
              echo "- 密码: \`$SSH_PASSWORD\`"
            fi
            echo ""
            echo "### VNC（macOS 屏幕共享 · 尽力而为）"
            echo "- 地址: \`$VNC_URL\`（或 \`vnc://${VNC_URL#tcp://}\`）"
            echo "- 凭据: 用户 \`runner\` + 上面 SSH 密码"
            echo ""
            echo "### 说明"
            echo "- 连接后即进入该 macOS：代码在 \`~/work/<repo>/<repo>\`，构建产物在 \`Build/\`。"
            echo "- 模拟器已启动且 App 已装（com.vitaliber.app），可点开调试。"
            echo "- 结束：Actions 页 Cancel run（隧道随之关闭）。"
          } >> "$GITHUB_STEP_SUMMARY"
          # 3) Server酱（微信）就绪通知（仅提示；口令留在 Job summary，第三方推送不可见）
          if [ -n "$SERVERCHAN_SENDKEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/$SERVERCHAN_SENDKEY.send" \
              --data-urlencode "title=Vita Liber CI 远程调试就绪" \
              --data-urlencode "desp=环境可接入（最长 ${{ inputs.debug_minutes }} 分钟）。打开本 Actions run 的 Job summary 查看 ssh 地址与口令。" \
              >/dev/null && echo "Server酱 已推送 ✓" || echo "⚠ Server酱 推送失败（调试会话不受影响）"
          else
            echo "未配置 SERVERCHAN_SENDKEY——跳过就绪推送（连接信息仍在 Job summary）"
          fi
          # 4) 保持会话存活（约每 10s 一跳；Cancel run 即中断并整体收尾）
          MINS=${{ inputs.debug_minutes }}
          echo "隧道已就绪——等待你接入（最长 ${MINS} 分钟）。"
          for _ in $(seq 1 $((MINS * 6))); do
            sleep 10
          done
          # 5) 自然到期收尾：停 ngrok
          kill "$NGROK_PID" 2>/dev/null || pkill -f "ngrok start" 2>/dev/null || true
          echo "会话到期，ngrok 已停止"
