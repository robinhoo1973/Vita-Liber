# ============================================================================
# 临时校准对拍工作流（**临时件**；业主 2026-10-08 授权创建）
#
# 用途：S2 红队 R2「一次性观测定去留」——ubuntu CPU × macOS MPS 并行 100 步
# 标定，不打断、全量留证（此前 5 次 macOS 标定全部以人工取消结束、0 次自然
# 完成；本工作流给足 ≥100min 观测窗并在中断时由 calibrate.py 落部分数据）。
#
# 触发：push 本文件自身（paths 过滤）——临时件只存在于特性分支，dispatch 需
# 默认分支注册，故用本文件变更作为一次性扳机。workflow_dispatch 同留（若日后
# 其进入默认分支可直接手动触发）。
#
# 纪律：
# - 独立并发组（不进 distill-llm 组）——不堵主管线、不被其 cancel-in-progress 牵连；
# - 双腿并行（两个 job 自然并行），各自 timeout：ubuntu 60 / macOS 110；
# - 结论落盘（artifact）后本文件即删（维护批；勿长期留存）。
# ============================================================================
name: calibrate-probe
on:
  push:
    paths:
      - ".github/workflows/calibrate-probe.yml"
  workflow_dispatch:

concurrency:
  group: calibrate-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  calibrate-ubuntu-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 线钉版（2026-10-07）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5 线钉版（2026-10-07）
        with:
          python-version: "3.13"
      - name: Runner info(留证)
        run: |
          uname -m; nproc; free -h | head -2; python3 --version
      - name: Install deps(哈希钉版)
        run: |
          pip install --require-hashes \
            -r .github/config/requirements/requirements-distill-train-linux.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Calibrate(100 步真实训练步;CPU 基准)
        run: python3 .github/actions/distill/calibrate.py --device cpu --steps 100 --out calibrate.json
      - name: Calibrate verdict(汇总裁决)
        if: always()
        run: |
          if [ ! -f calibrate.json ]; then
            echo "::warning::calibrate.json 缺失(极端情况)——无数据"
          elif grep -q '"error"' calibrate.json; then
            echo "::error::标定失败: $(python3 -c "import json;print(json.load(open('calibrate.json'))['error'])")"
          else
            python3 -c "import json;print(json.dumps(json.load(open('calibrate.json')), ensure_ascii=False))"
          fi
      - name: Upload calibrate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4 线钉版（2026-10-07）
        with:
          name: probe-calibrate-ubuntu-cpu
          path: calibrate.json
          if-no-files-found: warn
          retention-days: 14

  calibrate-macos-mps:
    runs-on: macos-15
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4 线钉版（2026-10-07）
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5 线钉版（2026-10-07）
        with:
          python-version: "3.13"
      - name: Runner info(留证)
        run: |
          sw_vers; uname -m; sysctl -n hw.memsize; python3 --version
      - name: Install deps(哈希钉版)
        run: |
          pip install --require-hashes \
            -r .github/config/requirements/requirements-distill-train-macos.txt
      - name: MPS probe(留证;不信任 is_available)
        # 崩溃也是数据(信号式 #9918 崩溃 try/except 抓不到,#11477 同理)
        run: python3 .github/actions/distill/probe_mps.py --json mps-probe.json || true
      - name: Calibrate(100 步真实训练步;MPS 直测)
        run: python3 .github/actions/distill/calibrate.py --device mps --steps 100 --out calibrate.json
      - name: Calibrate verdict(汇总裁决)
        if: always()
        run: |
          if [ ! -f calibrate.json ]; then
            echo "::warning::calibrate.json 缺失(硬杀/段错误)——本次观测无步数数据"
          elif grep -q '"error"' calibrate.json; then
            echo "::error::标定失败: $(python3 -c "import json;print(json.load(open('calibrate.json'))['error'])")"
          else
            python3 -c "import json;print(json.dumps(json.load(open('calibrate.json')), ensure_ascii=False))"
          fi
      - name: Upload calibrate result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4 线钉版（2026-10-07）
        with:
          name: probe-calibrate-macos-mps
          path: |
            calibrate.json
            mps-probe.json
          if-no-files-found: warn
          retention-days: 14
