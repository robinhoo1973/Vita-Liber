# ============================================================================
# Vita Liber · 青囊书 — iOS 测试流水线
# 依据：test-plan-spec §2 拓扑 / §5 脚本细节；dev-pm-spec §9.1–§9.4
#
#   l0-static-gate       L0 静态门禁（同目录 l0-static-gate.sh，ubuntu；L0 不过不进 L1）
#   l1-build-for-testing 唯一编译点：build-for-testing → 上传 Products + *.xctestrun
#                        （业界 build-once-test-many：下游分片一律 test-without-building）
#   l1-unit-shards       单元/集成分片（matrix ×2，并行 worker 2）
#   l1-ui-suite          XCUITest 关键路径（隔离克隆模拟器 + 权限预授权）
#   l1-golden            金样套件（迁移/OCR/AI/预警 Fixtures，随阶段扩充）
#   l1-perf-screen       XCTMetric 性能初筛（仅 main；模拟器口径 = 真机预算 ×1.5）
#   l1-summary           xcresulttool merge → step summary + evidence artifact
#   tag-archive          v* tag：未签名 .xcarchive（不变）
#
# 目标名约定（M0 建立测试目标后即生效）：
#   VitaLiberTests（Swift Testing/XCTest 单元+集成+金样 GoldenTests 子套件）
#   VitaLiberUITests（XCUITest）；分片清单按实测耗时再平衡（test-plan-spec E1/成本护栏）
# 前置约定：VitaLiber.xcodeproj 不入库 → 有 project.yml 则 xcodegen 生成，否则明确报错。
# 本机无 Xcode 时只跑 L0；xcodebuild 各步仅在 macos-15 runner 上执行。
# ============================================================================
name: 'Vita Liber iOS · 门禁→编译测试→归档'

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  SCHEME: VitaLiber
  XCODEPROJ: VitaLiber.xcodeproj
  DERIVED_DATA: Build/DerivedData
  PRODUCTS_DIR: Build/Products
  # test-plan-spec §5.1 统一 destination；缺失时回退可用 iPhone（resolve-destination 步骤）
  SPEC_SIMULATOR: 'iPhone 15'

jobs:
  # ---------------------------------------------------------------------------
  # L0 静态门禁 —— 任意机器可跑（dev-pm-spec §9.4），失败即整条流水线红
  # ---------------------------------------------------------------------------
  l0-static-gate:
    name: 'L0 · 静态门禁'
    runs-on: ubuntu-latest
    # 官方 Swift 容器：门禁 [7/7] 需要 swiftc -parse（ubuntu-latest 裸机无 Swift 工具链，
    # 会静默降级为 WARN，使「L0 不过不进 L1」的卡斩链对语法错失效）。ERR#28。
    container: swift:6.0-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run l0-static-gate.sh
        run: bash .github/workflows/l0-static-gate.sh

  # ---------------------------------------------------------------------------
  # L1 唯一编译点 —— 编译一次，产物供全部分片复用（test-plan-spec E1）
  # ---------------------------------------------------------------------------
  l1-build-for-testing:
    name: 'L1 · 编译 (build-for-testing)'
    needs: l0-static-gate
    outputs:
      sim_model: ${{ steps.resolve.outputs.sim_model }}
      sim_runtime: ${{ steps.resolve.outputs.sim_runtime }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUILD_LOG: Build/xcodebuild-build.log
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -5

      - name: Ensure Xcode project
        run: |
          if [ -e "$XCODEPROJ" ]; then
            echo "使用已提交的 $XCODEPROJ"
          elif [ -f project.yml ]; then
            echo "未提交 .xcodeproj → 用 xcodegen 从 project.yml 生成"
            brew install xcodegen && xcodegen generate
          else
            echo "::error::$XCODEPROJ 缺失且无 project.yml——请提交 project.yml 或按 PROJECT_SETUP.md 处理"
            exit 1
          fi

      - name: Resolve destination
        id: resolve
        run: |
          # E2：JSON 结构化解析（ERR#11——禁正则啃人读输出）
          python3 - <<'PYEOF' >> "$GITHUB_ENV"
          import json, subprocess, sys, os
          d = json.loads(subprocess.check_output(["xcrun","simctl","list","--json","devices","available"]))
          pairs = [(rt, v["name"], v["udid"]) for rt, devs in d["devices"].items()
                   for v in devs if v.get("isAvailable") and v["name"].startswith("iPhone")]
          if not pairs: sys.exit("no iPhone simulator available")
          spec = [p for p in pairs if p[1] == "$SPEC_SIMULATOR"]
          stable = [q for q in pairs if "-18-" in q[0]]
          pick = spec[0] if spec else (stable[0] if stable else sorted(pairs)[0])
          print(f"DESTINATION=id={pick[2]}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as o:
              o.write(f"sim_model={pick[1]}\nsim_runtime={pick[0]}\n")
          print(f"SIM_MODEL={pick[1]}")
          print(f"SIM_RUNTIME={pick[0]}")
          PYEOF
          echo "selected: $SIM_MODEL @ $SIM_RUNTIME"

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: Build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved', '**/project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build for testing
        run: |
          set -o pipefail
          mkdir -p Build
          xcodebuild build-for-testing \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$BUILD_LOG"

      # 产物 + xctestrun 清单一起传递：test-without-building 只认它（E1）
      - uses: actions/upload-artifact@v4
        with:
          name: generated-project-${{ github.run_id }}
          path: VitaLiber.xcodeproj
      - uses: actions/upload-artifact@v4
        with:
          name: test-products-${{ github.run_id }}
          path: |
            Build/DerivedData/Build/Products
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 分片模板锚点 —— 以下 job 共用置备步骤（test-plan-spec §5.4）
  # ---------------------------------------------------------------------------
  l1-unit-shards:
    env:
      SIM_MODEL: ${{ needs.l1-build-for-testing.outputs.sim_model }}
      SIM_RUNTIME: ${{ needs.l1-build-for-testing.outputs.sim_runtime }}
    name: 'L1 · 单元/集成 分片 ${{ matrix.shard-name }}'
    needs: l1-build-for-testing
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard-name: A   # Domain/Infrastructure/Pipeline 规则与状态机
            shard: '-only-testing:VitaLiberTests'
          - shard-name: B   # 预留第二分片：套件超时后按耗时拆分（成本护栏）
            shard: '-skip-testing:VitaLiberUITests'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 'test-products-${{ github.run_id }}'
          path: Build/DerivedData/Build/Products
      - uses: actions/download-artifact@v4
        with:
          name: 'generated-project-${{ github.run_id }}'
          path: _proj
      - name: Restore generated project
        run: rm -rf VitaLiber.xcodeproj && mv _proj VitaLiber.xcodeproj

      - name: Boot simulator (bootstatus 就绪等待, E2)
        run: |
          UDID=$(xcrun simctl create "ci-$GITHUB_RUN_ID-${{ matrix.shard-name }}" "$SIM_MODEL" "$SIM_RUNTIME" 2>/dev/null || \
                 xcrun simctl create "ci-$GITHUB_RUN_ID-${{ matrix.shard-name }}" "$SIM_MODEL" "$SIM_RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          echo "DESTINATION=id=$UDID" >> "$GITHUB_ENV"
      - name: Run shard (test-without-building)
        run: |
          set -euo pipefail; set -x
          echo "=== products inventory ==="; find Build/DerivedData/Build/Products -maxdepth 2 | head -20
          ls -la Build/DerivedData/Build/Products/*.xctestrun 2>/dev/null || echo "NO_XCTESTRUN"
          rm -rf Build/shard.xcresult
          xcodebuild test-without-building \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath Build/shard.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            ${{ matrix.shard }} 2>&1 | tee Build/xcodebuild-shard.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shard-result-${{ matrix.shard-name }}-${{ github.run_id }}
          path: |
            Build/shard.xcresult
            Build/xcodebuild-shard.log
          retention-days: 7
      - name: Cleanup simulator (always, E2/E3)
        if: always()
        run: |
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true

  l1-ui-suite:
    env:
      SIM_MODEL: ${{ needs.l1-build-for-testing.outputs.sim_model }}
      SIM_RUNTIME: ${{ needs.l1-build-for-testing.outputs.sim_runtime }}
    name: 'L1 · UI 关键路径 (XCUITest)'
    needs: l1-build-for-testing
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 'test-products-${{ github.run_id }}'
          path: Build/DerivedData/Build/Products
      - uses: actions/download-artifact@v4
        with:
          name: 'generated-project-${{ github.run_id }}'
          path: _proj
      - name: Restore generated project
        run: rm -rf VitaLiber.xcodeproj && mv _proj VitaLiber.xcodeproj

      # 隔离克隆模拟器 + 权限预授权（E3/E4；Keychain 类用例由 erase 保证干净态）
      - name: Provision isolated simulator
        run: |
          UDID=$(xcrun simctl create "ci-ui-$GITHUB_RUN_ID" "$SIM_MODEL" "$SIM_RUNTIME" 2>/dev/null || \
                 xcrun simctl create "ci-ui-$GITHUB_RUN_ID" "$SIM_MODEL" "$SIM_RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" || true
          xcrun simctl privacy "$UDID" grant camera com.vitaliber.app || true
          xcrun simctl privacy "$UDID" grant photos com.vitaliber.app || true
          echo "DESTINATION=id=$UDID" >> "$GITHUB_ENV"

      - name: Run UI suite
        run: |
          set -o pipefail
          rm -rf Build/ui.xcresult
          xcodebuild test-without-building \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -only-testing:VitaLiberUITests \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath Build/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-ui.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-result-${{ github.run_id }}
          path: |
            Build/ui.xcresult
            Build/xcodebuild-ui.log
          retention-days: 7
      - name: Cleanup simulator
        if: always()
        run: |
          xcrun simctl shutdown "$UDID" || true
          xcrun simctl delete "$UDID" || true

  l1-golden:
    env:
      SIM_MODEL: ${{ needs.l1-build-for-testing.outputs.sim_model }}
      SIM_RUNTIME: ${{ needs.l1-build-for-testing.outputs.sim_runtime }}
    name: 'L1 · 金样回归 (Fixtures)'
    needs: l1-build-for-testing
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 'test-products-${{ github.run_id }}'
          path: Build/DerivedData/Build/Products
      - uses: actions/download-artifact@v4
        with:
          name: 'generated-project-${{ github.run_id }}'
          path: _proj
      - name: Restore generated project
        run: rm -rf VitaLiber.xcodeproj && mv _proj VitaLiber.xcodeproj
      - name: Run golden suites
        run: |
          set -o pipefail
          UDID=$(xcrun simctl create "ci-golden-$GITHUB_RUN_ID" "$SIM_MODEL" "$SIM_RUNTIME")
          xcrun simctl bootstatus "$UDID" -b
          rm -rf Build/golden.xcresult
          # 评审 S1-3：只指向真实存在的测试类——GoldenMigrationTests 在 CoreKit SPM
          # 测试目标（Linux 容器已跑），iOS 侧金样半场 = SchemaRuntimeTests（GRDB 运行时断言）。
          # 禁止为「未来套件」预写类名：空选择/不存在类会让 xcodebuild 0 用例判绿。
          xcodebuild test-without-building \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -only-testing:VitaLiberTests/SchemaRuntimeTests \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath Build/golden.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-golden.log
          # 缺证据 ≠ 有证据（ERR#27/30 同族）：0 用例 = 假绿，直接红
          if ! grep -qE 'Test Suite .*(started|passed)|Test Case .*(passed|failed)' Build/xcodebuild-golden.log; then
            echo "::error::金样套件 0 用例执行——目标类不存在或选择为空，门禁判红"; exit 1
          fi
          xcrun simctl shutdown "$UDID" || true; xcrun simctl delete "$UDID" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 'golden-result-${{ github.run_id }}'
          path: 'Build/golden.xcresult'
          retention-days: 7

  # 仅 main 与手动触发：性能初筛入趋势，PR 不跑（成本护栏 §1.3）
  l1-perf-screen:
    env:
      SIM_MODEL: ${{ needs.l1-build-for-testing.outputs.sim_model }}
      SIM_RUNTIME: ${{ needs.l1-build-for-testing.outputs.sim_runtime }}
    name: 'L1d · 性能初筛 (XCTMetric)'
    # 默认分支名动态取值：本仓默认分支是 master，写死 'main' 会让本 job 永不触发，
    # 而 skipped 在 UI 上是灰色不是红色 —— SU-M0-PERF 因此从未执行过（ERR#30）。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    needs: l1-build-for-testing
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: 'test-products-${{ github.run_id }}'
          path: Build/DerivedData/Build/Products
      - uses: actions/download-artifact@v4
        with:
          name: 'generated-project-${{ github.run_id }}'
          path: _proj
      - name: Restore generated project
        run: rm -rf VitaLiber.xcodeproj && mv _proj VitaLiber.xcodeproj
      - name: Run perf screening
        run: |
          set -o pipefail
          UDID=$(xcrun simctl create "ci-perf-$GITHUB_RUN_ID" "$SIM_MODEL" "$SIM_RUNTIME")
          xcrun simctl bootstatus "$UDID" -b
          rm -rf Build/perf.xcresult
          xcodebuild test-without-building \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -only-testing:VitaLiberUITests/PerformanceScreeningTests \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath Build/perf.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-perf.log
          # 性能指标导出 CSV：xcresulttool export metrics（Xcode 16+）
          mkdir -p Build/metrics
          xcrun xcresulttool export metrics --path Build/perf.xcresult --output-path Build/metrics || true
          xcrun simctl shutdown "$UDID" || true; xcrun simctl delete "$UDID" || true
      # TC-M0-08：冷启基线 ≤2s（iPhone 12 真机口径）×1.5 = 3s 模拟器初筛口径。
      # 超线标黄不阻塞（评审：M0 只要求基线记录+阈值检查存在；连续 3 次超标转红的
      # 趋势逻辑随 M1c 趋势库落地）。缺指标文件按「缺证据≠有证据」判红。
      - name: 冷启预算检查（TC-M0-08，≤3s 模拟器口径）
        if: always()
        run: |
          set -u
          BUDGET_MS=3000
          files=$(find Build/metrics -name '*.csv' -type f 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "::error::性能指标 CSV 缺失——perf 套件未产出可判证据，本项判红"; exit 1
          fi
          worst=0
          while IFS= read -r v; do
            [ -n "$v" ] || continue
            case "$v" in ''|*[!0-9.]*) continue ;; esac
            iv=$(printf '%.0f' "$v")
            [ "$iv" -gt "$worst" ] && worst=$iv
          done < <(grep -hoE '[0-9]+(\.[0-9]+)?' $files 2>/dev/null || true)
          echo "perf_worst_ms=$worst budget_ms=$BUDGET_MS"
          if [ "$worst" -gt "$BUDGET_MS" ]; then
            echo "::warning::冷启初筛 ${worst}ms 超模拟器口径 ${BUDGET_MS}ms（真机预算 2s×1.5），标黄不阻塞；连续超标将转红"
          else
            echo "冷启初筛 ${worst}ms ≤ ${BUDGET_MS}ms，基线达标"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-metrics-${{ github.run_id }}
          path: |
            Build/metrics/**
            Build/xcodebuild-perf.log
          retention-days: 30

  # E10 双运行时矩阵的前瞻档：镜像未含 iOS 26 runtime 时标黄不阻塞（失败连续红转正式缺陷）
  l1-next-runtime:
    env:
      SIM_MODEL: ${{ needs.l1-build-for-testing.outputs.sim_model }}
      SIM_RUNTIME: ${{ needs.l1-build-for-testing.outputs.sim_runtime }}
    name: 'L1 · 前瞻 runtime 预览 (iOS 26)'
    # 评审 S2-2：禁止硬编码分支名（ERR#30 同族）——master 上写死 main 会让
    # E10 前瞻档永不触发
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
    needs: l1-build-for-testing
    continue-on-error: true
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: test-products-${{ github.run_id }}
          path: Build/DerivedData/Build/Products
      - uses: actions/download-artifact@v4
        with:
          name: 'generated-project-${{ github.run_id }}'
          path: _proj
      - name: Restore generated project
        run: rm -rf VitaLiber.xcodeproj && mv _proj VitaLiber.xcodeproj
      - name: Run UI smoke on next runtime
        run: |
          set -o pipefail
          # E10 前瞻档：镜像未含 iOS 26 runtime 时显式跳过并留 notice——
          # 「未测试」必须可见且不冒充通过（ERR#27 空集判过同族），也不该以
          # Invalid runtime 报错形式把「环境不具备」伪装成「测试失败」。
          # 注意取「人类可读 runtime 名」（list runtimes 的 "iOS 26.x"），
          # 不能取 -j JSON 的 identifier（iOS-26-0 会被 simctl create 拒绝）。
          NEXT_RUNTIME=$(xcrun simctl list runtimes 2>/dev/null | grep -oE 'iOS 26\.[0-9]+' | head -1 || true)
          if [ -z "$NEXT_RUNTIME" ]; then
            echo "::notice::此镜像无 iOS 26 runtime——前瞻档本轮跳过（E10 允许，非测试失败）"; exit 0
          fi
          UDID=$(xcrun simctl create "ci-next-$GITHUB_RUN_ID" "iPhone 17" "$NEXT_RUNTIME")
          xcrun simctl bootstatus "$UDID" -b
          rm -rf Build/next.xcresult
          xcodebuild test-without-building \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -destination "id=$UDID" \
            -only-testing:VitaLiberUITests \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath Build/next.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-next.log
          xcrun simctl shutdown "$UDID" || true; xcrun simctl delete "$UDID" || true

  # ---------------------------------------------------------------------------
  # 汇总：合并 xcresult → step summary → 证据 artifact（§5.6）
  # ---------------------------------------------------------------------------
  l1-summary:
    name: 'L1 · 汇总与证据包'
    needs: [l1-unit-shards, l1-ui-suite, l1-golden, l1-perf-screen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        run: |
          echo "## Test summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- 各分片结果见 artifacts；失败附件（截图）已随 xcresult 上传。" >> "$GITHUB_STEP_SUMMARY"
          echo "- 门禁语义：本流水线红 = 阶段不可进入下一开发（test-plan-spec §3）。" >> "$GITHUB_STEP_SUMMARY"
      # test-plan-spec §3 的「必过套件全绿」在此落成可执行断言。
      # 动机（ERR#30）：skipped 与 success 在 UI 上都不是红色，门禁套件「缺席」会被
      # 误读为「通过」——与 ERR#27「空集判过」同一根因族：缺证据 ≠ 有证据。
      - name: 门禁套件必须真实执行（test-plan-spec §3）
        run: |
          set -u
          IS_GATE_PATH='${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}'
          fail=0
          note() { printf '%s\n' "$1" >> "$GITHUB_STEP_SUMMARY"; }
          note ''
          note '### 门禁套件执行核验（test-plan-spec §3）'
          check() {   # $1=套件名 $2=job result $3=是否允许 skipped
            case "$2" in
              success) note "- ✅ $1：success" ;;
              skipped)
                if [ "$3" = "allow-skip" ]; then
                  note "- ⏭️ $1：skipped（非门禁路径，按成本护栏 §1.3 允许）"
                else
                  note "- ❌ $1：**skipped —— 门禁套件缺席不等于通过**"
                  echo "::error::$1 未执行（skipped）；门禁路径要求其必须真实运行"; fail=1
                fi ;;
              *) note "- ❌ $1：$2"; echo "::error::$1 结果为 $2"; fail=1 ;;
            esac
          }
          if [ "$IS_GATE_PATH" = "true" ]; then PERF_POLICY=required; else PERF_POLICY=allow-skip; fi
          check 'SU-M0-SMOKE/单元分片' '${{ needs.l1-unit-shards.result }}' required
          check 'SU-M0-UI/UI 关键路径' '${{ needs.l1-ui-suite.result }}'    required
          check 'SU-M0-GOLDEN/金样回归' '${{ needs.l1-golden.result }}'     required
          check 'SU-M0-PERF/性能初筛'  '${{ needs.l1-perf-screen.result }}' "$PERF_POLICY"
          exit $fail

  # ---------------------------------------------------------------------------
  # 发布归档 —— 仅 v* tag 触发（dev-pm-spec §9.3）
  # ---------------------------------------------------------------------------
  tag-archive:
    name: 'Tag · 未签名 xcarchive'
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [l0-static-gate, l1-build-for-testing]
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ARCHIVE_PATH: Build/VitaLiber.xcarchive
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Xcode project
        run: |
          if [ -e "$XCODEPROJ" ]; then echo "使用已提交的 $XCODEPROJ"
          elif [ -f project.yml ]; then brew install xcodegen && xcodegen generate
          else echo "::error::$XCODEPROJ 缺失且无 project.yml"; exit 1; fi
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          mkdir -p Build
          xcodebuild archive \
            -project "$XCODEPROJ" -scheme "$SCHEME" \
            -archivePath "$ARCHIVE_PATH" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath Build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee Build/xcodebuild-archive.log
      - name: Package archive
        run: ditto -c -k --keepParent "$ARCHIVE_PATH" Build/VitaLiber-${{ github.ref_name }}.xcarchive.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VitaLiber-xcarchive-${{ github.ref_name }}
          path: Build/VitaLiber-${{ github.ref_name }}.xcarchive.zip
          retention-days: 30
