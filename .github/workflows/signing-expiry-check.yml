# ============================================================================
# 签名材料到期周检（2026-09-27 委员会 P5）
# 主流水线的到期门禁只在发布时跑、≤30 天 warning 无人值守即静默悬崖——
# 本 workflow 每周日 UTC 23:17 + 手动派发，独立核对证书/PP 剩余天数，
# 红则打开 issue 指派轮换（轮换清单见 build-testflight.yml 头注）。
# ============================================================================
name: Signing Expiry Check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * 0'

permissions:
  contents: read
  issues: write

jobs:
  check:
    name: '签名材料到期周检'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 检查证书/PP 剩余天数
        env:
          APPLE_DEV_CERT_P12: ${{ secrets.APPLE_DEV_CERT_P12 }}
          APPLE_DIS_CERT_P12: ${{ secrets.APPLE_DIS_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          source scripts/release/check-signing-expiry.sh
          red=0
          check_cert() {
            local label="$1" p12="$2"
            if [ -z "$p12" ]; then echo "::warning::$label secret 未配置，跳过"; return 0; fi
            echo "$p12" | tr -d ' \n\r' | base64 -d > /tmp/exp.p12
            enddate=$(openssl pkcs12 -in /tmp/exp.p12 -nodes -passin pass:"$APPLE_CERT_PASSWORD" 2>/dev/null \
              | openssl x509 -noout -enddate 2>/dev/null | sed 's/notAfter=//') || enddate=""
            if [ -z "$enddate" ]; then echo "::error::$label 解析失败（密码错误或非 PKCS12）"; red=1; return 0; fi
            verdict "$label" "$enddate" || red=1
            rm -f /tmp/exp.p12
          }
          check_cert "DEV 证书" "$APPLE_DEV_CERT_P12"
          check_cert "DIS 证书" "$APPLE_DIS_CERT_P12"
          # PP 到期：security cms 是 macOS 专属；ubuntu 上 openssl cms 可解析 embedded plist，
          # 此处先覆盖证书面（发布链路的最短到期者）；PP 面由主流水线门禁覆盖。
          if [ "$red" -ne 0 ]; then
            echo "::error::签名材料进入轮换窗口——按 build-testflight.yml 头注轮换清单执行"
            exit 1
          fi
          echo "签名材料到期周检通过 ✓"
