# ============================================================================
# Workflow 执行记录清理
#
# 定时清理（业主 2026-09-15 两规则）：
# 规则A：cleanup-runs.yml 自身的所有执行记录——无论成功还是失败——全部删除；
#        正在运行的本轮 run 无法自删（API 禁删进行中的 run），由下一轮清扫。
# 规则B：其他 workflow 只保留最近一次成功；任何非 success 结论
#        （failure/cancelled/skipped/timed_out）与非最近一次成功全部删除。
# 包括已删除的 workflow 的历史记录也会被清理。
# 调度：中国时间每天凌晨 0:00（UTC 16:00）
# ============================================================================
name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理历史执行记录
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 清理各 workflow 历史记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不使用 set -u / pipefail：GitHub Actions 默认 bash -e 已足够；
          # -u 在 mktemp 失败等边界场景会制造无意义的崩溃，
          # pipefail 与 2>/dev/null 组合容易吞掉关键诊断信息。
          REPO="${{ github.repository }}"
          echo "=== Workflow Run 清理开始 ==="
          echo "仓库: $REPO"
          echo ""

          # ── 收集现存 workflow 注册表（id/name/path 三列） ──
          # 审查修正（2026-09-15）：按 workflow 文件路径/ID 清理，而不是只按 run.name。
          # reusable workflow（如 release-asr-models.yml）被 TestFlight 调用时，run.name
          # 容易与展示名/调用关系漂移；path 才是 CI 执行记录的稳定登记键。
          WORKFLOWS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          if ! gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[] | [.id, .name, .path] | @tsv' > "$WORKFLOWS_FILE" 2>/dev/null; then
            echo "警告: 获取 workflow 列表失败——本轮跳过清理（防误删全库）"
            rm -f "$WORKFLOWS_FILE"
            exit 0
          fi
          if [ ! -s "$WORKFLOWS_FILE" ]; then
            echo "警告: workflow 注册表为空——本轮跳过清理（防误删全库）"
            rm -f "$WORKFLOWS_FILE"
            exit 0
          fi
          echo "现存 workflow:"
          awk -F '\t' '{ printf "  - %s (%s) #%s\n", $2, $3, $1 }' "$WORKFLOWS_FILE"
          echo ""

          # 明确登记必须受清理策略覆盖的发布链 workflow；缺失时给 warning，
          # 防“包构建流没有登记在 CI 执行记录清理面”。
          REQUIRED_PATHS=".github/workflows/build-testflight.yml .github/workflows/release-asr-models.yml .github/workflows/asc-build-status.yml .github/workflows/cleanup-runs.yml"
          for required in $REQUIRED_PATHS; do
            if ! awk -F '\t' -v p="$required" '$3 == p { found=1 } END { exit found ? 0 : 1 }' "$WORKFLOWS_FILE"; then
              echo "::warning::workflow 未登记或已禁用: $required"
            fi
          done

          # ── 按 workflow 逐个拉全量 completed runs ──
          # 原实现只用 `gh run list --limit 500` 拉全仓最近 500 条：仓库活跃时，
          # 某个 workflow 的旧成功记录可能根本不在样本里，导致“非最近一次成功”不会被删。
          # 现在按 workflow id 分页拉取，保证每个现存 workflow 独立执行“仅保留最近一次成功”。
          COUNTS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          DELETE_FAILURES_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          echo "0 0" > "$COUNTS_FILE"

          delete_run() {
            local id="$1" reason="$2" err rc
            # 直接调用 REST API DELETE /actions/runs/{id}：
            # 1) 不依赖 `gh run delete` 的交互确认行为，非 TTY 下行为确定；
            # 2) 错误信息完整回显并落盘，不再被 2>/dev/null 吞掉根因。
            err=$(gh api --method DELETE "repos/$REPO/actions/runs/$id" 2>&1)
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "  删除: #$id ($reason)"
              return 0
            fi
            echo "  删除失败: #$id ($reason) — $(echo "$err" | tr '\n' ' ' | head -c 300)"
            echo "#$id	$reason	$err" >> "$DELETE_FAILURES_FILE"
            return 1
          }

          keep_or_delete_run() {
            local wf_key="$1" wf_name="$2" conclusion="$3" run_id="$4" created_at="$5" first_success_file="$6"
            read DELETED KEPT < "$COUNTS_FILE"

            # 规则0：cleanup-runs.yml 自身 → 无论成败全部删除（业主 2026-09-15 要求一）。
            # 正在运行的本轮 run 状态为 in_progress、不在 completed 列表内，由下一轮清扫。
            if [ "$wf_key" = ".github/workflows/cleanup-runs.yml" ]; then
              delete_run "$run_id" "$wf_name - cleanup 自身（全删）" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              return
            fi

            # 规则1a（2026-09-16 委员会评审·证据留存例外）：build-testflight.yml 的
            # **failure 保留最近 K 次**——性能回归定位（「为什么从 25 分钟变 43 分钟」）
            # 与偶发失败（日界/并发/设备差异）复盘都需要跨时间的失败对照集，
            # 而清理策略此前把它们全部销毁（委员会两角色独立命中）。其余非成功
            # （cancelled/timed_out/skipped）仍按规则 1 删除（多为并发取消噪音）。
            if [ "$wf_key" = ".github/workflows/build-testflight.yml" ] && [ "$conclusion" = "failure" ]; then
              read FAIL_KEPT < "$FAILURES_FILE"
              if [ "$FAIL_KEPT" -lt "${FAILURE_KEEP:-5}" ]; then
                echo "  保留: #$run_id (build-testflight 失败证据 $((FAIL_KEPT + 1))/${FAILURE_KEEP:-5})"
                echo $((FAIL_KEPT + 1)) > "$FAILURES_FILE"
                KEPT=$((KEPT + 1))
                echo "$DELETED $KEPT" > "$COUNTS_FILE"
                return
              fi
            fi

            # 规则1：任何非 success 结论 → 直接删除
            # 业主 2026-09-15 要求二：非成功一律删除，包括 cancelled/failure/
            # skipped/timed_out；失败证据不在 Actions run 历史里长期保留。
            # （build-testflight 的 failure 已由规则 1a 例外保留。）
            if [ "$conclusion" != "success" ]; then
              delete_run "$run_id" "$wf_name - 非成功 ($conclusion)" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              return
            fi

            # 规则2：成功但不是最近一次成功 → 删除
            if grep -qxF "$wf_key" "$first_success_file"; then
              delete_run "$run_id" "$wf_name - 非最近一次成功" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              return
            fi

            # 规则3：最近一次成功 → 保留，记录
            echo "$wf_key" >> "$first_success_file"
            echo "  保留: #$run_id ($wf_name - 最近一次成功)"
            KEPT=$((KEPT + 1))
            echo "$DELETED $KEPT" > "$COUNTS_FILE"
          }

          while IFS=$'\t' read -r WF_ID WF_NAME WF_PATH; do
            echo "--- 清理 workflow: $WF_NAME ($WF_PATH) #$WF_ID ---"
            RUNS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
            FIRST_SUCCESS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
            # 失败证据计数（规则 1a，2026-09-16 委员会评审）
            FAILURES_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
            echo 0 > "$FAILURES_FILE"
            if gh api --paginate "repos/$REPO/actions/workflows/$WF_ID/runs?status=completed&per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .conclusion, .created_at] | @tsv' \
              > "$RUNS_FILE" 2>/dev/null; then
              if [ ! -s "$RUNS_FILE" ]; then
                echo "  无 completed run"
              else
                SORTED_RUNS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
                sort -t $'\t' -k4,4r "$RUNS_FILE" > "$SORTED_RUNS_FILE"
                echo "  completed run 总数: $(wc -l < "$SORTED_RUNS_FILE")"
                while IFS=$'\t' read -r RUN_ID RUN_NAME CONCLUSION CREATED_AT; do
                  keep_or_delete_run "$WF_PATH" "$WF_NAME" "$CONCLUSION" "$RUN_ID" "$CREATED_AT" "$FIRST_SUCCESS_FILE"
                done < "$SORTED_RUNS_FILE"
                rm -f "$SORTED_RUNS_FILE"
              fi
            else
              echo "::warning::拉取 workflow runs 失败: $WF_NAME ($WF_PATH)"
            fi
            rm -f "$RUNS_FILE" "$FAILURES_FILE" "$FIRST_SUCCESS_FILE"
          done < "$WORKFLOWS_FILE"

          # ── 已删除 workflow 历史兜底 ──
          # API 的 workflow 注册表只覆盖现存 workflow；已删除 workflow 的 run 仍会出现在
          # actions/runs 全局列表中。这里分组按 path/name 直接删除，避免历史垃圾长期保留。
          echo "--- 清理已删除 workflow 历史记录（全局兜底） ---"
          DELETED_RUNS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          if gh api --paginate "repos/$REPO/actions/runs?status=completed&per_page=100" \
            --jq '.workflow_runs[] | [.id, .name, .path, .conclusion, .created_at] | @tsv' \
            > "$DELETED_RUNS_FILE" 2>/dev/null; then
            while IFS=$'\t' read -r RUN_ID RUN_NAME RUN_PATH CONCLUSION CREATED_AT; do
              [ -n "$RUN_PATH" ] || continue
              if awk -F '\t' -v p="$RUN_PATH" '$3 == p { found=1 } END { exit found ? 0 : 1 }' "$WORKFLOWS_FILE"; then
                continue
              fi
              read DELETED KEPT < "$COUNTS_FILE"
              delete_run "$RUN_ID" "$RUN_NAME - workflow 已删除 ($RUN_PATH)" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
            done < "$DELETED_RUNS_FILE"
          else
            echo "::warning::拉取全局 run 列表失败——跳过已删除 workflow 兜底清理"
          fi

          read TOTAL_DELETED TOTAL_KEPT < "$COUNTS_FILE"

          echo ""
          echo "=== 清理完成 ==="
          echo "总计删除: $TOTAL_DELETED 条"
          echo "总计保留: $TOTAL_KEPT 条"
          if [ -s "$DELETE_FAILURES_FILE" ]; then
            TOTAL_FAILURES=$(wc -l < "$DELETE_FAILURES_FILE")
            echo "删除失败: $TOTAL_FAILURES 条（明细如下）"
            echo "::error::存在删除失败的 workflow run：$TOTAL_FAILURES 条，见日志明细"
            cat "$DELETE_FAILURES_FILE"
          else
            echo "删除失败: 0 条（全部删除请求成功）"
          fi

          rm -f "$WORKFLOWS_FILE" "$DELETED_RUNS_FILE" "$COUNTS_FILE" "$DELETE_FAILURES_FILE"
