# ============================================================================
# Workflow 执行记录清理
#
# 定时清理：每个 workflow 保留最近一次成功的执行记录 + 近 7 天内失败的
# 记录（失败证据是诊断/审计材料，发布流水线尤其需要），其余删除。
# 包括已删除的 workflow 的历史记录也会被清理。
# 调度：中国时间每天凌晨 0:00（UTC 16:00）
# ============================================================================
name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理历史执行记录
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 清理各 workflow 历史记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 不使用 set -u / pipefail：GitHub Actions 默认 bash -e 已足够；
          # -u 在 mktemp 失败等边界场景会制造无意义的崩溃，
          # pipefail 与 2>/dev/null 组合容易吞掉关键诊断信息。
          REPO="${{ github.repository }}"
          echo "=== Workflow Run 清理开始 ==="
          echo "仓库: $REPO"
          echo ""

          # ── 收集现存 workflow 名称 ──
          EXISTING_WFS=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[].name' 2>/dev/null || true)

          if [ -z "$EXISTING_WFS" ]; then
            echo "警告: 获取 workflow 列表失败——本轮跳过清理（防误删全库）"
            exit 0
          fi
          echo "现存 workflow:"
          echo "$EXISTING_WFS" | sed 's/^/  - /'
          echo ""

          # ── 拉取已完成的 run（按 createdAt 倒序） ──
          ALL_RUNS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          if gh run list \
            --repo "$REPO" \
            --status completed \
            --limit 500 \
            --json databaseId,name,conclusion,createdAt \
            > "$ALL_RUNS_FILE.raw" 2>/dev/null; then
            jq -s 'sort_by(.createdAt) | reverse' \
              "$ALL_RUNS_FILE.raw" > "$ALL_RUNS_FILE"
          else
            echo "警告: gh run list 失败——本轮跳过清理"
            rm -f "$ALL_RUNS_FILE" "$ALL_RUNS_FILE.raw"
            exit 0
          fi
          rm -f "$ALL_RUNS_FILE.raw"

          RUN_COUNT=$(jq 'length' "$ALL_RUNS_FILE" 2>/dev/null || echo 0)
          echo "已拉取 $RUN_COUNT 条已完成 run"
          if [ "$RUN_COUNT" -eq 0 ]; then
            echo "无 run 可清理"
            rm -f "$ALL_RUNS_FILE"
            exit 0
          fi
          echo ""

          # ── 单次遍历，逐条判断 ──
          FOUND_FIRST_SUCCESS=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          COUNTS_FILE=$(mktemp) || { echo "错误: mktemp 失败"; exit 1; }
          echo "0 0" > "$COUNTS_FILE"

          delete_run() {
            local id="$1" reason="$2"
            if gh run delete "$id" --repo "$REPO" 2>/dev/null; then
              echo "  删除: #$id ($reason)"
              return 0
            fi
            echo "  跳过: #$id ($reason — 删除失败)"
            return 1
          }

          MY_NAME="Cleanup Workflow Runs"
          while IFS=$'\t' read -r WF_NAME CONCLUSION RUN_ID CREATED_AT; do
            read DELETED KEPT < "$COUNTS_FILE"

            # 规则0：cleanup 自身 → 全部删除
            if [ "$WF_NAME" = "$MY_NAME" ]; then
              delete_run "$RUN_ID" "cleanup 自身" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则1：workflow 不存在 → 直接删除
            if ! echo "$EXISTING_WFS" | grep -qxF "$WF_NAME"; then
              delete_run "$RUN_ID" "$WF_NAME - workflow 已删除" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则2：未成功 → 删除
            if [ "$CONCLUSION" != "success" ]; then
              delete_run "$RUN_ID" "$WF_NAME - 未成功($CONCLUSION)" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则3：成功但不是首次成功 → 删除
            if grep -qxF "$WF_NAME" "$FOUND_FIRST_SUCCESS"; then
              delete_run "$RUN_ID" "$WF_NAME - 非首次成功" && DELETED=$((DELETED + 1))
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则4：首次成功 → 保留，记录
            echo "$WF_NAME" >> "$FOUND_FIRST_SUCCESS"
            echo "  保留: #$RUN_ID ($WF_NAME - 首次成功)"
            KEPT=$((KEPT + 1))
            echo "$DELETED $KEPT" > "$COUNTS_FILE"
          done < <(jq -r '.[] | "\(.name)\t\(.conclusion)\t\(.databaseId)\t\(.createdAt)"' "$ALL_RUNS_FILE")

          read TOTAL_DELETED TOTAL_KEPT < "$COUNTS_FILE"
          rm -f "$ALL_RUNS_FILE" "$FOUND_FIRST_SUCCESS" "$COUNTS_FILE"

          echo ""
          echo "=== 清理完成 ==="
          echo "总计删除: $TOTAL_DELETED 条"
          echo "总计保留: $TOTAL_KEPT 条"
