# ============================================================================
# Workflow 执行记录清理
#
# 定时清理：只保留每个 workflow 最近一次成功的执行记录，其余全部删除。
# 包括已删除的 workflow 的历史记录也会被清理。
# 调度：中国时间每天凌晨 0:00（UTC 16:00）
# ============================================================================
name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理历史执行记录
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 清理各 workflow 历史记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          echo "=== Workflow Run 清理开始 ==="
          echo "仓库: $REPO"
          echo ""

          # ── 第1步：收集所有现存 workflow 名称 ──
          EXISTING_WFS=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[].name' 2>/dev/null)

          # ── 第2步：拉取所有已完成的 run，按 workflow 分组 ──
          ALL_RUNS_FILE=$(mktemp)
          gh run list \
            --repo "$REPO" \
            --status completed \
            --limit 500 \
            --json databaseId,name,conclusion,createdAt \
            2>/dev/null > "$ALL_RUNS_FILE"

          # 按 workflow name 分组（用临时文件）
          GROUP_DIR=$(mktemp -d)
          jq -r '.[] | "\(.name)\t\(.databaseId)\t\(.conclusion)\t\(.createdAt)"' \
            "$ALL_RUNS_FILE" | while IFS=$'\t' read -r WF_NAME RUN_ID CONCLUSION CREATED_AT; do
            echo "$RUN_ID" >> "$GROUP_DIR/$WF_NAME"
          done

          TOTAL_DELETED=0
          TOTAL_KEPT=0

          # ── 第3步：遍历每个 workflow（包括已删除的） ──
          for WF_FILE in "$GROUP_DIR"/*; do
            WF_NAME=$(basename "$WF_FILE")
            echo "── $WF_NAME ──"

            # 找该 workflow 最近一次成功的 run
            LATEST_SUCCESS_ID=$(jq -r \
              --arg wf "$WF_NAME" \
              '[.[] | select(.name == $wf and .conclusion == "success")] |
               sort_by(.createdAt) | last | .databaseId // empty' \
              "$ALL_RUNS_FILE" 2>/dev/null)

            # 如果没有成功记录，用最新的任何 run
            if [ -z "$LATEST_SUCCESS_ID" ]; then
              LATEST_SUCCESS_ID=$(jq -r \
                --arg wf "$WF_NAME" \
                '[.[] | select(.name == $wf)] |
                 sort_by(.createdAt) | last | .databaseId // empty' \
                "$ALL_RUNS_FILE" 2>/dev/null)
            fi

            if [ -z "$LATEST_SUCCESS_ID" ]; then
              echo "  无任何记录，跳过"
              echo ""
              continue
            fi
            echo "  保留: #$LATEST_SUCCESS_ID"

            DELETED=0
            KEPT=0
            while read -r RUN_ID; do
              if [ "$RUN_ID" = "$LATEST_SUCCESS_ID" ]; then
                KEPT=$((KEPT + 1))
                continue
              fi
              if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
                echo "  删除: #$RUN_ID"
                DELETED=$((DELETED + 1))
              fi
            done < "$WF_FILE"

            TOTAL_DELETED=$((TOTAL_DELETED + DELETED))
            TOTAL_KEPT=$((TOTAL_KEPT + KEPT))
            echo "  本轮删除 $DELETED，保留 $KEPT"
            echo ""
          done

          # ── 清理 ──
          rm -rf "$ALL_RUNS_FILE" "$GROUP_DIR"

          echo "=== 清理完成 ==="
          echo "总计删除: $TOTAL_DELETED 条"
          echo "总计保留: $TOTAL_KEPT 条"
