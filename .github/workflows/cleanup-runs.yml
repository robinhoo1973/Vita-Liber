# ============================================================================
# Workflow 执行记录清理
#
# 定时清理：只保留每个 workflow 最近一次成功的执行记录，其余全部删除。
# 调度：中国时间每天凌晨 0:00（UTC 16:00）
# ============================================================================
name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理历史执行记录
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 清理各 workflow 历史记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          echo "=== Workflow Run 清理开始 ==="
          echo "仓库: $REPO"
          echo ""

          TOTAL_DELETED=0
          TOTAL_KEPT=0

          # 获取所有 workflow 文件名
          WORKFLOW_FILES=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[].path' 2>/dev/null)

          if [ -z "$WORKFLOW_FILES" ]; then
            echo "未找到任何 workflow"
            exit 0
          fi

          while IFS= read -r WF_PATH; do
            WF_NAME=$(basename "$WF_PATH")
            echo "── $WF_NAME ──"

            # 找最近一次成功的 run ID
            LATEST_SUCCESS_ID=$(gh run list \
              --repo "$REPO" \
              --workflow "$WF_NAME" \
              --status completed \
              --limit 200 \
              --json databaseId,conclusion,createdAt \
              --jq '[.[] | select(.conclusion == "success")] | sort_by(.createdAt) | last | .databaseId' \
              2>/dev/null)

            if [ -z "$LATEST_SUCCESS_ID" ] || [ "$LATEST_SUCCESS_ID" = "null" ]; then
              echo "  无成功记录，跳过"
              echo ""
              continue
            fi
            echo "  保留: #$LATEST_SUCCESS_ID"

            # 获取所有已完成的 run ID（用临时文件避免子 shell 问题）
            RUN_IDS_FILE=$(mktemp)
            gh run list \
              --repo "$REPO" \
              --workflow "$WF_NAME" \
              --status completed \
              --limit 500 \
              --json databaseId \
              --jq '.[].databaseId' 2>/dev/null > "$RUN_IDS_FILE"

            DELETED=0
            KEPT=0
            while read -r RUN_ID; do
              if [ "$RUN_ID" = "$LATEST_SUCCESS_ID" ]; then
                KEPT=$((KEPT + 1))
                continue
              fi
              if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
                echo "  删除: #$RUN_ID"
                DELETED=$((DELETED + 1))
              fi
            done < "$RUN_IDS_FILE"
            rm -f "$RUN_IDS_FILE"

            TOTAL_DELETED=$((TOTAL_DELETED + DELETED))
            TOTAL_KEPT=$((TOTAL_KEPT + KEPT))
            echo "  本轮删除 $DELETED，保留 $KEPT"
            echo ""
          done <<< "$WORKFLOW_FILES"

          echo "=== 清理完成 ==="
          echo "总计删除: $TOTAL_DELETED 条"
          echo "总计保留: $TOTAL_KEPT 条"
