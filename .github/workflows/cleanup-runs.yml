# ============================================================================
# Workflow 执行记录清理
#
# 定时清理：只保留每个 workflow 最近一次成功的执行记录，其余全部删除。
# 包括已删除的 workflow 的历史记录也会被清理。
# 调度：中国时间每天凌晨 0:00（UTC 16:00）
# ============================================================================
name: Cleanup Workflow Runs

on:
  schedule:
    - cron: '0 16 * * *'   # UTC 16:00 = 北京时间 00:00
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: 清理历史执行记录
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 清理各 workflow 历史记录
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          echo "=== Workflow Run 清理开始 ==="
          echo "仓库: $REPO"
          echo ""

          # ── 收集现存 workflow 名称 ──
          EXISTING_WFS=$(gh api "repos/$REPO/actions/workflows" \
            --jq '.workflows[].name' 2>/dev/null)

          # ── 拉取所有已完成的 run（按时间倒序，最新在前） ──
          ALL_RUNS_FILE=$(mktemp)
          gh run list \
            --repo "$REPO" \
            --status completed \
            --limit 500 \
            --json databaseId,name,conclusion,createdAt \
            --jq 'sort_by(.createdAt) | reverse' \
            2>/dev/null > "$ALL_RUNS_FILE"

          # ── 单次遍历，逐条判断 ──
          # 已记录「首次成功」的 workflow
          FOUND_FIRST_SUCCESS=$(mktemp)
          COUNTS_FILE=$(mktemp)
          echo "0 0" > "$COUNTS_FILE"

          # 用 process substitution 避免子 shell 问题
          MY_NAME="Cleanup Workflow Runs"
          while IFS=$'\t' read -r WF_NAME CONCLUSION RUN_ID; do
            read DELETED KEPT < "$COUNTS_FILE"

            # 规则0：cleanup 自身 → 全部删除（当前运行的 run 是 in_progress，不在列表中）
            if [ "$WF_NAME" = "$MY_NAME" ]; then
              if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
                echo "  删除: #$RUN_ID (cleanup 自身)"
                DELETED=$((DELETED + 1))
              fi
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则1：workflow 不存在 → 直接删除
            if ! echo "$EXISTING_WFS" | grep -qxF "$WF_NAME"; then
              if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
                echo "  删除: #$RUN_ID ($WF_NAME - workflow 已删除)"
                DELETED=$((DELETED + 1))
              fi
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则2：未成功 → 直接删除
            if [ "$CONCLUSION" != "success" ]; then
              if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
                echo "  删除: #$RUN_ID ($WF_NAME - 未成功)"
                DELETED=$((DELETED + 1))
              fi
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则3：成功但不是首次成功 → 删除
            if grep -qxF "$WF_NAME" "$FOUND_FIRST_SUCCESS"; then
              if gh run delete "$RUN_ID" --repo "$REPO" 2>/dev/null; then
                echo "  删除: #$RUN_ID ($WF_NAME - 非首次成功)"
                DELETED=$((DELETED + 1))
              fi
              echo "$DELETED $KEPT" > "$COUNTS_FILE"
              continue
            fi

            # 规则4：首次成功 → 保留，记录
            echo "$WF_NAME" >> "$FOUND_FIRST_SUCCESS"
            echo "  保留: #$RUN_ID ($WF_NAME - 首次成功)"
            KEPT=$((KEPT + 1))
            echo "$DELETED $KEPT" > "$COUNTS_FILE"
          done < <(jq -r '.[] | "\(.name)\t\(.conclusion)\t\(.databaseId)"' "$ALL_RUNS_FILE")

          read TOTAL_DELETED TOTAL_KEPT < "$COUNTS_FILE"
          rm -f "$ALL_RUNS_FILE" "$FOUND_FIRST_SUCCESS" "$COUNTS_FILE"

          echo ""
          echo "=== 清理完成 ==="
          echo "总计删除: $TOTAL_DELETED 条"
          echo "总计保留: $TOTAL_KEPT 条"
