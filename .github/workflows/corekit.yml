name: CoreKit SPM
on: { push: { branches: [master] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-24.04   # 系统 sqlite ≥3.37，满足 GRDB WALSnapshot 符号
    timeout-minutes: 20
    steps:
      - { uses: actions/checkout@v4 }
      - { uses: dtolnay/swift-toolchain@v1, with: { 'swift-version': '6' } }
      - run: swift test --package-path CoreKit
