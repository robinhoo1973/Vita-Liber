name: CoreKit SPM
on: { push: { branches: [master] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # 哨兵（评审补，ERR#27 同族）：构建成功 ≠ 测试执行。测试二进制若因动态库
      # 缺失等原因加载失败，历史上有过「构建通过、0 个测试执行」的假绿形态——
      # 必须断言输出中出现 swift-testing 的测试汇总行，否则本 job 直接失败。
      - run: |
          swift test --package-path CoreKit 2>&1 | tee /tmp/corekit-tests.log
          grep -q "Test run with" /tmp/corekit-tests.log \
            || { echo "::error::未检测到测试执行汇总——测试二进制未实际运行"; exit 1; }
      - run: bash .github/workflows/l0-static-gate.sh   # L0 与测试同容器复核
