name: CoreKit SPM
on: { push: { branches: [master] }, pull_request: {} }
jobs:
  test:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path CoreKit
      - run: bash .github/workflows/l0-static-gate.sh   # L0 与测试同容器复核
