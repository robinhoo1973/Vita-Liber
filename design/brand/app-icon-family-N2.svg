  <ellipse cx="344" cy="694" rx="46" ry="10" fill="#7C9FC9" opacity=".30"/>
  <circle cx="344" cy="606" r="44" fill="url(#skin)"/>
  <path d="M290 690C290 668 312 642 344 642C376 642 398 668 398 690Z" fill="url(#skin)"/>
