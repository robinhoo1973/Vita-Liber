  <path d="M512 400C448 354 344 342 224 342L224 682C344 682 448 698 512 710Z" fill="url(#page)"/>
  <path d="M512 400C576 354 680 342 800 342L800 682C680 682 576 698 512 710Z" fill="url(#page)"/>
